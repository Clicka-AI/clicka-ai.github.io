 {t:'p',x:'Refer to relevant chapters in EDLIZ for other paediatric conditions and note that appropriate paediatric doses have been included.'},
 {t:'p',x:'Note: doses are also given by age and weight wherever possible, and volumes of liquids or injections to be administered are indicated. However, always check the concentration of the preparation, as preparations may change. This should not be a ‘short-cut’ to calculating the proper dose.'},
 {t:'h',x:'Routine management at birth'},
 {t:'ul',x:['Do not routinely suction mouth but suction only if there is something (e.g. thick meconium) to suck out.','Dry and wrap up, preferably in a dry pre-warmed soft towel.','Delayed cord clamping: clamping the umbilical cord after 1 minute is recommended for all normal births except in intrauterine growth restriction (IUGR), infants of diabetic mothers and asphyxia.','Weigh the baby.']},
 {t:'g',title:'To prevent neonatal ophthalmia, instil eye ointment into both eyes:',rows:[R('tetracycline eye ointment 1%','','C V','instil into both eyes','once only','at birth')]},
 {t:'g',title:'To prevent haemorrhagic disease of the newborn, give:',rows:[X(R('vitamin K','im','C V','>1.5kg = 1mg\n<1.5kg = 0.5mg','once only','single dose',{k:'wt',b:[[0,1.5,'0.5 mg'],[1.5,99,'1 mg']]}),'vitk-15')]},
 {t:'ul',x:['Hand the baby to the mother for her to put immediately to breast.','Put baby skin to skin with the mother.','DO NOT LEAVE THE BABY ALONE.']},
 {t:'h',x:'Helping babies survive'},
 {t:'p',x:'Every newborn baby must receive the ‘Essential Care for Every Baby’ package of care. This is essential for preventing and managing common illnesses in the first 24 hours of life because that is when newborn mortality is highest.'},
 FIG('ecb','Essential care for every baby: action plan'),
 FIG('hbb','Helping babies breathe: prepare for birth'),
 {t:'h',x:'Resuscitation of the newborn'},
 {t:'p',x:'DO NOT LEAVE THE BABY ALONE. IF THE BABY NEEDS RESUSCITATION, FOLLOW THE PROTOCOL BELOW.'},
 FIG('resus','Neonatal resuscitation algorithm: birth to initial stabilisation'),
 {t:'p',x:'Ensuring adequate warmth and ventilation (either by mask or intubation) is much more important than administering any medicines. The following may be useful:'},
 {t:'g',title:'Neonatal resuscitation post maternal pethidine administration (respiratory depression, only if the mother was given pethidine in labour):',rows:[
  X(R('naloxone 20mcg/ml','im (NB: check strength)','C V','<1kg 10mcg = 0.5ml\n1-2kg 20mcg = 1ml\n2-3kg 30mcg = 1.5ml\n>3kg 40mcg = 2ml','repeat as necessary','',{k:'wt',b:[[0,1,'10 mcg = 0.5 ml'],[1,2,'20 mcg = 1 ml'],[2,3,'30 mcg = 1.5 ml'],[3,99,'40 mcg = 2 ml']]}),'nalox-b'),
  'AND',
  R('adrenaline','1:10,000 iv (NB: check strength)','C V','10mcg/kg (1ml/kg)','give after every 3-5 min if HR < 60 bpm','',{k:'mgkg',lo:10,u:'mcg'})]}]},
{id:'neo-feeding',name:'Newborn: feeding, fluids and breastmilk fortification',sec:'Newborn care',blocks:[
 {t:'h',x:'Feeding'},
 {t:'p',x:'Healthy term babies and late preterm babies more than 34 weeks are usually able to suck unless they are ill.'},
 {t:'ul',x:['Breastfeed; exclusive breastfeeding is encouraged.','Initiate breastfeeding within the first hour of life.','Allow mothers to breastfeed on demand and room-in.']},
 {t:'h',x:'For sick and/or premature infants who are unable to suck'},
 {t:'ul',x:['Give expressed breast milk (EBM) via nasogastric or orogastric tube or cup.','Use formula feeds only if EBM is not available.','Give preterm infant milk formula if <2000g and/or 35 weeks.','Standard infant formula ≥2000g.']},
 {t:'h',x:'Fluid requirements'},
 {t:'ul',x:['Infants ≥1500g and ≥32 weeks: start on intermittent bolus feeds at 60 mls/kg/day and increase by 30 mls/kg/day as tolerated to a maximum of 150 mls/kg/day for term babies and 200 mls/kg/day for preterm infants.','Infants <1500g or <32 weeks should receive IV fluids to allow gradual increase of enteral feeds. Start enteral feeds at 20 mls/kg/day and increase by 30 mls/kg/day.','Keep infants <1500g/<32 weeks nil by mouth immediately after birth (unless mother’s colostrum is present) to allow mum to start expressing breastmilk.']},
 {t:'m',title:'Preterm fluids and feed management protocol (ml/kg/day)',li:1,cols:['Weight band or gestational age','Fluid','Day 0','Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7'],rows:[

 {t:'h',x:'Choice of fluids for use with the preterm protocol'},
 {t:'ul',x:['10% dextrose if >1kg.','5-10% dextrose if <1kg.','Blood glucose must be monitored in the first 36-48 hours and can be stopped if normal.','Consider transfer to a specialist unit for babies unable to feed and requiring intravenous fluids for longer than 3 days.','ALWAYS KEEP THE BABY WARM.']},
 {t:'h',x:'Breastmilk fortification'},
 {t:'p',x:'Breastmilk fortification helps to meet the increased energy and mineral requirements of preterm infants.'},
 {t:'m',title:'Breastmilk fortification with FM85 in preterm infants',li:0,cols:['','Guidance'],rows:[
  [['**Age/weight of neonate'],['Fortify breastmilk of preterm neonates <1500 g or <32 weeks']],
  [['**When to fortify'],['For neonates with poor weight gain, start fortification when neonate is tolerating 160 ml/kg/day of EBM']],
  [['**How much to give'],['Bolus feeds ≤24 ml: add 0.5 g FM85','Bolus feeds ≥25 ml: add 1 g FM85']],
  [['**Total volume recommended'],['If breastmilk is fortified a total volume of 160 ml/kg/day will suffice to meet energy requirements']]]}]},
{id:'neo-sepsis',name:'Neonatal infection and sepsis',sec:'Neonatal conditions',blocks:[
 {t:'h',x:'Indications for doing a blood culture and starting antibiotics in the first 48 hours'},
 {t:'ul',x:['Any major criterion or two or more minor criteria (see table below): do a blood culture and start antibiotics.','Suspected sepsis: give antibiotics as soon as possible, within 1 hour.','One minor criterion present: observe the baby on postnatal wards for 12 hours.','Start antibiotics if the baby is not feeding well, has respiratory distress or appears lethargic or sick in any other way.']},
 {t:'m',title:'Criteria for initiating empiric antibiotics in neonates',li:0,cols:['Criteria','Start antibiotics if'],rows:[
  [['**Major criteria'],['Any one of these:','Confirmed sepsis or chorioamnionitis in mother','Confirmed or suspected sepsis in twin','Seizures','Severe respiratory distress in a term infant','Respiratory distress starting more than 4 h after birth','Signs of shock']],
  [['**Minor criteria: antenatal'],['Any two minor criteria:','Rupture of membranes >18 h','Spontaneous preterm birth','GBS sepsis in previous baby, or documented GBS carriage in this pregnancy (urine or vaginal swab)']],
  [['**Minor criteria: natal'],['Born before arrival','Meconium-stained liquor']],
  [['**Minor criteria: postnatal'],['Respiratory distress not obviously related to environmental hypothermia or “delayed transition to extra-uterine life” (mild to moderate distress apparent soon after birth that is improving with time)','Hypoxia / apnoea','Hypoglycaemia / hyperglycaemia not otherwise explained','Temperature instability not explained by environmental factors','Acidosis not obviously related to HE','Unexplained bleeding or thrombocytopenia','Mild encephalopathy / altered responsiveness','Altered tone not otherwise explained','Feed intolerance / feeding difficulty','Abnormal heart rate (<90 or >160)','Jaundice in first 24 h']]]},
 {t:'h',x:'Medicine dosage for infants under 1 month'},
 {t:'p',x:'During the first month of life absorption, metabolism and excretion in a baby are not yet fully developed. For this reason, the frequency of medicine dosing is based on gestational age and not on the characteristics of the medicine.'},
 ...NSCH,
 {t:'h',x:'Neonatal sepsis'},
 {t:'p',x:'There are usually few localising signs in infants, and accurate diagnosis may not be possible. The following regimens are recommended for suspected sepsis.'},
 {t:'g',title:'Suspected sepsis in first 48 hours:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','10 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch')]},
 {t:'g',title:'Suspected sepsis after 48 hours:',rows:[X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',X(R('cloxacillin','im/iv','B V','30mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:30,u:'mg'}),'nsch')],note:'Kanamycin 7.5mg/kg/dose 2 times a day can be used if gentamicin is unavailable.'}]},
{id:'meningitis',name:'Neonatal meningitis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'If the neonate has meningitis:'},
 {t:'g',title:'Meningitis treatment in neonates:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','14-21 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','14-21 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',X(R('chloramphenicol','iv','B V','12.5mg/kg','follow penicillin dosing scheme','14-21 days',{k:'mgkg',lo:12.5,u:'mg'}),'nsch')],note:'Ampicillin can be used if benzylpenicillin is not available: dose = 75mg/kg/dose, given as per penicillin dosing scheme. Ceftriaxone can be used as an alternative (monotherapy): dose = 50mg/kg/dose (age <14 days) or 100mg/kg/dose (age ≥14 days), given once daily [or for neonates age ≥14 days, dividing the total into two equal doses for 2 times a day administration].'},
 ...NSCH]},
{id:'nec',name:'Necrotising enterocolitis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Give nothing by mouth. Supportive care is vital: oxygen, intravenous fluids, warmth, and nasogastric continuous drainage. Anticipate complications such as bleeding, vomiting, perforation, seizures. Refer for specialist diagnosis and care.'},
 {t:'g',title:'Necrotising enterocolitis:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','10 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',R('metronidazole','iv','A N','7.5mg/kg','2–3 times a day','10 days',{k:'mgkg',lo:7.5,u:'mg'})]},
 ...NSCH]},
{id:'tetanus',name:'Neonatal tetanus',sec:'Neonatal conditions',blocks:[
 {t:'g',title:'The important principle in treating these babies is minimal handling. Give:',rows:[R('benzylpenicillin','im/iv','C V','0.05MU/kg','12 hourly','5–7 days',{k:'mgkg',lo:0.05,u:'MU',dp:3}),'OR',R('procaine penicillin','im','C V','50mg/kg','once a day','5–7 days',{k:'mgkg',lo:50,u:'mg'}),'AND',R('anti-tetanus immunoglobulin','im','B E','500–1000 units','once a day','single dose')]},
 {t:'g',title:'Control of muscle spasms in tetanus:',rows:[R('diazepam','iv','C V','0.25–1mg/kg (max dose: 10mg)','4–8 hourly based on response','titrated to effect',{k:'mgkg',lo:0.25,hi:1,u:'mg',mx:10}),'OR',R('chlorpromazine','iv/im/nasogastric','C V','2mg/kg/24 hrs in divided doses','4–6 doses per day','titrated to effect'),'AND',R('phenobarbitone','iv/im/nasogastric','B E','2.5–5mg/kg','12 hourly','titrated to effect',{k:'mgkg',lo:2.5,hi:5,u:'mg'})]}]},
{id:'congenital-syphilis',name:'Congenital syphilis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Also see section on STIs.'},
 {t:'p',x:'Babies born to women found to have syphilis during pregnancy should be treated even if the mother had been adequately treated during pregnancy:'},
 {t:'g',title:'Treatment for babies born to mothers with syphilis:',rows:[R('benzathine penicillin','im','C V','30mg/kg [=50,000 u/kg]','one dose only','',{k:'mgkg',lo:30,u:'mg'})]},
 {t:'g',title:'Treatment for congenital syphilis (babies clinically infected with syphilis):',rows:[R('benzathine penicillin','im','C V','50,000 u/kg [30mg/kg]','once a week','3 weeks',{k:'mgkg',lo:30,u:'mg'}),'OR',R('procaine penicillin','im','C V','50mg/kg','once a day','10 days',{k:'mgkg',lo:50,u:'mg'}),'OR (in penicillin allergy)',R('erythromycin','po','C V','12.5mg/kg','4 times a day','10 days',{k:'mgkg',lo:12.5,u:'mg'})]}]},
{id:'jaundice',name:'Neonatal jaundice',sec:'Neonatal conditions',blocks:[
 {t:'ul',x:['Refer all babies developing jaundice within 24 hours of birth to a unit capable of performing exchange transfusion.','Refer jaundiced babies who look ill.','Jaundice developing in well babies may be treated using phototherapy. If phototherapy equipment is not available, expose to the sun intermittently for a maximum of two hours (keep warm). Shade the baby’s eyes with a loose-fitting bandage over cotton wool pads. Continue until the baby is no longer yellow.','Give an extra 20ml/kg/24 hrs of fluid. Be very careful that the baby does not get cold (or hot). Encourage increased breastfeeding.','Where possible check the serum bilirubin levels.']},
 FIG('tsb3','Phototherapy and TSB monitoring in the first week: well term infants over 3 kg'),
 FIG('tsb2','Phototherapy and TSB monitoring in the first week: well infants 2 to 3 kg and over 35 weeks'),
 FIG('jthr','Treatment of jaundice based on serum bilirubin level'),
 FIG('phot','Phototherapy thresholds'),
 FIG('exch','Exchange transfusion thresholds'),
 FIG('exproto','Protocol for doing the exchange transfusion')]},
{id:'convulsions',name:'Neonatal convulsions',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Always check for hypoglycaemia. Other common causes of neonatal convulsions: hypoxic ischaemic encephalopathy, meningitis, hypocalcaemia.'},
 {t:'g',title:'If dextrose <2.2mmol/l (45mg%) immediately give:',rows:[R('dextrose 10% infusion','','A N','4ml/kg/hr','',''),'OR',R('dextrose 10% infusion','','A N','2ml/kg bolus then 6-8ml/kg/hr continuous infusion','',''),'OR',R('dextrose 50%','slow iv bolus','C V','1ml/kg diluted with equal quantity of water for injection','','',{k:'mgkg',lo:1,u:'ml'})],note:'Recheck blood sugar (dextrostix / glucometer) in 30 minutes.'},
 {t:'p',x:'If intravenous route is impossible give breast milk through nasogastric route, 10-20ml/kg initially, and continue normal requirement 2 hourly. Dextrose should not be given by nasogastric tube. If blood glucose cannot be measured give empirical treatment with glucose.'},
 {t:'h',x:'How to prepare 10% dextrose'},
 {t:'p',x:'The formula for preparing 100 mL of fluid with a desired concentration of glucose using 5% dextrose and 25% dextrose solutions is 5X-25 = Y, where X is the required percentage of dextrose and Y is the amount of 25% dextrose (in mL) to be made up with 5% dextrose to make a total of 100 mL.'},
 {t:'p',x:'To prepare 100 ml of 10% dextrose from 5% dextrose and 25% dextrose: 5 × 10 − 25 = 25 ml of 25% dextrose, added to the remaining volume, i.e. 100 − 25 = 75 ml of 5% dextrose.'},
 {t:'h',x:'Medical management'},
 {t:'ul',x:['ABC: manage airway and breathing (have bag and mask ready); ensure circulatory access.']},
 {t:'h',x:'Anticonvulsants'},
 {t:'p',x:'Phenobarbitone is the drug of choice for neonatal seizures.'},
 {t:'g',title:'If a neonate is having seizures give:',rows:[R('phenobarbitone','iv slow bolus (over 5-10 min)','B E','20mg/kg\nrepeat every 30 min if still convulsing at dose of 10mg/kg, up to max dose of 40mg/kg\nmaintenance dose of 5mg/kg started 12 hours after loading dose','','',{k:'mgkg',lo:20,u:'mg'}),'OR',R('phenytoin','iv*','C V','20mg/kg bolus\nrepeat dose at 10mg/kg if refractory seizures\nmaintenance dose of 3-5mg/kg/day in 2-4 divided doses','','',{k:'mgkg',lo:20,u:'mg'})],note:'*Indicated when the maximum dose of phenobarbitone 40mg/kg fails to resolve the seizures or adverse effects like respiratory depression, bradycardia or hypotension occur. Please note: dilute phenytoin in normal saline. Do NOT use dextrose.'},
 {t:'h',x:'Benzodiazepines'},
 {t:'p',x:'These may be required in 15-20% of neonatal seizures.'},
 {t:'g',title:'If benzodiazepines are needed for seizure control give:',rows:[R('lorazepam','iv slow bolus (over 2-5 min)','','0.05mg/kg\nmay be repeated if still convulsing','','',{k:'mgkg',lo:0.05,u:'mg',dp:3}),'OR',R('midazolam','iv','','0.15mg/kg bolus\nfollowed by maintenance infusion at 0.1-0.4mg/kg/hr','','',{k:'mgkg',lo:0.15,u:'mg',dp:3})],note:'Avoid diazepam in neonatal seizures because of its short duration of anti-epileptic effect and its very prolonged sedative effect.'},
 {t:'h',x:'Check blood levels of calcium and magnesium'},
 {t:'p',x:'If there is hypocalcaemia give 2 mls/kg of 10% calcium gluconate.'}]},
{id:'rds',name:'Respiratory distress syndrome (RDS)',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'RDS is a common problem in premature infants. It is due to surfactant deficiency.'},
 {t:'h',x:'Treatment of RDS'},
 {t:'ul',x:['Minimal handling.','Supplemental oxygen with nasal prongs; maintain oxygen saturation 90-94%.','Give surfactant to improve the oxygenation. In term babies give surfactant 100mg/kg within 8 hours of birth. For preterm neonates give surfactant 100mg/kg, preferably within 15 minutes of birth. The dose may be repeated within 48 hours at intervals of at least 6 hours for up to 4 doses.','Use continuous positive airways pressure (CPAP) ventilation if available.','Initially no oral feeds if severe respiratory distress.','Intravenous fluids (see section on fluids).','Treat for neonatal sepsis with antibiotics (see section on neonatal sepsis).','Maintain normal temperature range by Kangaroo Mother Care or using an incubator if available.','If respiratory distress persists do a chest x-ray to rule out pneumothorax.']},
 {t:'h',x:'Prevention of RDS'},
 {t:'ul',x:['For pregnant mothers in preterm labour between 28-35 weeks gestation (at risk of premature delivery): give dexamethasone 12mg IM per dose, 2 doses, 12 hours apart.']}]},
{id:'apnoea',name:'Apnoea of prematurity',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Premature infants are at risk of apnoea due to immaturity of the respiratory centre. For prevention of apnoea in preterm babies <32/40 weeks give the following:'},
 {t:'g',title:'To improve respiratory drive, give:',rows:[R('caffeine citrate','iv infusion (for those <32/40 weeks)','B V','loading dose 20mg/kg\nand\nmaintenance dose 5mg/kg','once a day','until 34/40 weeks postpartum'),'OR',R('aminophylline','','B V','loading dose 6mg/kg (infuse over 30 minutes)\nmaintenance dose 2.5mg/kg','12 hourly','',{k:'mgkg',lo:6,u:'mg'})]},
 {t:'h',x:'Monitoring for apnoea'},
 {t:'p',x:'Use an apnoea monitor if available or a pulse oximeter with the alarm turned on for hypoxaemia.'},
 {t:'p',x:'NB. The following conditions can also cause apnoea in the premature infant and every attempt should be made to exclude them and manage:'},
 {t:'ul',x:['Central nervous system infections','Hypoxic ischaemic encephalopathy','Respiratory distress syndrome','Hypoglycaemia','Severe anaemia','Congestive cardiac failure']}]},
{id:'neo-vitamins',name:'Low birth weight: immunisation, vitamins and iron',sec:'Neonatal conditions',blocks:[
 {t:'h',x:'Immunisation'},
 {t:'p',x:'Low birth weight infants should be given all the scheduled vaccines at the time of birth and any second doses that are due at discharge and according to chronological age.'},
 {t:'h',x:'Vitamins and iron'},
 {t:'p',x:'Normal newborn babies do not require any long-term vitamin or mineral supplementation. Starting at 2 weeks of age, those babies born at <36 weeks gestation and/or <1.5kg should be given:'},
 {t:'g',title:'Vitamins:',rows:[R('vitamin D','po','B V','400 units','2 times a day','to age of 3 months'),'AND',R('folic acid','po','C E','5mg','weekly','to age of 3 months')]},
 {t:'p',x:'and, starting from the age of one month:'},
 {t:'g',title:'Iron:',rows:[R('ferrous sulphate','po','C E','3–6mg/kg elemental iron\n(60mg/5mls FeSO4 = 12mg elemental iron/5mls)','once a day','to age of 6 months',{k:'mgkg',lo:3,hi:6,u:'mg'})]}]},
{id:'neo-doses',name:'Neonatal medicine doses (infants under 1 month)',sec:'Medicine dose tables',blocks:[

{id:'danger-signs',name:'Danger signs and use of antibiotics (IMCI)',sec:'General paediatrics',blocks:[
 {t:'p',x:'For management of other paediatric conditions refer to the appropriate chapter, e.g. cardiovascular disease in children (Cardiovascular chapter), neurological conditions in children (Neurological chapter), renal tract infections in children (Renal Tract Infections chapter).'},
 {t:'h',x:'Integrated Management of Childhood Illness (IMCI)'},
 {t:'p',x:'Common paediatric conditions such as acute respiratory infections (ARI), diarrhoea, child with fever (axillary temperature 37.5°C and above), and severe malnutrition or protein energy malnutrition (PEM) are now incorporated in the Integrated Management of Childhood Illness (IMCI).'},
 {t:'h',x:'Check for general danger signs'},
 {t:'p',x:'Ask:'},
 {t:'ul',x:['if the child is not able to drink or breastfeed','if the child is vomiting everything','if the child has had convulsions','if there are periods of not breathing']},
 {t:'p',x:'Look to see if the child is lethargic or unconscious.'},
 {t:'p',x:'A child with any general danger sign needs urgent attention.'},
 {t:'h',x:'General guidelines on the use of antibiotics'},
 {t:'p',x:'Note: paediatric dose starts at 2 months in IMNCI. For babies 1-2 months see neonatal doses.'},
 {t:'ul',x:['ALWAYS COLLECT BLOOD FOR CULTURES BEFORE INITIATION OF ANTIBIOTICS IN SUSPECTED SEPSIS.','Supportive measures are often more important than antibiotics themselves: for example, fluids in diarrhoea and vomiting.','Antibiotics should be given in the full dosage appropriate for the age and weight of the child; dosage is best calculated according to body weight up to 40kg (do not exceed the adult dose).','Change to oral administration wherever possible (except for meningitis); benzylpenicillin intramuscularly/intravenously can be changed to procaine penicillin intramuscularly (if response is good) once a child is afebrile.']},
 {t:'h',x:'Fever in a malaria area'},
 {t:'ul',x:['Take a blood slide and treat for malaria (see chapter on Malaria).','Fever for more than 5 days: refer for assessment.','In malaria endemic areas, a child with pneumonia and a fever of 37.5°C or more (or a history of fever) may need an antibiotic for pneumonia and an anti-malarial for malaria.']}]},
{id:"sti-general",name:"Sexually transmitted infections: general notes",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"Accurate laboratory-proven diagnosis of sexually transmitted infections (STI) is desirable but not always possible. Management guidelines recommended in this section are based on the diagnosis of STI-associated syndromes. This involves delivery of the complete management package including provision of antibiotics for the STI syndrome, provision of health education, promoting risk reduction behaviour and treatment compliance, provision or promotion of condoms, providing information on partner referral and treatment and arranging for follow-up examination. To prevent further spread it is essential that all sex partners of persons with STI be contacted and treated. In addition to syndromic management, recommendations for the treatment of specific infections when laboratory diagnosis has been made are also given."},
 {t:"ul",x:["FIRST LINE therapy is recommended when the patient makes his/her first contact with the healthcare facility.","SECOND LINE therapy is administered when first line therapy has failed or is not available, and re-infection and poor treatment compliance have been excluded, and other diagnoses have been considered.","THIRD LINE therapy should only be used when expert attention and adequate laboratory facilities are available, and where results of treatment can be monitored."]},
 {t:"p",x:"To ensure complete cure and to avoid rapid emergence of antimicrobial resistance, doses less than those recommended must not be administered."},
 {t:"p",x:"All patients with any STI should be referred for HIV testing."},
 {t:"p",x:"Pelvic inflammatory disease: see the page under Obstetrics and gynaecology."}]},
{id:"sti-urethral",name:"Urethral discharge in men",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"The commonest causes of urethral discharge are Neisseria gonorrhoeae and Chlamydia trachomatis, and the two often co-exist. Trichomonas vaginalis can also cause a urethral discharge in men. All males with urethral discharge and all women with cervicitis should be treated for both gonorrhoea and chlamydia in view of the fact that the two coexist and present with similar signs and symptoms, unless a diagnostic test has been used to exclude one infection or another. Any sex partners in the preceding three months should be treated presumptively for the same infections as the index patient, and any other conditions found on examination. Studies (2015) from Zimbabwe showed that a small proportion of men with urethral discharge have Mycoplasma genitalium, which should be considered for treatment in cases of recurrent or persistent urethritis."},
 {t:"p",x:"Strains of N. gonorrhoeae with in-vitro and clinical resistance to ceftriaxone have emerged globally. Pharmacodynamic data suggests that 1 gram of ceftriaxone could eradicate most gonococcal strains and delay the emergence and spread of multi-drug-resistant N. gonorrhoeae. Consequently, it is recommended to treat gonococcal infections with a higher dose of ceftriaxone than what has been done previously."},
 FIG("sti-ur","Management of urethral discharge in men: flowchart"),
 {t:"g",ad:1,title:"First line therapy for gonorrhoea and chlamydia:",rows:[R("ceftriaxone","im","C V","1g*","one dose only",""),"AND",R("doxycycline","po","C V","100mg","2 times a day","7 days"),"OR",R("azithromycin","po","C V","1g","one dose only","")],note:"*Use with 3.5ml of 1% lignocaine."},
 {t:"p",x:"If the patient still has a urethral discharge, or evidence of urethritis 7 days after start of treatment, suspect re-infection, poor treatment compliance or antimicrobial resistance in Neisseria gonorrhoeae. If re-infection is suspected, re-start first line treatment. Otherwise treat the patient with second line therapy or refer for investigations and laboratory guided treatment."},
 {t:"g",ad:1,title:"Second line therapy for gonorrhoea and chlamydia:",rows:[R("cefixime","po","C V","800mg","one dose only",""),"OR",R("ceftriaxone","im","C V","1g","one dose only",""),"PLUS",R("azithromycin","po","C V","2g","one dose only",""),"AND",R("metronidazole","po","C V","2g","one dose only","")]},
 {t:"ul",x:["If the client received ceftriaxone at the initial consultation and there is no risk of re-infection, non-compliance does not apply here because the client received a directly observed single dose IM injection. Thereafter, offer second line treatment: dual therapy with either ceftriaxone or cefixime together with azithromycin.","Metronidazole is included to cover infection with Trichomonas vaginalis.","If urethritis persists after second line treatment, then Mycoplasma genitalium should be considered and treated; referral should be made to specialists for further evaluation."]}]},
{id:"sti-vaginal",name:"Vaginal discharge in women",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"All women with a vaginal discharge must have a vaginal examination. Some vaginal discharges are normal. However, any person concerned about a vaginal discharge should be examined and managed appropriately."},
 {t:"p",x:"All persons presenting with abnormal vaginal discharge that looks like a yeast infection (curd-like discharge, redness of the vulva and vulval itching) should receive treatment for candida. All persons with an abnormal vaginal discharge that is not consistent with candida should receive treatment for bacterial vaginosis, trichomoniasis, gonorrhoea and chlamydia."},
 {t:"p",x:"Treatment for cervical infection, both gonococcal and chlamydial, should be given in situations where infection seems likely or the risk of developing complications is high. Treatment for cervical infection should be added to the treatment for vaginal infections if suspected (for example, partner has urethral discharge), or if the signs of cervical infection (mucopurulent cervical discharge or easy bleeding) are seen on speculum examination."},
 FIG("sti-vag","Management of vaginal discharge in women: flowchart"),
 {t:"h",x:"First line treatment"},
 {t:"g",ad:1,title:"Therapy for bacterial vaginosis:",rows:[R("metronidazole","po","C V","400mg or 500mg","2 times a day","7 days"),"OR",R("metronidazole","po","C V","2g","once only",""),"OR",R("clindamycin","po","B V","300mg","2 times a day","7 days")],note:"Avoid alcohol consumption during treatment with metronidazole."},
 {t:"g",ad:1,title:"Therapy for Trichomonas:",rows:[R("metronidazole","po","C V","400mg or 500mg","2 times a day","7 days"),"OR",R("metronidazole","po","C V","2g","once only",""),"OR",R("tinidazole","po","C V","500mg","2 times a day","5 days"),"OR",X(R("tinidazole","po","C V","2g","once only",""),"sti-fix")],note:"CAUTION: The high dose, once only metronidazole approach is less effective than the low dose, longer course in HIV infected patients. Note: Tinidazole is not recommended in pregnancy. Defer breastfeeding by 72 hours following a single 2g dose of tinidazole. Avoid alcohol consumption during treatment with either metronidazole or tinidazole."},
 {t:"g",ad:1,title:"Therapy for yeast infection (curd-like white discharge, vulvo-vaginal redness and itching):",rows:[R("miconazole","pv","C V","200mg","every night","3 days"),"OR",R("clotrimazole","pv","C V","100mg","every night","7 days"),"OR",R("nystatin","pessary","C V","200,000IU","at night","7 days")]},
 {t:"g",ad:1,title:"Therapy for urethral discharge or mucopurulent cervicitis / easy bleeding (friable cervix):",rows:[R("ceftriaxone","im","C V","1 gram","one dose only",""),"AND",R("doxycycline","po","C V","100mg","2 times a day","7 days"),"OR",R("azithromycin","po","C V","1g","one dose only","")],note:"CAUTION IN PREGNANCY: Doxycycline should not be used during pregnancy, or in lactating women. In pregnant women chlamydial infection is best treated with azithromycin or erythromycin (whichever is available), while ceftriaxone should be used for gonococcal infection."},
 {t:"h",x:"Second line treatment"},
 {t:"p",x:"If the patient still has a vaginal discharge, or evidence of cervicitis 7 days after start of treatment, suspect re-infection, poor treatment compliance or antimicrobial resistance in Neisseria gonorrhoeae. If re-infection is suspected, re-start first line treatment. Otherwise treat the patient with second line therapy or refer for investigations and laboratory guided treatment."},
 {t:"g",ad:1,title:"Second line therapy for vaginal discharge:",rows:[R("cefixime","po","C V","800mg","one dose only",""),"OR",R("azithromycin","po","C V","2g","one dose only","")]}]},
{id:"sti-anorectal",name:"Anal and rectal infections",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"Anorectal symptoms and sexually transmitted anorectal infections are prevalent in men who have sex with men (MSM), in female sex workers, transgendered and heterosexual individuals who practise anal sexual intercourse."},
 {t:"h",x:"Anatomical sites of infection"},
 {t:"p",x:"Infections of the ano-rectal region can be divided into the following anatomical sites."},
 {t:"ul",x:["Anal infections: infections of the external anus and anal canal, involving the stratified squamous epithelium. A common site for pathogens such as the human papillomavirus (HPV), herpes simplex virus (HSV) and syphilis.","Proctitis: infections from the dentate line to the rectosigmoid junction. A common site for gonococcal and chlamydial infections and HSV. (The dentate line is the line between the simple columnar epithelium of the rectum and the stratified epithelium of the anal canal, usually defined as being at the level of the anal valves.)","Proctocolitis: infections of the rectum and colon. A common site for Shigella, Campylobacter, Salmonella, cytomegalovirus and amoebiasis."]},
 {t:"p",x:"For syndromic diagnosis and management, these infections can be grouped under anorectal infections. Anorectal infections may be associated with anorectal pain, itching, discharge, bleeding, sensation of rectal fullness, tenesmus, constipation, and mucus streaking of stools. However, more frequently, ano-rectal infections tend to be asymptomatic."},
 {t:"p",x:"An examination for anal infections includes an external examination of the anus and a proctoscopy examination. In the absence of a proctoscope, as is the case in most primary point-of-care settings, an external examination of the anus may be the only practical procedure to observe a discharge, ulcers or external warts."},
 {t:"p",x:"If painful perianal ulcers are reported and observed, or mucosal ulcers are noted on proctoscopy, treatment should include a regimen for genital herpes and syphilis as if following the genital ulcer disease (GUD) flowchart. If ulcers persist, lymphogranuloma venereum (LGV) must be considered and managed accordingly."},
 {t:"p",x:"In implementing a flowchart for the management of anorectal infections, the following should be taken into consideration:"},
 {t:"ul",x:["identification of persons at risk,","identification of risk behaviours for rectal infection in persons at risk,","proctoscopy skills (and availability of a proctoscope),","differentiation between anorectal infection and other pathology,","entry points for the management protocol, and","thresholds for adding treatment for HSV, LGV or syphilis."]},
 {t:"h",x:"Treatment recommendations for ano-rectal infections"},
 {t:"p",x:"The figure below guides through the management process for persons practising anal sex, be they heterosexual or MSM. The choice of medicines, dosage and duration of treatment are, in general, not different from those for infections at other anatomical sites."},
 FIG("sti-ano","Management of anal discharge: flowchart"),
 {t:"p",x:"There have been no evaluations conducted to determine the specificity or sensitivity of the anorectal flowchart. Where possible, it should be implemented as part of operational research to determine its performance. As the entry point for this flowchart is sexual behaviour rather than symptoms, it is likely that a number of patients will repeatedly be treated for infections."}]},
{id:"sti-ulcers",name:"Genital ulcers, buboes and epididymo-orchitis",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"The commonest cause of genital ulcers in both men and women is genital herpes simplex virus type 2 (HSV2) infection. Syphilis and chancroid also cause genital ulcers but the prevalence of chancroid is low in Zimbabwe. Clinical differentiation between the causes of genital ulcers is inaccurate except if the patient gives a clear history of recurrent attacks of vesicular lesions that may crust and heal spontaneously or if the clinical appearance of the lesions are those of superficial ulcers, when the diagnosis of genital herpes may be suspected. It should be noted that syphilis may remain undetected in the body for long periods of time and clinical manifestations may only occur when long-term complications develop. Syphilis should be ruled out in all patients presenting with genital ulcers. Immunosuppressed persons with HIV infection frequently develop attacks of genital herpes that produce lesions which tend to persist and require treatment with antiviral medicines, such as acyclovir. Hence it is important to consider all three diagnoses whenever syndromically managing persons with genital ulcers."},
 FIG("sti-gud","Management of genital ulcers: flowchart"),
 {t:"h",x:"Treatment of genital herpes"},
 {t:"p",x:"In an individual with primary genital herpes ulcers, the lesions tend to be more severe (usually accompanied by systemic illness such as fever, headaches, myalgia), with eruptions lasting up to 3 weeks. For this reason, primary genital herpes is treated for 10 days, and not for 5 days as with recurrent genital herpes."},
 {t:"g",ad:1,title:"Therapy for genital herpes:",rows:[R("acyclovir","po","C V","400mg","3 times a day","10 days"),"OR",R("acyclovir","po","C V","200mg","5 times a day","10 days")]},
 {t:"h",x:"Treatment of genital ulcers"},
 {t:"p",x:"Advice on local hygiene such as washing the ulcer twice a day with salt water (1 teaspoon salt to 1 litre water) and give the following:"},
 {t:"g",ad:1,title:"Therapy for genital ulcers:",rows:[R("benzathine penicillin","im","C V","2.4MU (1.44g)","once only",""),"AND",R("ciprofloxacin","po","B V","500mg","2 times a day","3 days"),"AND",R("acyclovir","po","C V","400mg","3 times a day","5 days"),"OR",R("acyclovir","po","C V","800mg","2 times a day","5 days")],note:"CAUTION: In cases of penicillin allergy, if not pregnant: use doxycycline 100mg 2 times a day for 14 days. If pregnant: these patients cannot have both the penicillin and the ciprofloxacin, therefore treat for a longer duration with erythromycin 500mg 4 times a day for 14 days or 30 days depending on stage of syphilis (<2 years duration or >2 years duration). CAUTION IN PREGNANCY: Ciprofloxacin should not be used during pregnancy or in lactating mothers. In pregnant women without penicillin allergies, genital ulcers are best treated with the above regimen, but substitute ciprofloxacin with erythromycin 500mg 4 times a day for 7 days or azithromycin 1g single dose or ceftriaxone 1g IM single dose."},
 {t:"h",x:"Granulating ulcers without buboes"},
 {t:"p",x:"These are most likely to be lesions of granuloma inguinale, a condition also known as Donovanosis and caused by Calymmatobacterium granulomatis. It should be remembered that persons who are immunosuppressed may not develop a bubo and occasionally persistent genital ulcers without bubo formation may occur because of chancroid in persons with immunosuppression and HIV infection."},
 {t:"g",ad:1,title:"First line for granulating ulcers without buboes:",rows:[R("benzathine penicillin","im","C V","2.4MU (1.44g)","single dose",""),"AND",R("azithromycin","po","C V","1g (loading dose) then 500mg","daily","until ulcer is healed"),"OR",R("doxycycline","po","C V","100mg","2 times a day","until ulcer is healed")],note:"In penicillin allergy use erythromycin 500mg po 4 times a day for 14 days. Review patient on a weekly basis."},
 {t:"g",ad:1,title:"Second line for granulating ulcers without buboes:",rows:[R("cotrimoxazole","po","C V","960mg","2 times a day","until ulcer is healed")]},
 {t:"h",x:"Buboes without ulcers"},
 {t:"p",x:"This usually occurs in persons with lymphogranuloma venereum (LGV) which is caused by the L-types of Chlamydia trachomatis. The main effect of the infection is on the lymphatics and patients may present with penile and vulval lymphoedema together with inguinal buboes. Rectal LGV infection can also present with anal discharge and may be confused with inflammatory bowel disease. A small transient genital ulcer, which may heal on its own, may precede the swelling and buboes. The bubo is typically multilocular and may be grooved by the inguinal ligament."},
 {t:"g",ad:1,title:"First line:",rows:[R("doxycycline","po","C V","100mg","2 times a day","21 days")]},
 {t:"g",ad:1,title:"Second line, or in pregnant women:",rows:[R("erythromycin","po","C V","500mg","4 times a day","21 days")]},
 {t:"h",x:"Acute epididymo-orchitis"},
 {t:"p",x:"Acute scrotal swelling may occur in persons with acute epididymo-orchitis, testicular torsion and scrotal trauma, and in those with irreducible or strangulated inguinal hernia. Patients should be examined carefully in order to exclude these conditions. If patients do not respond to first line therapy, they should be referred for further investigations."},
 {t:"g",ad:1,title:"First line:",rows:[R("ceftriaxone","im","C V","1 gram","one dose only",""),"AND",R("doxycycline","po","C V","100mg","2 times a day","10 days"),"OR",R("erythromycin","po","C V","500mg","4 times a day","14 days")]}]},
{id:"sti-syphilis",name:"Syphilis",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"h",x:"Early syphilis"},
 {t:"p",x:"Early syphilis includes primary, secondary and latent syphilis of less than 2 years duration."},
 {t:"g",ad:1,title:"Treatment for early syphilis (<2 years):",rows:[R("benzathine penicillin","im","C V","1.44g [2.4 MU]","one dose only",""),"OR (in penicillin allergy)",X(R("doxycycline","po","C V","100mg","2 times a day","14 days"),"sti-fix"),"OR (in penicillin allergy)",R("erythromycin","po","C V","500mg","4 times a day","14 days")]},
 {t:"h",x:"Late syphilis and syphilis during pregnancy"},
 {t:"p",x:"This includes latent syphilis of more than 2 years duration, latent neurosyphilis, gummatous, cardiovascular and neurosyphilis, and syphilis of unknown duration."},
 {t:"g",ad:1,title:"Treatment for late syphilis (>2 years) and syphilis in pregnancy:",rows:[R("benzathine penicillin","im","C V","1.44g [2.4 MU]","once a week","3 doses"),"OR (in penicillin allergy only, NOT in pregnancy)",R("doxycycline","po","C V","100mg","2 times a day","28 days"),"OR (in penicillin allergy and in pregnancy)",R("erythromycin","po","C V","500mg","4 times a day","28 days")]},
 {t:"ul",x:["Pregnant women are now routinely tested for syphilis using a rapid diagnostic kit (TPHA equivalent). Pregnant women with syphilis require close surveillance, especially to identify re-infection after treatment.","Partner treatment: note the importance of having the sex partner treated, therefore always provide a contact tracing slip."]},
 {t:"h",x:"Congenital syphilis"},
 {t:"p",x:"For the treatment of babies born to women with syphilis, and of babies with congenital syphilis, see the page Congenital syphilis under Neonatal conditions."},
 {t:"h",x:"Neurosyphilis"},
 {t:"ul",x:["Can occur at any time during the course of infection.","Early neurosyphilis may present as asymptomatic meningitis (identified by CSF lymphocyte count >5 cells/microL or CSF protein >45mg/dL), symptomatic meningitis, or less commonly as meningovascular disease (i.e. meningitis or stroke).","Vision/hearing loss (ocular syphilis and otosyphilis) is treated as neurosyphilis.","Late neurosyphilis usually involves the brain and spinal cord, presenting as dementia (general paresis) and tabes dorsalis."]},
 {t:"g",ad:1,title:"Treatment for neurosyphilis:",rows:[R("benzylpenicillin","iv","C V","1.8-2.4g","4 hourly","2 weeks"),"OR",R("benzathine penicillin","im","C V","2.4MU","once a week","3 weeks"),"OR",R("procaine penicillin","im","C V","600mg [=1ml in each buttock]","once a day","21 days")],note:"In cases of ocular syphilis or otosyphilis, always give prednisolone 40mg once daily for 3 days, given at onset of therapy."},
 {t:"g",ad:1,title:"Treatment for neurosyphilis (in penicillin allergy):",rows:[R("doxycycline","po","C V","200mg","2 times a day","28 days"),"OR (for pregnant women)",R("erythromycin","po","C V","500mg","4 times a day","28 days")],note:"In cases of ocular syphilis or otosyphilis, always give prednisolone 40mg once daily for 3 days, given at onset of therapy."}]},
{id:"sti-warts",name:"Genital warts, molluscum contagiosum and pubic lice",sec:"Sexually transmitted infections",aud:"adult",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"h",x:"Genital warts (condylomata acuminata)"},
 {t:"ul",x:["Podophyllin is toxic and should be used strictly under medical supervision.","Reported complications of podophyllin include severe necrosis, scarring and fistula-in-ano.","Purified podophyllotoxin causes fewer side effects and may be more effective than podophyllin.","Podophyllotoxin can be self-administered to ano-genital lesions as well as be applied at the local clinic.","As more and more people are tending to treat themselves with podophyllin, with adverse consequences, health education needs to be given to ensure that pharmacists, doctors and nurses cease providing podophyllin for self-application by the patient.","If purified podophyllotoxin is available, it can be given for self-application by patients."]},
 {t:"g",ad:1,title:"Therapy for external, genital and perianal warts:",rows:[R("podophyllotoxin 0.5% solution or 0.5-1.5% cream","","C N","","2 times a day","3 days, followed by 4 days of no treatment; cycle can be repeated 4 times"),"OR",R("podophyllin paint 20%","","B N","wash off after 4 hours","once a week","review"),"OR",R("imiquimod 5% cream","","C N","apply at bedtime and leave overnight","3 times a week","max 4 months"),"OR",R("trichloroacetic acid","","B N","apply with a stick to warts only","once a week","")],note:"CAUTION: all these medicines are for external use only. Do not apply to the cervix, urethra or anal mucosa. Do not use imiquimod cream for genital warts on children under 12 years. If patient fails to respond, refer for cryotherapy. CAUTION IN PREGNANCY: Do NOT use podophyllin, podophyllotoxin, trichloroacetic acid or imiquimod in pregnancy."},
 {t:"h",x:"Cervical, urethral, rectal and vaginal warts"},
 {t:"ul",x:["Do not use podophyllin. Treat with cryotherapy, electro-cautery, or by surgical excision.","If the lesions are very extensive and large then the patient should be offered HIV testing and counselling, referred to the OI Clinic or for specialist attention.","All patients with any STI should be referred for HIV testing."]},
 {t:"h",x:"Molluscum contagiosum"},
 {t:"p",x:"The lesions of molluscum contagiosum may resolve spontaneously. In most instances, they do not have to be treated unless cosmetically unacceptable. If not acceptable, each lesion should be pricked with a sharpened “orange-stick” or needle and the contents of the lesion expressed. This alone may be sufficient, or each lesion can then be touched carefully with liquefied phenol. Referral for cryotherapy is also an option."},
 {t:"p",x:"Lesions of molluscum contagiosum may become extensive and large in immunosuppressed persons with HIV infection. If the lesions are very extensive and are very large then the patient should be offered HIV testing and counselling, referred to the OI Clinic or for specialist attention."},
 {t:"h",x:"Pediculosis pubis (pubic lice)"},
 {t:"p",x:"Patients with pediculosis pubis and their sexual partners should be treated as follows."},
 {t:"g",ad:1,title:"First line treatment for pediculosis pubis:",rows:[R("permethrin 5% cream","","C N","apply to infested and adjacent hairy areas; wash off after 10 min","reapply after 7 days if necessary",""),"OR",R("benzyl benzoate 25% emulsion* (irritant)","","B N","apply to infested and adjacent hairy areas","once at night; wash off next morning","")],note:"Note: apply to hairy areas; do not shave prior to application. *Dilute with one part water (1:1) for children. *Dilute with three parts water (1:3) for infants."},
 {t:"g",ad:1,title:"Second line treatment for pediculosis pubis:",rows:[R("gamma benzene hexachloride 1% lotion","","C V","apply to infested and adjacent hairy areas; wash off after 24 hours","reapply after 7-10 days to kill hatched lice","")],note:"CAUTION: Do not use G.B.H in pregnancy and lactation. Refer mothers to district level for benzyl benzoate."}]},
{id:"sti-ophthalmia",name:"Ophthalmia neonatorum",sec:"Sexually transmitted infections",src:"EDLIZ 2025, Sexually Transmitted Infections chapter",blocks:[
 {t:"p",x:"This is defined as conjunctivitis occurring in a neonate within the first month of life. The condition is commonly caused by gonococcal, chlamydial and other bacterial infections. The condition is preventable by detecting and treating maternal gonococcal and chlamydial infection during pregnancy and by instilling 1% tetracycline eye ointment carefully into the conjunctival sacs of every baby as soon as possible after birth."},
 {t:"g",title:"Treatment for ophthalmia neonatorum:",rows:[R("ceftriaxone","im","C V","50mg/kg to max of 250mg","once","",{k:"mgkg",lo:50,u:"mg",mx:250})]},
 {t:"p",x:"Treat the parents and the baby for gonococcal and chlamydial infection as described above. Also provide health education and counselling to the parents."}]},
{id:"hiv-art-start",name:"ART: when to start in adolescents and adults",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Prior to starting ART, patients should be assessed for readiness to take ARVs; the ARV regimen; dosage and scheduling; the likely potential of adverse effects; and the required monitoring. Both medical and psychosocial issues need to be addressed before initiating ART. Patients should be adequately counselled about adopting appropriate lifestyle measures such as safer sexual practices (including consistent, correct use of condoms), and any other psychosocial problems that may interfere with adherence (for example alcohol, psychiatric disorders) should be addressed. At each clinic visit always screen for tuberculosis using a TB symptom checklist, advise patients about adequate nutrition, the importance of medicine adherence and regular follow-up care. People taking ART should also be regularly asked whether they are taking other medicines including herbal remedies as they may interfere with the efficacy of ARVs."},
 {t:"p",x:"Early treatment is associated with clinical and HIV prevention benefits, improved survival and reduced incidence of HIV infection at the community level. Increasing evidence also indicates that untreated HIV may be associated with the development of severe non-AIDS defining conditions including cardiovascular disease, kidney disease, liver disease and neurocognitive disorders."},
 {t:"h",x:"Medical criteria for initiating ART in adolescents and adults"},
 {t:"p",x:"All individuals with a confirmed HIV diagnosis are eligible for antiretroviral therapy (ART) irrespective of WHO clinical stage and CD4 count level, i.e. TREAT ALL. Health workers should retest all people newly and previously diagnosed with HIV before they initiate ART."},
 {t:"p",x:"Once an individual is confirmed to be HIV positive, health workers should provide adequate counselling and start ART on the same day or at most within a week. However, recipients of care who are not yet ready to start ART should receive ongoing counselling and support to assist them to start ART."},
 {t:"p",x:"NB: Pregnant and breastfeeding women should be started on ART on the same day of HIV diagnosis."},
 {t:"h",x:"Patients with CD4 <200"},
 {t:"p",x:"Patients with CD4 below 200 should be fast-tracked for treatment initiation as they have advanced HIV disease (AHD). They should be screened for symptomatic TB, cryptococcal disease (CrAg screening), visual changes and direct retina exam."},
 {t:"p",x:"They should receive cotrimoxazole prophylaxis and TB preventive therapy (TPT) and should be closely monitored for 3 months as this is their highest risk period for bacterial infections and TB or crypto IRIS."},
 {t:"p",x:"Health workers should educate them and their families to report immediately to a health facility if they are unwell whilst their CD4 is <200."},
 {t:"h",x:"Psychosocial criteria for initiating ART"},
 {t:"ul",x:["Has the recipient of care been adequately counselled and informed about ART?","Is a treatment partner available and/or has disclosure been made to that treatment partner? (strongly encouraged)","Is there an easy method of following up on the recipient of care?","Is the recipient of care ready to take medication indefinitely?"]},
 {t:"h",x:"Situations where it may be necessary to defer ART initiation"},
 {t:"p",x:"A recipient of care may be deferred (delayed) from starting therapy if he or she:"},
 {t:"ul",x:["has cryptococcal meningitis,","needs further psychosocial counselling (for example for substance or alcohol abuse problems),","has TB (defer starting ART for at least 2 weeks),","needs further information on HIV and AIDS,","is very ill and unable to swallow oral medication (palliative care is then offered to such a patient)."]},
 {t:"p",x:"Such patients should be offered continued monitoring and close follow-up as well as counselling so that ART can be commenced at an appropriate time."},
 {t:"h",x:"Adherence to ART"},
 {t:"p",x:"Efforts to support adherence should start before ART initiation and should include basic information about HIV, the ARV medicines, expected adverse events, and preparations for long-term ART. Effective adherence support interventions include client-centred behavioural counselling and support, support from peer educators trained as “expert clients”, or community adolescent treatment supporters (CATS) and mobile text messaging. Other interventions involve encouraging people to disclose their HIV status and providing them with adherence tools such as pill boxes, diaries, and patient reminder aids. During follow-up, recipients of care should be assessed for adherence to whatever treatment plan has been agreed upon. Age-appropriate disclosure beginning in childhood fosters adherence to treatment in adolescents."}]},
{id:"hiv-art-first",name:"ART: first-line regimens for adults and adolescents",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"The choice of medicine regimen is based on the “essential medicine” concept and the rational use of medicine. To maximise adherence, use of fixed-dose combination (FDC) medicines is strongly encouraged. The choice of ARVs has been based on evidence of efficacy and safety, on availability and cost of medications, as well as on the side effects profile and the potential for development of resistance. The national ART programme uses the following FDCs in the first line regimens:"},
 {t:"h",x:"Dual combinations"},
 {t:"ul",x:["Tenofovir (TDF) 300mg + lamivudine (3TC) 300mg","Tenofovir (TDF) 300mg + emtricitabine (FTC) 200mg","Tenofovir alafenamide (TAF) 25mg + FTC 200mg","Tenofovir alafenamide (TAF) 25mg + lamivudine (3TC) 300mg","Zidovudine (AZT) 300mg + lamivudine (3TC) 150mg","Abacavir (ABC) 300mg + lamivudine (3TC) 300mg"]},
 {t:"p",x:"The above dual FDC should be used in combination with a single formulation of:"},
 {t:"ul",x:["Dolutegravir (DTG) 50mg","Efavirenz (EFV) 400mg","Atazanavir/ritonavir (ATV/r) 300/100","Lopinavir/ritonavir (LPV/r) 200/50"]},
 {t:"h",x:"Triple combinations"},
 {t:"ul",x:["TDF 300mg + 3TC 300mg + DTG 50mg","TDF 300mg + 3TC 300mg + EFV 400mg","TAF 25mg + FTC 200mg + DTG 50mg","TAF 25mg + 3TC 300mg + DTG 50mg"]},
 {"t": "m", "title": "Summary of first line ARV regimens for adults and adolescents", "li": 0, "cols": ["Population", "Preferred first line regimen", "Alternative first line regimen"], "rows": [[["**Adults and adolescents including women of childbearing potential"], ["TDF + 3TC + DTG", "(once a day FDC) (TLD1)"], ["TDF/3TC FDC (or TAF/FTC FDC) + EFV 400", "TDF/3TC FDC (or TAF/FTC FDC) + ATV/r", "ABC/3TC FDC (or AZT/3TC FDC) + DTG", "ABC/3TC FDC (or AZT/3TC FDC) + EFV 400"]]], "note": "FDCs: in the programme TDF is only combined with 3TC and TAF only with FTC; ABC/3TC and AZT/3TC are separate FDCs, each of which can be combined with DTG or EFV 400. TAF assumes the clinician has confirmed that the creatinine clearance allows it."},
 {t:"g",ad:1,title:"Preferred first line ART for adults and adolescents including women of child-bearing potential:",rows:[R("tenofovir (TDF) + lamivudine (3TC) + dolutegravir (DTG) (FDC) (TLD1)","po","C V","300+300+50mg","once a day","for life")],note:"FDC = fixed dose combination; TLD = tenofovir + lamivudine + dolutegravir. To make the distinction between those on first line versus those taking second line ART, the Zimbabwe HIV Program will use TLD1 to refer to patients taking first line DTG-based regimens while TLD2 will refer to those on second line DTG-based regimens. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"g",ad:1,title:"Alternative ART regimens for adults:",rows:[R("TAF (tenofovir alafenamide) + emtricitabine (FTC) + dolutegravir","po","C V","25+200+50mg","once a day","for life"),"OR",R("TDF (or TAF*) + emtricitabine (FTC) + dolutegravir","po","C V","300+200+50mg","once a day","for life"),"OR",R("abacavir (ABC)** + lamivudine + dolutegravir","po","C V","600+300+50mg (one tablet of each)","once a day","for life"),"OR",R("TDF (or TAF*) + 3TC (or FTC) + efavirenz (EFV)","po","C V","300+300+400mg","once a day","for life")],note:"*TAF (tenofovir alafenamide) can be used as a substitute for TDF (tenofovir disoproxil fumarate). **ABC/3TC/DTG 50mg can be administered to patients weighing at least 20 kg. Note: AZT/3TC backbone may be used in special circumstances (for example where TDF is contraindicated, and TAF is unavailable). Important: TB patients on rifampicin to receive DTG 50mg twice a day. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"h",x:"Main considerations"},
 {t:"ul",x:["Dolutegravir (DTG) is included as one of the preferred antiretroviral medicines for first and second line regimens for everyone living with HIV including adults, pregnant women, women and adolescent girls of childbearing potential, children and people co-infected with TB.","DTG is a safe and efficacious medicine that achieves rapid viral suppression, has low potential for drug-drug interactions and a high genetic barrier to developing ARV drug resistance. It should be included in the preferred first line regimen for all populations unless contraindicated.","DTG use has been associated with weight gain especially when co-administered with TAF/3TC. Prior to initiating DTG containing regimens, clinicians should advise patients on this potential side effect and advise on the importance of adopting healthy lifestyles including exercising, taking healthy diets and avoidance of smoking.","Pregnancy tests should be made available at health facilities to ascertain pregnancy status among women to support patient management and early linkage to ART for women living with HIV for prevention of mother to child transmission.","In PLHIV with TB using rifampicin, the dose of DTG should be increased to 50 mg twice daily.","Tenofovir alafenamide (TAF), a derivative of tenofovir disoproxil fumarate (TDF), has less renal and bone toxicity compared to TDF. TAF may be used as a substitute for TDF for adults and adolescents. When available, TAF should be considered in older recipients of care above 50 years, in those with impaired kidney function (creatinine clearance between 30 and 60 ml/min), established osteoporosis and HBV co-infection.","However, TAF should NOT be used in anyone with a creatinine clearance (CrCl) below 30 ml/min, whether or not they are co-infected with TB, pregnant, or simply living with HIV. Wherever TAF appears as an option in the dosing tables (for example in the alternative first line regimens or the second line regimen for pregnant women), it is assumed that the clinician has first confirmed that the renal function allows it. If it does not, TAF is contraindicated because of the kidney function, not because of the pregnancy or the TB.","If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed. In Zimbabwe, all people living with HIV should have a creatinine measurement at least once a year. People aged 50 years and over definitely warrant kidney function testing, or simply a switch from TDF to a TAF-based regimen on the assumption of age-related decline in kidney function.","Fixed dose combinations (FDCs): because of funding, the programme has only certain combinations available. In practice TDF is only combined with 3TC, and TAF is only combined with FTC; both can be paired with DTG. Switching from TDF (for example because of a low creatinine clearance) therefore also means switching 3TC to FTC. DTG is the constant in the first line regimens because it is the most powerful drug; the other drugs are largely interchangeable. ABC + 3TC and AZT + 3TC are further FDCs, each of which can be combined with DTG or EFV 400."]},
 {t:"h",x:"CAUTION: Tenofovir (TDF)"},
 {t:"p",x:"TDF may be associated with acute kidney injury or chronic kidney disease as well as reduced bone mineral density (including in pregnant women)."},
 {t:"p",x:"Clinical considerations when using TDF:"},
 {t:"ul",x:["Perform urea and creatinine tests and routine blood pressure monitoring.","Urine dipsticks may be used to detect glycosuria and proteinuria and severe TDF nephrotoxicity in individuals without diabetes using TDF-containing regimens.","If the creatinine test is routinely available, use the creatinine clearance (CrCl) at baseline before initiating TDF regimens.","Do not initiate TDF when the creatinine clearance (CrCl) is <50 ml/min, or in long term diabetes, uncontrolled hypertension and renal failure."]},
 {"t": "m", "title": "Calculation of creatinine clearance (CrCl) in ml/min using the Cockcroft-Gault equation", "li": 0, "cols": ["Sex", "Formula"], "rows": [[["**Male"], ["1.23 × (140 − age) × weight in kg ÷ creatinine (in µmol/L)"]], [["**Female"], ["1.04 × (140 − age) × weight in kg ÷ creatinine (in µmol/L)"]]]},
 {t:"h",x:"Substitution in the event of medicine toxicity, adverse events and unavailability"},
 {t:"p",x:"If the recipient of care has suspected adverse medicine events, therapy should be altered as follows (change of a single medicine in a multi-medicine regimen is permitted, that is, the offending medicine may be replaced, preferably with an alternative medicine of the same class):"},
 {t:"ul",x:["Given zidovudine toxicity such as anaemia or neutropenia, zidovudine will be replaced by tenofovir.","In the event of lactic acidosis, the current ARVs should be discontinued and ART restarted after checking for normalisation of the lactate levels.","An alternative to lamivudine (3TC) is emtricitabine (FTC); these medicines are considered pharmacologically equivalent. If you come across a recipient of care on tenofovir/emtricitabine/efavirenz, you may substitute emtricitabine with lamivudine.","For patients presenting with renal impairment, consult or refer for specialist opinion."]}]},
{id:"hiv-art-second",name:"ART: second-line and third-line regimens for adults and adolescents",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"h",x:"Second-line regimens"},
 {t:"p",x:"Ideally, recipients of care who fail to respond to first line treatment should be treated with a different regimen containing medicines that were not included in the first regimen. The second line regimen will consist of two NRTIs but with a PI if the initial regimen contained DTG."},
 {t:"ul",x:["The second line regimen should be initiated only after assessing treatment adherence and failure and in consultation with a specialist in HIV and AIDS treatment or the clinical mentorship team at the OI/ART clinic.","The second line recommendation will be based on what the patient is already taking or has taken in the past.","More adherence counselling (enhanced adherence counselling) will be required in preparation for the planned new therapy."]},
 {"t": "m", "title": "Summary of second line regimens for adults and adolescents including pregnant and breastfeeding women", "li": 0, "cols": ["Failing 1st line regimen", "Preferred 2nd line regimen", "Alternative 2nd line regimen"], "rows": [[["**TDF (or TAF) + 3TC + DTG", "or", "ABC + 3TC + DTG"], ["AZT + 3TC + ATV/r"], ["AZT + 3TC + LPV/r (or DRV/r)"]], [["**TDF (or TAF) + 3TC (or FTC) + ATV/r", "or", "TDF (or TAF) + 3TC (or FTC) + EFV"], ["AZT + 3TC + DTG"], ["AZT + 3TC + LPV/r (or DRV/r)"]], [["**AZT + 3TC (or FTC) + EFV"], ["TDF (or TAF) + 3TC (or FTC) + DTG"], ["TDF (or TAF) + 3TC (or FTC) + ATV/r (or DRV/r)"]]], "note": "TDF is combined with 3TC and TAF with FTC in the available FDCs. TAF assumes the clinician has confirmed that the creatinine clearance allows it (not because of pregnancy)."},
 {t:"ul",x:["If TDF + 3TC or ABC + 3TC (or FTC) was used in the failing first line regimen, AZT + 3TC should be used in second line ART and vice versa.","For HIV/TB coinfection on a rifampicin-based regimen, use LPV/r (super boosted) instead of ATV/r and DTG twice daily instead of DTG once daily.","Maintain TDF in the second line for recipients of care with chronic HBV coinfection.","Recipients of care failing first line (refer to ART guidelines) should be switched to an effective second line regimen.","Precautions in the use of DTG also apply for second and third line ART regimens."]},
 {t:"h",x:"Failing first line regimens"},
 {t:"p",x:"If the patient is failing while taking TDF (or TAF) + 3TC (300mg) + DTG (50mg), or ABC + 3TC + DTG, then:"},
 {t:"g",ad:1,title:"Preferred second line ART:",rows:[R("zidovudine (AZT) + lamivudine (3TC) + atazanavir/ritonavir (ATV/r)","po","C V","300+300+(300/100) mg","morning: 1 tablet of AZT/3TC; evening: 1 tablet each of AZT/3TC and ATV/r","for life"),"OR",R("zidovudine (AZT) + lamivudine (3TC) + lopinavir/ritonavir (LPV/r)","po","C V","300+300+(200/50) mg","morning: 1 tablet of AZT/3TC and 2 tablets of LPV/r; repeat same in the evening","for life")]},
 {t:"p",x:"If the patient is failing while taking TDF (or TAF) + 3TC (or FTC) + ATV/r, or TDF (or TAF) + 3TC + EFV, then:"},
 {t:"g",ad:1,title:"Preferred second line ART:",rows:[R("zidovudine (AZT) + lamivudine (3TC) + dolutegravir (DTG)","po","C V","300+300+50 mg","morning: 1 tablet each of AZT/3TC and DTG; evening: 1 tablet of AZT/3TC","for life"),"OR",R("zidovudine (AZT) + lamivudine (3TC) + lopinavir/ritonavir (LPV/r)","po","C V","300+300+(200/50) mg","morning: 1 tablet of AZT/3TC and 2 tablets of LPV/r; repeat same in the evening","for life")]},
 {t:"p",x:"If the patient is failing while taking AZT + 3TC + EFV, then:"},
 {t:"g",ad:1,title:"Preferred second line ART:",rows:[R("tenofovir (TDF or TAF) + lamivudine (3TC) + dolutegravir (DTG)","po","C V","300+300+50 mg","1 tablet once a day","for life")],note:"If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"h",x:"Third-line regimens"},
 {t:"p",x:"In adolescents older than 12 years and adults, the preferred third line ART can include dolutegravir (50mg), darunavir (600mg)/ritonavir (100mg) and 2 NRTIs."},
 {t:"ul",x:["Genotyping is recommended prior to switching patients failing second line ART, with clinicians required to actively rule out poor adherence before genotypic testing.","Eligible patients will be switched to darunavir (600mg)/ritonavir (100mg) given twice daily.","Recipients of care on 3rd line with a history of integrase strand transfer inhibitor (INSTI) use, for example DTG or raltegravir, should be given DTG twice daily."]},
 {"t": "m", "title": "Sequencing options for first line, second line and third line ART regimens for adults and adolescents", "li": 0, "cols": ["1st line regimen", "2nd line regimen", "3rd line regimen"], "rows": [[["**Two NRTIs + DTG"], ["Two NRTIs + ATV/r (or LPV/r or DRV/r)"], ["DRV/r + 1-2 NRTIs + DTG*", "Optimise the regimen using a genotype profile"]], [["**Two NRTIs + EFV"], ["Two NRTIs + DTG (or ATV/r or LPV/r or DRV/r)"], ["Two NRTIs + (ATV/r, DRV/r or LPV/r) + DTG*", "Optimise the regimen using a genotype profile"]]], "note": "* 50 mg twice daily"}]},
{id:"hiv-art-tb",name:"ART in patients with TB or cryptococcal disease",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"h",x:"Use of ARVs in recipients of care with TB"},
 {t:"p",x:"Refer to the latest national TB guidelines or TB/HIV guidelines. All recipients of care living with HIV should be screened for TB at every visit using the standard TB screening tools. Rifampicin interacts adversely with some antiretroviral agents such as PIs, therefore:"},
 {t:"ul",x:["Recipients of care who are TB co-infected and on rifampicin should receive DTG 50mg twice a day.","Efavirenz 400mg can be co-administered with rifampicin-containing anti-TB treatment; it is well tolerated and plasma concentrations were maintained above the levels considered to be effective.","For HIV/TB coinfection on a rifampicin-based regimen, use LPV/r (super boosted) instead of ATV/r."]},
 {t:"h",x:"Recipients of care with TB who are not yet on ART"},
 {t:"p",x:"In recipients of care who have HIV-related TB but are not yet on ART, treatment of TB takes priority. ART should be started at least two weeks after the start of TB therapy, i.e. during the intensive phase when the patient has stabilised on TB treatment, regardless of their CD4 count status. Cotrimoxazole prophylaxis should be provided with the commencement of the TB therapy if the patient is not on it already."},
 {t:"h",x:"Patients who develop TB when already on ART"},
 {t:"p",x:"Treat TB as per national TB guidelines."},
 {t:"h",x:"Use of ARVs in patients with cryptococcal meningitis"},
 {t:"p",x:"Refer to the section on cryptococcal meningitis in the chapter on HIV related disease."},
 {t:"p",x:"Timing of ART in asymptomatic cryptococcal antigenaemia is unknown. Initiation of ART 4-6 weeks after initiation of antifungal therapy is recommended in individuals who screen positive for serum CrAg without any evidence of disseminated cryptococcal meningitis."},
 {t:"p",x:"Early initiation of ART is recommended for most opportunistic infections except for intracranial OIs such as TB meningitis and cryptococcal meningitis."},
 {t:"p",x:"In cryptococcal meningitis ART can be initiated 4-6 weeks after initiation of antifungal therapy with amphotericin B based regimens. In patients who are predominantly treated with fluconazole monotherapy, ART should be initiated at least 4 weeks after initiation of antifungal therapy. ART should not be commenced at the same time that amphotericin B and/or fluconazole therapy is commenced for cryptococcal meningitis."}]},
{id:"hiv-ahd",name:"Managing advanced HIV disease (AHD)",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Advanced HIV disease (AHD) is defined as WHO clinical stage 3 or 4 or a CD4 cell count equal to or less than 200 cells/mm³ for people living with HIV aged five years or older. All children younger than five years are considered to have advanced HIV disease. This is based on the rationale that most children younger than five years usually present for care with advanced immunosuppression, and younger children have an increased risk of disease progression and mortality regardless of clinical and immune condition."},
 {t:"h",x:"Assessing for AHD"},
 {t:"p",x:"CD4 cell count is the best indicator of disease stage and immediate risk of death and thus should be used to identify people with advanced HIV disease. If access to CD4 count is limited or unavailable, WHO staging should be used."},
 {"t": "m", "title": "Diagnostic recommendations for managing patients with AHD", "li": 0, "cols": ["Intervention", "Priority target population", "Age"], "rows": [[["**CD4 testing"], ["PLHIV newly presenting to care (ART naive)", "Patients returning to care who have interrupted ART for at least 90 days", "Patients on ART who have suspected or confirmed treatment failure"], ["All ages"]], [["**LF-LAM testing"], ["Outpatient and inpatient settings: HIV-positive adults, adolescents and children with signs and symptoms of TB, with advanced HIV disease, who are seriously ill, or irrespective of signs and symptoms of TB and with a CD4 cell count <200.", "A negative LF-LAM test does not exclude TB; however, a positive LAM test confirms it."], ["All ages"]], [["**Cryptococcal antigen testing"], ["Any PLHIV with CD4 <200 cells/mm³ with clinical stage 3 or 4 illness"], ["PLHIV >10 years"]]]},
 {t:"p",x:"The main interventions known to reduce morbidity and mortality among people living with HIV can be summarised as Screen, Treat, Optimise and Prevent AIDS (STOP AIDS)."},
 {t:"h",x:"Screen"},
 {t:"ul",x:["TB: screen for TB using a clinical algorithm followed by X-ray when indicated and if available.","Cryptococcal infection among adolescents: serum, plasma or blood cryptococcal antigen screening followed by lumbar puncture if positive or symptomatic.","Malnutrition: weight-for-height, height-for-age, and mid-upper arm circumference among children 2-5 years old."]},
 {t:"h",x:"Treat"},
 {t:"p",x:"Treat TB, severe pneumonia, severe bacterial infections, cryptococcal meningitis and severe acute malnutrition."},
 {t:"h",x:"Optimise"},
 {t:"ul",x:["Rapid antiretroviral therapy: start within seven days with optimal regimens (except in patients with cryptococcal meningitis where treatment should be deferred for 4-6 weeks of antifungal treatment initiation).","Antiretroviral therapy counselling (to encourage effective adherence support interventions)."]},
 {t:"h",x:"Prevent"},
 {t:"ul",x:["Bacterial infections and Pneumocystis pneumonia: cotrimoxazole prophylaxis.","TB: TB preventive treatment.","Cryptococcal meningitis among adolescents and adults: fluconazole pre-emptive therapy.","Vaccinations: pneumococcal vaccine, human papillomavirus, measles, BCG, COVID-19."]}]},
{id:"hiv-eid",name:"Early infant diagnosis and care of the HIV-exposed infant",sec:"HIV and antiretroviral therapy",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"More than 90% of HIV-infected children acquire their infection through mother to child transmission of HIV (vertical transmission). Thus, elimination of new HIV infections among children through effective PMTCT interventions should be prioritised. HIV disease progression occurs very rapidly in the first few months of life in infants acquiring HIV in utero, often leading to death. The importance of early infant diagnosis (EID) of HIV infection and early initiation of ART can therefore not be overemphasised."},
 {t:"h",x:"Early infant diagnosis (EID)"},
 {t:"p",x:"Due to the presence of maternal antibodies, diagnosis of HIV infection in children below the age of 18 months requires virologic testing (nucleic acid test; NAT). Birth NAT should be done within 48 hours of birth for all HIV-exposed infants. ART initiation is recommended as soon as the birth NAT result is positive. Infants with a positive HIV NAT at birth should ALWAYS be retested to confirm results. However, retesting should not delay ART initiation, which should be done immediately while results of the retest are awaited. Babies whose NAT result is negative at birth or those not tested MUST be tested at 6 weeks. Infants who test negative at 6 weeks should be retested at 9 months with a nucleic acid test. Retesting at 18 months or 3 months post cessation of breastfeeding (whichever is later) should be carried out for final assessment of HIV status using rapid antibody tests."},
 {t:"p",x:"Rapid HIV antibody tests are the preferred method of diagnosis of HIV infection in children over 18 months of age."},
 {t:"h",x:"Infant postnatal ARV prophylaxis"},
 {t:"p",x:"Zimbabwe is implementing universal triple prophylaxis for ALL HIV-exposed infants, rather than adopting the full risk-stratification model. It is recommended that:"},
 {t:"ul",x:["Administer AZT + 3TC + NVP for 6 weeks for all HIV-exposed infants (continuing triple therapy with established medicines).","Step-down: NVP monotherapy from 6 weeks until end of breastfeeding or until maternal viral suppression is confirmed."]},
 {t:"p",x:"A NAT should be performed prior to initiating the triple regimen. If the result is not immediately available, at least collect a specimen, as combination ARV prophylaxis may reduce the sensitivity of diagnostic testing for approximately 2-6 weeks after discontinuation."},
 {"t": "m", "title": "Updated infant postnatal ARV prophylaxis regimen", "li": 0, "cols": ["Phase", "Regimen", "Duration"], "rows": [[["**Triple prophylaxis"], ["AZT + 3TC + NVP"], ["Birth to 6 weeks (all HIV-exposed infants)"]], [["**Step-down"], ["NVP monotherapy"], ["From 6 weeks until end of breastfeeding or confirmed maternal VL suppression"]]]},
 FIG("art-inf1","Dosing schedule for AZT/3TC plus NVP in HIV-exposed infants"),
 FIG("art-inf2","Dosing for infant prophylaxis for infants above 12 weeks"),
 {t:"p",x:"Note: the prophylaxis doses (for example ¼ of the AZT/3TC 60/30 dispersible tablet 2 times a day from birth to 6 weeks) are lower than the treatment doses used for a neonate known to be HIV positive (for example 1 tablet 2 times a day at 3–4 kg in the 0–4 week ART table). The very low prophylactic dose limits side effects in an exposed infant who is not proven to be infected. Once infection is proven the effects of HIV are severe, so the dose is higher. By 6–12 weeks the liver is more mature and higher doses, such as 1 tablet, are tolerated even for prophylaxis."},
 {t:"p",x:"Cotrimoxazole must be started from 6 weeks of age even in babies on longer duration of prophylaxis and continued until final confirmation of HIV negative status at 18 months or the end of the breastfeeding if breastfed for more than 18 months. Cotrimoxazole should be continued through adolescence for HIV positive children."},
 {t:"p",x:"Note: the chapter on HIV-related disease gives an earlier window of 4–6 weeks after birth for starting cotrimoxazole in HIV-exposed infants. Strictly speaking, 6 weeks is the proper time; the broader window is deliberate, because caregivers show up for care at unpredictable times and many are lost to follow-up, so a wide window makes sure the child is captured by the system."},
 {t:"h",x:"Establishing HIV exposure"},
 {t:"p",x:"All infants with unknown or uncertain HIV exposure being attended to at healthcare facilities at or around birth or at the first postnatal visit (usually 4-6 weeks) or other child health visit should have their HIV exposure status ascertained. This can be done by:"},
 {t:"ul",x:["asking if the mother knows her HIV status or is on ART,","checking the handheld child health card for information on maternal HIV status,","performing a rapid HIV test on the mother."]},
 {t:"p",x:"Where NAT is not available for children under 18 months of age, a presumptive diagnosis of severe HIV disease should be made if the infant is confirmed HIV antibody positive and:"},
 {t:"ul",x:["a diagnosis of any AIDS-defining condition(s) can be made, or","the infant is symptomatic with two or more of the following: oral thrush, severe pneumonia, severe sepsis."]},
 {t:"p",x:"Infants under 18 months of age with clinically diagnosed presumptive severe HIV should be started on ART. Confirmation of HIV diagnosis should be obtained as soon as possible."},
 {t:"h",x:"Care of an HIV-exposed infant"},
 {t:"ul",x:["Make sure HIV-exposed infants are entered into the “HIV exposed follow-up register”.","All HIV-exposed infants should have a nucleic acid test performed from birth or at the earliest possible time thereafter if birth testing is missed.","Cotrimoxazole prophylaxis should be given from six weeks of age until the HIV status of the infant is known. If HIV infection is confirmed, continue cotrimoxazole and commence ART.","Monthly follow-up visits are recommended, but more frequent visits may be needed if problems are detected."]},
 {t:"p",x:"During these visits the following services should be provided: growth monitoring and promotion, developmental assessment, and age-appropriate vaccinations."},
 {t:"h",x:"Counselling on infant and young child feeding"},
