 {t:'m',title:'Gentamicin: dose and frequency by weight and age (premature or full-term neonates)',li:0,cols:['Weight','Age','Dose','Frequency'],rows:[

  note:'The administration of antibiotics in neonates depends on the weight, age, and sometimes gestational age at birth of the patient. For example: benzylpenicillin dose 100,000 u/kg/dose (0.1 MU/kg). A 2 kg pre-term baby 5 days old would receive 200,000 u benzylpenicillin every 12 hours, whilst a 2 kg term baby 5 days old would receive 200,000 u every 8 hours.'}];
const D=[
{id:"pneumonia",name:"Pneumonia",sec:"Acute respiratory infections",blocks:[
 {t:'m',title:'Classification of pneumonia',cols:['Signs','Classify as','Treatment'],note:'Urgent pre-referral treatments are in bold print.',rows:[
 [['Any general danger sign','or','chest indrawing','or','stridor in a calm child'],['Severe pneumonia','or','very severe disease'],['**• Give first dose of an appropriate antibiotic (Benzylpenicillin and gentamicin)','**• Treat to prevent low blood sugar (see below)','**• Keep the child warm','**• Treat wheeze if present','**• Refer URGENTLY to hospital']],
 [['Fast breathing'],['Pneumonia'],['**• Give an appropriate antibiotic for 5 days','• Treat wheeze if present','• Advise mother to return immediately if condition worsens','• Follow-up in 2 days']],
 [['No signs of pneumonia or of very severe disease'],['No pneumonia: cough or cold'],['• If coughing more than 21 days, refer for assessment','**• Treat wheeze if present','• Advise mother to return immediately if condition worsens','• Follow-up in 7 days if not improving']]]},
 {t:"h",x:"Cough / difficult breathing (no pneumonia)"},
 {t:"p",x:"Home care and instructions on when to return are all that are needed. No antibiotics, antihistamines or cough mixtures are required."},
 {t:"g",title:"If the temperature is above 37.5˚C:",rows:[PARA],note:"Do not give paracetamol to children under 3 months of age due to liver immaturity, if indicated give cautiously."},
 {t:"h",x:"Management of pneumonia"},
 {t:"g",title:"First line:",rows:[R("amoxicillin","po","C V","4 – <6kg = 62.5mg\n6 – <14kg = 125mg\n14 – 19kg = 250mg","3 times a day","5 days",{k:"wt",b:[[4,6,"62.5 mg"],[6,14,"125 mg"],[14,19,"250 mg","i"]]}),"OR",
  {...PROC("<1yr = 150mg\n1 – 3yrs = 300mg\n3 – 5yrs = 450mg","once a day"),d:"<1yr = 150mg\n1 – 3yrs = 300mg\n3 – 5yrs = 450mg"}],note:"Reassess after 2 days of antibiotic treatment. If not responding then refer, as the second line choices are limited."},

 {t:"g",title:"Alternative treatment for severe pneumonia (if benzylpenicillin is not available):",rows:[R("ampicillin","iv","B E","50-75mg/kg","6 hourly","5 days",{k:"mgkg",lo:50,hi:75,u:"mg"}),"AND",
  R("procaine penicillin","im","C V","<1yr = 150mg (½ml)\n1 – 3yrs = 300mg (1ml)\n3 – 5yrs = 450mg (1½ml)","once daily","5 days",{k:"age",b:[[0,12,"150 mg (½ml)"],[12,36,"300 mg (1ml)"],[36,60,"450 mg (1½ml)"]]})],note:"Change to oral amoxicillin when patient improves and tolerates oral drugs. If less than 6 months add high dose cotrimoxazole for 21 days and check HIV status. In HIV positive children consider steroids."}
]},
{id:"wheezing",name:"Wheezing",sec:"Acute respiratory infections",blocks:[

 [['• Chest indrawing or any danger sign'],['Give first dose of benzyl penicillin and refer urgently to hospital.'],['Nebulise with salbutamol*, give oral prednisolone and antibiotic.','Refer urgently to hospital.']],
 [['• Fast breathing'],['Give first dose of benzyl penicillin and refer urgently to hospital.'],['Nebulise with salbutamol or give oral bronchodilator*.','Send home on treatment as “pneumonia”.','Follow up in 2 days.']],
 [['• No fast breathing'],['Treat as “no pneumonia, cough/cold”.','Follow up after 2 days.'],['Nebulise with salbutamol or give oral bronchodilator*.','Send home on treatment as “no pneumonia, cough/cold”.','Follow up in 7 days.']]]},
 {t:'m',li:0,title:'Children with previous episodes of wheezing',cols:['','Child under 1 year','Child 1 year and over'],note:'* Assess the child’s condition 30 minutes later and treat according to this assessment.',rows:[

 [['• Fast breathing'],['Nebulise with salbutamol or give oral bronchodilator*.','Send home on treatment as “pneumonia”.','Follow up in 2 days.'],['Give oral bronchodilator*.','Send home on treatment as “pneumonia”.','Follow up in 2 days.']],
 [['• No fast breathing'],['Nebulise with salbutamol or give oral bronchodilator*.','Send home on treatment as “no pneumonia, cough/cold”.','Follow up in 7 days.'],['Give oral bronchodilator*.','Send home on treatment as “no pneumonia, cough/cold”.','Follow up in 7 days.']]]},
 {t:"ul",x:["In a young infant below 2 months, wheeze is a sign of serious illness – refer.","An infant between 2 months and 12 months may wheeze because of bronchiolitis, which is usually a viral infection. If a child with bronchiolitis is breathing fast, refer. If not, give home care.","In a child more than one year wheezing may be due to asthma. If it is the first episode refer. If this child is in distress, give a rapid-acting bronchodilator for example salbutamol and refer."]},

]},
{id:'neo-birth',name:'Newborn: routine care at birth and resuscitation',sec:'Newborn care',blocks:[
 {t:'p',x:'The content of this chapter reflects the major causes of infant mortality and morbidity in Zimbabwe: prematurity, neonatal sepsis, perinatal asphyxia, acute respiratory infections, diarrhoeal diseases, malnutrition and immunizable diseases. Some of the paediatric conditions may have underlying HIV infection.'},
 {t:'p',x:'Refer to relevant chapters in EDLIZ for other paediatric conditions and note that appropriate paediatric doses have been included.'},
 {t:'p',x:'Note: doses are also given by age and weight wherever possible, and volumes of liquids or injections to be administered are indicated. However, always check the concentration of the preparation, as preparations may change. This should not be a ‘short-cut’ to calculating the proper dose.'},
 {t:'h',x:'Routine management at birth'},
 {t:'ul',x:['Do not routinely suction mouth but suction only if there is something (e.g. thick meconium) to suck out.','Dry and wrap up, preferably in a dry pre-warmed soft towel.','Delayed cord clamping: clamping the umbilical cord after 1 minute is recommended for all normal births except in intrauterine growth restriction (IUGR), infants of diabetic mothers and asphyxia.','Weigh the baby.']},
 {t:'g',title:'To prevent neonatal ophthalmia, instil eye ointment into both eyes:',rows:[R('tetracycline eye ointment 1%','','C V','instil into both eyes','once only','at birth')]},

 {t:'ul',x:['Hand the baby to the mother for her to put immediately to breast.','Put baby skin to skin with the mother.','DO NOT LEAVE THE BABY ALONE.']},
 {t:'h',x:'Helping babies survive'},

 {t:'h',x:'Resuscitation of the newborn'},
 {t:'p',x:'DO NOT LEAVE THE BABY ALONE. IF THE BABY NEEDS RESUSCITATION, FOLLOW THE PROTOCOL BELOW.'},
 FIG('resus','Neonatal resuscitation algorithm: birth to initial stabilisation'),
 {t:'p',x:'Ensuring adequate warmth and ventilation (either by mask or intubation) is much more important than administering any medicines. The following may be useful:'},

{id:'neo-feeding',name:'Newborn: feeding, fluids and breastmilk fortification',sec:'Newborn care',blocks:[
 {t:'h',x:'Feeding'},
 {t:'p',x:'Healthy term babies and late preterm babies more than 34 weeks are usually able to suck unless they are ill.'},
 {t:'ul',x:['Breastfeed; exclusive breastfeeding is encouraged.','Initiate breastfeeding within the first hour of life.','Allow mothers to breastfeed on demand and room-in.']},
 {t:'h',x:'For sick and/or premature infants who are unable to suck'},
 {t:'ul',x:['Give expressed breast milk (EBM) via nasogastric or orogastric tube or cup.','Use formula feeds only if EBM is not available.','Give preterm infant milk formula if <2000g and/or 35 weeks.','Standard infant formula ≥2000g.']},
 {t:'h',x:'Fluid requirements'},
 {t:'ul',x:['Infants ≥1500g and ≥32 weeks: start on intermittent bolus feeds at 60 mls/kg/day and increase by 30 mls/kg/day as tolerated to a maximum of 150 mls/kg/day for term babies and 200 mls/kg/day for preterm infants.','Infants <1500g or <32 weeks should receive IV fluids to allow gradual increase of enteral feeds. Start enteral feeds at 20 mls/kg/day and increase by 30 mls/kg/day.','Keep infants <1500g/<32 weeks nil by mouth immediately after birth (unless mother’s colostrum is present) to allow mum to start expressing breastmilk.']},

 {t:'h',x:'Choice of fluids for use with the preterm protocol'},
 {t:'ul',x:['10% dextrose if >1kg.','5-10% dextrose if <1kg.','Blood glucose must be monitored in the first 36-48 hours and can be stopped if normal.','Consider transfer to a specialist unit for babies unable to feed and requiring intravenous fluids for longer than 3 days.','ALWAYS KEEP THE BABY WARM.']},
 {t:'h',x:'Breastmilk fortification'},
 {t:'p',x:'Breastmilk fortification helps to meet the increased energy and mineral requirements of preterm infants.'},

  [['**Age/weight of neonate'],['Fortify breastmilk of preterm neonates <1500 g or <32 weeks']],
  [['**When to fortify'],['For neonates with poor weight gain, start fortification when neonate is tolerating 160 ml/kg/day of EBM']],
  [['**How much to give'],['Bolus feeds ≤24 ml: add 0.5 g FM85','Bolus feeds ≥25 ml: add 1 g FM85']],
  [['**Total volume recommended'],['If breastmilk is fortified a total volume of 160 ml/kg/day will suffice to meet energy requirements']]]}]},
{id:'neo-sepsis',name:'Neonatal infection and sepsis',sec:'Neonatal conditions',blocks:[
 {t:'h',x:'Indications for doing a blood culture and starting antibiotics in the first 48 hours'},
 {t:'ul',x:['Any major criterion or two or more minor criteria (see table below): do a blood culture and start antibiotics.','Suspected sepsis: give antibiotics as soon as possible, within 1 hour.','One minor criterion present: observe the baby on postnatal wards for 12 hours.','Start antibiotics if the baby is not feeding well, has respiratory distress or appears lethargic or sick in any other way.']},
 {t:'m',title:'Criteria for initiating empiric antibiotics in neonates',li:0,cols:['Criteria','Start antibiotics if'],rows:[
  [['**Major criteria'],['Any one of these:','Confirmed sepsis or chorioamnionitis in mother','Confirmed or suspected sepsis in twin','Seizures','Severe respiratory distress in a term infant','Respiratory distress starting more than 4 h after birth','Signs of shock']],
  [['**Minor criteria: antenatal'],['Any two minor criteria:','Rupture of membranes >18 h','Spontaneous preterm birth','GBS sepsis in previous baby, or documented GBS carriage in this pregnancy (urine or vaginal swab)']],
  [['**Minor criteria: natal'],['Born before arrival','Meconium-stained liquor']],
  [['**Minor criteria: postnatal'],['Respiratory distress not obviously related to environmental hypothermia or “delayed transition to extra-uterine life” (mild to moderate distress apparent soon after birth that is improving with time)','Hypoxia / apnoea','Hypoglycaemia / hyperglycaemia not otherwise explained','Temperature instability not explained by environmental factors','Acidosis not obviously related to HE','Unexplained bleeding or thrombocytopenia','Mild encephalopathy / altered responsiveness','Altered tone not otherwise explained','Feed intolerance / feeding difficulty','Abnormal heart rate (<90 or >160)','Jaundice in first 24 h']]]},
 {t:'h',x:'Medicine dosage for infants under 1 month'},
 {t:'p',x:'During the first month of life absorption, metabolism and excretion in a baby are not yet fully developed. For this reason, the frequency of medicine dosing is based on gestational age and not on the characteristics of the medicine.'},
 ...NSCH,
 {t:'h',x:'Neonatal sepsis'},
 {t:'p',x:'There are usually few localising signs in infants, and accurate diagnosis may not be possible. The following regimens are recommended for suspected sepsis.'},
 {t:'g',title:'Suspected sepsis in first 48 hours:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','10 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch')]},
 {t:'g',title:'Suspected sepsis after 48 hours:',rows:[X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',X(R('cloxacillin','im/iv','B V','30mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:30,u:'mg'}),'nsch')],note:'Kanamycin 7.5mg/kg/dose 2 times a day can be used if gentamicin is unavailable.'}]},
{id:'meningitis',name:'Neonatal meningitis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'If the neonate has meningitis:'},
 {t:'g',title:'Meningitis treatment in neonates:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','14-21 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','14-21 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',X(R('chloramphenicol','iv','B V','12.5mg/kg','follow penicillin dosing scheme','14-21 days',{k:'mgkg',lo:12.5,u:'mg'}),'nsch')],note:'Ampicillin can be used if benzylpenicillin is not available: dose = 75mg/kg/dose, given as per penicillin dosing scheme. Ceftriaxone can be used as an alternative (monotherapy): dose = 50mg/kg/dose (age <14 days) or 100mg/kg/dose (age ≥14 days), given once daily [or for neonates age ≥14 days, dividing the total into two equal doses for 2 times a day administration].'},
 ...NSCH]},
{id:'nec',name:'Necrotising enterocolitis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Give nothing by mouth. Supportive care is vital: oxygen, intravenous fluids, warmth, and nasogastric continuous drainage. Anticipate complications such as bleeding, vomiting, perforation, seizures. Refer for specialist diagnosis and care.'},
 {t:'g',title:'Necrotising enterocolitis:',rows:[X(R('benzylpenicillin','im/iv','C V','0.1MU/kg','see dosing scheme','10 days',{k:'mgkg',lo:0.1,u:'MU',dp:3}),'nsch'),'AND',X(R('gentamicin','im/iv','C V','2.5mg/kg','see dosing scheme','10 days',{k:'mgkg',lo:2.5,u:'mg'}),'nsch'),'AND',R('metronidazole','iv','A N','7.5mg/kg','2–3 times a day','10 days',{k:'mgkg',lo:7.5,u:'mg'})]},
 ...NSCH]},
{id:'tetanus',name:'Neonatal tetanus',sec:'Neonatal conditions',blocks:[
 {t:'g',title:'The important principle in treating these babies is minimal handling. Give:',rows:[R('benzylpenicillin','im/iv','C V','0.05MU/kg','12 hourly','5–7 days',{k:'mgkg',lo:0.05,u:'MU',dp:3}),'OR',R('procaine penicillin','im','C V','50mg/kg','once a day','5–7 days',{k:'mgkg',lo:50,u:'mg'}),'AND',R('anti-tetanus immunoglobulin','im','B E','500–1000 units','once a day','single dose')]},
 {t:'g',title:'Control of muscle spasms in tetanus:',rows:[R('diazepam','iv','C V','0.25–1mg/kg (max dose: 10mg)','4–8 hourly based on response','titrated to effect',{k:'mgkg',lo:0.25,hi:1,u:'mg',mx:10}),'OR',R('chlorpromazine','iv/im/nasogastric','C V','2mg/kg/24 hrs in divided doses','4–6 doses per day','titrated to effect'),'AND',R('phenobarbitone','iv/im/nasogastric','B E','2.5–5mg/kg','12 hourly','titrated to effect',{k:'mgkg',lo:2.5,hi:5,u:'mg'})]}]},
{id:'congenital-syphilis',name:'Congenital syphilis',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Also see section on STIs.'},
 {t:'g',title:'Congenital syphilis:',rows:[R('procaine penicillin','im','C V','50mg/kg','once daily','10 days',{k:'mgkg',lo:50,u:'mg'})]}]},
{id:'jaundice',name:'Neonatal jaundice',sec:'Neonatal conditions',blocks:[
 {t:'ul',x:['Refer all babies developing jaundice within 24 hours of birth to a unit capable of performing exchange transfusion.','Refer jaundiced babies who look ill.','Jaundice developing in well babies may be treated using phototherapy. If phototherapy equipment is not available, expose to the sun intermittently for a maximum of two hours (keep warm). Shade the baby’s eyes with a loose-fitting bandage over cotton wool pads. Continue until the baby is no longer yellow.','Give an extra 20ml/kg/24 hrs of fluid. Be very careful that the baby does not get cold (or hot). Encourage increased breastfeeding.','Where possible check the serum bilirubin levels.']},
 FIG('tsb3','Phototherapy and TSB monitoring in the first week: well term infants over 3 kg'),
 FIG('tsb2','Phototherapy and TSB monitoring in the first week: well infants 2 to 3 kg and over 35 weeks'),
 FIG('jthr','Treatment of jaundice based on serum bilirubin level'),
 FIG('phot','Phototherapy thresholds'),
 FIG('exch','Exchange transfusion thresholds'),
 FIG('exproto','Protocol for doing the exchange transfusion')]},
{id:'convulsions',name:'Neonatal convulsions',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Always check for hypoglycaemia. Other common causes of neonatal convulsions: hypoxic ischaemic encephalopathy, meningitis, hypocalcaemia.'},
 {t:'g',title:'If dextrose <2.2mmol/l (45mg%) immediately give:',rows:[R('dextrose 10% infusion','','A N','4ml/kg/hr','',''),'OR',R('dextrose 10% infusion','','A N','2ml/kg bolus then 6-8ml/kg/hr continuous infusion','',''),'OR',R('dextrose 50%','slow iv bolus','C V','1ml/kg diluted with equal quantity of water for injection','','',{k:'mgkg',lo:1,u:'ml'})],note:'Recheck blood sugar (dextrostix / glucometer) in 30 minutes.'},
 {t:'p',x:'If intravenous route is impossible give breast milk through nasogastric route, 10-20ml/kg initially, and continue normal requirement 2 hourly. Dextrose should not be given by nasogastric tube. If blood glucose cannot be measured give empirical treatment with glucose.'},
 {t:'h',x:'How to prepare 10% dextrose'},
 {t:'p',x:'The formula for preparing 100 mL of fluid with a desired concentration of glucose using 5% dextrose and 25% dextrose solutions is 5X-25 = Y, where X is the required percentage of dextrose and Y is the amount of 25% dextrose (in mL) to be made up with 5% dextrose to make a total of 100 mL.'},
 {t:'p',x:'To prepare 100 ml of 10% dextrose from 5% dextrose and 25% dextrose: 5 × 10 − 25 = 25 ml of 25% dextrose, added to the remaining volume, i.e. 100 − 25 = 75 ml of 5% dextrose.'},
 {t:'h',x:'Medical management'},
 {t:'ul',x:['ABC: manage airway and breathing (have bag and mask ready); ensure circulatory access.']},
 {t:'h',x:'Anticonvulsants'},
 {t:'p',x:'Phenobarbitone is the drug of choice for neonatal seizures.'},
 {t:'g',title:'If a neonate is having seizures give:',rows:[R('phenobarbitone','iv slow bolus (over 5-10 min)','B E','20mg/kg\nrepeat every 30 min if still convulsing at dose of 10mg/kg, up to max dose of 40mg/kg\nmaintenance dose of 5mg/kg started 12 hours after loading dose','','',{k:'mgkg',lo:20,u:'mg'}),'OR',R('phenytoin','iv*','C V','20mg/kg bolus\nrepeat dose at 10mg/kg if refractory seizures\nmaintenance dose of 3-5mg/kg/day in 2-4 divided doses','','',{k:'mgkg',lo:20,u:'mg'})],note:'*Indicated when the maximum dose of phenobarbitone 40mg/kg fails to resolve the seizures or adverse effects like respiratory depression, bradycardia or hypotension occur. Please note: dilute phenytoin in normal saline. Do NOT use dextrose.'},
 {t:'h',x:'Benzodiazepines'},
 {t:'p',x:'These may be required in 15-20% of neonatal seizures.'},
 {t:'g',title:'If benzodiazepines are needed for seizure control give:',rows:[R('lorazepam','iv slow bolus (over 2-5 min)','','0.05mg/kg\nmay be repeated if still convulsing','','',{k:'mgkg',lo:0.05,u:'mg',dp:3}),'OR',R('midazolam','iv','','0.15mg/kg bolus\nfollowed by maintenance infusion at 0.1-0.4mg/kg/hr','','',{k:'mgkg',lo:0.15,u:'mg',dp:3})],note:'Avoid diazepam in neonatal seizures because of its short duration of anti-epileptic effect and its very prolonged sedative effect.'},
 {t:'h',x:'Check blood levels of calcium and magnesium'},
 {t:'p',x:'If there is hypocalcaemia give 2 mls/kg of 10% calcium gluconate.'}]},
{id:'rds',name:'Respiratory distress syndrome (RDS)',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'RDS is a common problem in premature infants. It is due to surfactant deficiency.'},
 {t:'h',x:'Treatment of RDS'},
 {t:'ul',x:['Minimal handling.','Supplemental oxygen with nasal prongs; maintain oxygen saturation 90-94%.','Give surfactant to improve the oxygenation. In term babies give surfactant 100mg/kg within 8 hours of birth. For preterm neonates give surfactant 100mg/kg, preferably within 15 minutes of birth. The dose may be repeated within 48 hours at intervals of at least 6 hours for up to 4 doses.','Use continuous positive airways pressure (CPAP) ventilation if available.','Initially no oral feeds if severe respiratory distress.','Intravenous fluids (see section on fluids).','Treat for neonatal sepsis with antibiotics (see section on neonatal sepsis).','Maintain normal temperature range by Kangaroo Mother Care or using an incubator if available.','If respiratory distress persists do a chest x-ray to rule out pneumothorax.']},
 {t:'h',x:'Prevention of RDS'},
 {t:'ul',x:['For pregnant mothers <34/40 and at risk of premature delivery: give dexamethasone 12mg/kg 24 hours apart for 3 days.']}]},
{id:'apnoea',name:'Apnoea of prematurity',sec:'Neonatal conditions',blocks:[
 {t:'p',x:'Premature infants are at risk of apnoea due to immaturity of the respiratory centre. For prevention of apnoea in preterm babies <32/40 weeks give the following:'},
 {t:'g',title:'To improve respiratory drive, give:',rows:[R('caffeine citrate','iv infusion (for those <32/40 weeks)','B V','loading dose 20mg/kg\nand\nmaintenance dose 5mg/kg','once a day','until 34/40 weeks postpartum'),'OR',R('aminophylline','','B V','loading dose 6mg/kg (infuse over 30 minutes)\nmaintenance dose 2.5mg/kg','12 hourly','',{k:'mgkg',lo:6,u:'mg'})]},
 {t:'h',x:'Monitoring for apnoea'},
 {t:'p',x:'Use an apnoea monitor if available or a pulse oximeter with the alarm turned on for hypoxaemia.'},
 {t:'p',x:'NB. The following conditions can also cause apnoea in the premature infant and every attempt should be made to exclude them and manage:'},
 {t:'ul',x:['Central nervous system infections','Hypoxic ischaemic encephalopathy','Respiratory distress syndrome','Hypoglycaemia','Severe anaemia','Congestive cardiac failure']}]},
{id:'neo-vitamins',name:'Low birth weight: immunisation, vitamins and iron',sec:'Neonatal conditions',blocks:[
 {t:'h',x:'Immunisation'},
 {t:'p',x:'Low birth weight infants should be given all the scheduled vaccines at the time of birth and any second doses that are due at discharge and according to chronological age.'},
 {t:'h',x:'Vitamins and iron'},
 {t:'p',x:'Normal newborn babies do not require any long-term vitamin or mineral supplementation. Starting at 2 weeks of age, those babies born at <36 weeks gestation and/or <1.5kg should be given:'},
 {t:'g',title:'Vitamins:',rows:[R('vitamin D','po','B V','400 units','2 times a day','to age of 3 months'),'AND',R('folic acid','po','C E','5mg','weekly','to age of 3 months')]},
 {t:'p',x:'and, starting from the age of one month:'},
 {t:'g',title:'Iron:',rows:[R('ferrous sulphate','po','C E','3–6mg/kg elemental iron\n(60mg/5mls FeSO4 = 12mg elemental iron/5mls)','once a day','to age of 6 months',{k:'mgkg',lo:3,hi:6,u:'mg'})]}]},

{id:'danger-signs',name:'Danger signs and use of antibiotics (IMCI)',sec:'General paediatrics',blocks:[
 {t:'p',x:'For management of other paediatric conditions refer to the appropriate chapter, e.g. cardiovascular disease in children (Cardiovascular chapter), neurological conditions in children (Neurological chapter), renal tract infections in children (Renal Tract Infections chapter).'},
 {t:'h',x:'Integrated Management of Childhood Illness (IMCI)'},
 {t:'p',x:'Common paediatric conditions such as acute respiratory infections (ARI), diarrhoea, child with fever (axillary temperature 37.5°C and above), and severe malnutrition or protein energy malnutrition (PEM) are now incorporated in the Integrated Management of Childhood Illness (IMCI).'},
 {t:'h',x:'Check for general danger signs'},
 {t:'p',x:'Ask:'},
 {t:'ul',x:['if the child is not able to drink or breastfeed','if the child is vomiting everything','if the child has had convulsions','if there are periods of not breathing']},
 {t:'p',x:'Look to see if the child is lethargic or unconscious.'},
 {t:'p',x:'A child with any general danger sign needs urgent attention.'},
 {t:'h',x:'General guidelines on the use of antibiotics'},
 {t:'p',x:'Note: paediatric dose starts at 2 months in IMNCI. For babies 1-2 months see neonatal doses.'},
 {t:'ul',x:['ALWAYS COLLECT BLOOD FOR CULTURES BEFORE INITIATION OF ANTIBIOTICS IN SUSPECTED SEPSIS.','Supportive measures are often more important than antibiotics themselves: for example, fluids in diarrhoea and vomiting.','Antibiotics should be given in the full dosage appropriate for the age and weight of the child; dosage is best calculated according to body weight up to 40kg (do not exceed the adult dose).','Change to oral administration wherever possible (except for meningitis); benzylpenicillin intramuscularly/intravenously can be changed to procaine penicillin intramuscularly (if response is good) once a child is afebrile.']},
 {t:'h',x:'Fever in a malaria area'},
 {t:'ul',x:['Take a blood slide and treat for malaria (see chapter on Malaria).','Fever for more than 5 days: refer for assessment.','In malaria endemic areas, a child with pneumonia and a fever of 37.5°C or more (or a history of fever) may need an antibiotic for pneumonia and an anti-malarial for malaria.']}]},
{id:"ob-contra-pills",name:"Oral contraceptives and their interactions",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Medicines should be avoided, if possible, throughout pregnancy, and especially during the first trimester. However, medicines may be required for a number of conditions commonly encountered during pregnancy; medicines which are appropriate and safe are covered in the sections that follow. At the end of the chapter is a list of those medicines which should be avoided or used with caution during pregnancy or lactation. The Family Planning Guidelines of Zimbabwe provide comprehensive guidance. Refer to them wherever possible. Instructions for use, contraindications etc, are also found in the manufacturers' package inserts."},
 {t:"h",x:"Hormonal contraception"},
 {t:"p",x:"Important: Ensure a free and informed choice by providing counselling on the advantages and disadvantages of contraceptive methods. Oral, injectable and implants do not protect against HIV. For added protection there is need to use a barrier contraceptive such as a male or female condom."},
 {t:"h",x:"Checklist for those not trained in family planning"},
 {t:"p",x:"Before prescribing oral contraceptives ask the following questions. If answers to all these questions are ‘no’, the woman may be given any oral contraceptives. If any of the answers are ‘yes’, a doctor must see her first."},
 {t:"ul",x:["History of severe leg pain or swelling of calf?", "History of sugar in urine?", "History of yellow eyes or skin?", "Severe chest pain?", "Unusual shortness of breath after walking or light work?", "Severe headaches (not relieved by pain tablets)?", "Bleeding between periods or after sexual intercourse?", "Missed a menstrual period?", "Missed a menstrual period, and then started bleeding?", "Very heavy menstrual periods?", "Increased frequency of menstrual periods?", "History of mental disturbances?", "Goitre or history of goitre?", "40 years of age and over?", "Painful varicose veins?", "Had any surgical operation within last 2 weeks?", "Previous treatment for high blood pressure?", "History of epilepsy?"]},
 {t:"h",x:"Oral contraceptives"},
 {t:"p",x:"IMPORTANT: Instruct the woman to always inform the doctor or nurse that she is taking oral contraceptives when she attends a clinic or hospital. Encourage clients to have a check-up every two years or when she develops a problem."},
 {t:"p",x:"Ensure that the supplies given to the woman allow her to always have an extra pack of pills. Also, provide a supply of condoms with the first pack of pills for additional protection if the client is not menstruating. Encourage use of condoms as well to protect against STIs especially HIV."},
 {t:"h",x:"Combined oral contraceptives (COCs)"},
 {t:"p",x:"These contain synthetic oestrogen and progestogen and if taken daily they inhibit ovulation. Those with oestrogen content 30-35 micrograms (as ethinyl oestradiol) are ‘low dose’ while those containing 50 micrograms of oestrogen are referred to as ‘high dose’."},
 {t:"p",x:"The lower oestrogen dose pills have fewer side effects than higher dose pills (notably, reduced risk of thrombo-embolism) while maintaining a high rate of effectiveness."},
 {t:"p",x:"Menstruation on COCs will be regular and light."},
 {t:"p",x:"Can be used to treat other conditions, such as: period pain, heavy periods, acne, endometriosis, premenstrual syndrome."},
 {t:"p",x:"CAUTION: Side effects include mood swings, breast tenderness, and headaches."},
 {t:"ul",x:["If patient starts pill after an abortion, or on the first day of a period, it will work straight away.", "If patient starts the pill on any other day, then abstain from sex for 7 days or use extra precautions (e.g. condoms).", "Not suitable for women over 35 who smoke.", "Small risk of blood clots.", "Not suitable for women with high blood pressure."]},
 {t:"g",ad:1,title:"Pill-based contraceptives (COCs):",rows:[R("combined oral contraceptive","(COC) pill","C V","1 tablet","once daily","")]},
 {t:"p",x:"Each COC pill contains either 50mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “high dose” COC) or 30-35mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “low dose” COC)"},
 {t:"h",x:"Conditions warranting withdrawal of combined oral contraceptives"},
 {t:"ul",x:["pregnancy or suspected pregnancy", "severe headaches especially associated with visual disturbances", "numbness or paresis of extremities", "unexplained vaginal bleeding", "suspected or known carcinoma of the breast", "known liver tumour", "unexplained chest pain or shortness of breath", "severe leg pains", "development of any of the absolute contra-indications mentioned in the manufacturer’s information sheet"]},
 {t:"h",x:"Progestogen only pills (POPs)"},
 {t:"p",x:"These contain synthetic progestogen e.g. norethisterone or levonorgestrel. Progestogens protect against pregnancy by thickening the cervical mucus."},
 {t:"ul",x:["suitable for women who do not want to or cannot take oestrogen for health reasons", "can be used by women who are breastfeeding", "can be used by women who smoke"]},
 {t:"p",x:"CAUTION: Progestogen only pills have a significant failure rate in non-lactating women."},
 {t:"ul",x:["They should be taken at the same time each day.", "Menstrual irregularities are a more common side effect.", "If patient starts pill after an abortion, or on the first day of a period, it will work straight away.", "If patient starts the pill on any other day, then abstain from sex for 2 days or use extra precautions (e.g. condoms)."]},
 {t:"g",ad:1,title:"Pill-based contraceptives (POPs/Secure):",rows:[R("levonorgestrel","","C V","1 tablet","once","")]},
 {t:"p",x:"Each Secure (POP) pill contains 750mcg levonorgestrel"},
 {t:"h",x:"Medicines interactions with oral contraceptives"},
 {t:"h",x:"Medicines reducing the effect of oral contraceptives"},
 {t:"p",x:"Caution is needed when prescribing any of the following medicines to any woman taking oral contraceptives; they reduce the effectiveness of the oral contraceptive and pregnancy is more likely:"},
 {t:"ul",x:["Anti-convulsant: carbamazepine, ethosuximide, phenobarbitone, phenytoin, primidone.", "Antibacterials: rifampicin, rifabutin, rifapentine", "Anti-retroviral: efavirenz"]},
 {t:"p",x:"If the medicine is only going to be used for a short time the woman should be advised to take extra contraceptive precautions (for example, condoms) for the duration of the therapy, and seven days after treatment. If the medicine is to be used on a long-term basis the woman should be advised to use another suitable method of contraception."},
 {t:"h",x:"Medicines which are made less effective by oral contraceptives"},
 {t:"p",x:"Doses of medicines may need to be increased, with careful monitoring:"},
 {t:"ul",x:["Anticoagulants", "Anti-convulsant (phenytoin)", "Antidepressants (imipramine)", "Anti-hypertensive agents (methyldopa)", "Corticosteroids", "Hypnotics, sedatives or other CNS depressants (diazepam, phenothiazines)", "Anti-asthmatic agents"]}]},
{id:"ob-contra-long",name:"Injectable and implant contraceptives, emergency contraception, IUCD",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Long term hormonal contraceptives"},
 {t:"g",ad:1,title:"Injectable contraceptive:",rows:[R("medroxyprogesterone acetate","im","C V","150mg","once every 3 months","3 months"),"OR",R("norethisterone enanthate","im","B N","200mg","once every 2 months","2 months")]},
 {t:"p",x:"CAUTION: If the woman is hypertensive, has a history of heart disease, or has signs of damage to the arteries, vision, kidneys, and/or nervous system caused by diabetes, do not administer medroxyprogesterone [Depo-provera ®]."},
 {t:"p",x:"Side effects of medroxyprogesterone are like those of Progestogen Only Pills i.e. headaches, irregular uterine bleeding, nausea and vomiting, weight changes and depression. Transient infertility and irregular cycles may occur after discontinuation."},
 {t:"p",x:"Note: Norethisterone enanthate can be given up to 2 weeks (14 days) early or 2 weeks (14 days) late."},
 {t:"h",x:"Implant contraceptives"},
 {t:"ul",x:["suitable for women who desire a long term family planning solution, for example, those who have probably completed their family but are not yet ready for sterilisation", "also suitable for some women who cannot take oestrogen-containing contraceptives", "HIV positive women of childbearing age who are on a dolutegravir-based regimen should be encouraged to use them"]},
 {t:"g",ad:1,title:"Implant contraceptive:",rows:[R("levonorgestrel","implant (Jadelle)","B N","2 rods","once only","once in 5yrs"),R("etonogestrel","(Implanon)","B N","1 rod","once only","once in 3yrs")]},
 {t:"p",x:"CONTRAINDICATIONS: hypertension; thromboembolism; active liver disease; undiagnosed genital bleeding, severe headaches, malignancy of breast (known or suspected); malignancy of cervix, uterus or ovaries (known or suspected), cerebrovascular or coronary artery disease, pregnancy or suspected pregnancy."},
 {t:"h",x:"Emergency contraception"},
 {t:"g",ad:1,title:"Hormonal method – Give within 72 hours of unprotected intercourse:",rows:[R("combined oral contraceptive","(COC) pill","C V","2 tablets","repeat after 12 hours",""),"OR",R("combined oral contraceptive","pill","C V","4 tablets","repeat after 12 hours",""),"OR",R("levonorgestrel","750mcg","C V","1 tablet","repeat after 12 hours",""),"OR",R("levonorgestrel","1500mcg","C V","2 tablets","once","")]},
 {t:"p",x:"Use this regimen if COC pill contains 50mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “high dose” COC)"},
 {t:"p",x:"Use this regimen if COC pill contains 30-35mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “low dose” COC)"},
 {t:"p",x:"Note: For all emergency contraceptives, advise to return if menstruation does not occur within 3 weeks. Give appropriate contraceptive advice."},
 {t:"h",x:"Emergency contraception: intrauterine device method"},
 {t:"g",ad:1,title:"Intrauterine contraceptive device (IUCD) method – insert within 5 days of unprotected intercourse:",rows:[R("Copper T IUCD","","B N","1 device","once only","once in 10yrs")]},
 {t:"p",x:"CAUTION: may experience heavy menstrual periods and increased menstrual cramps (dysmenorrhea)."}]},
{id:"ob-gu-infections",name:"Genito-urinary infections in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Urinary tract infection during pregnancy"},
 {t:"p",x:"If possible, send urine specimens for microscopy, culture and sensitivity. If urine culture is positive, change antibiotics according to sensitivity results. Urine strips can also be used to detect UTI especially at the primary health care level."},
 {t:"g",ad:1,title:"First line:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","*7 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","*7 days")]},
 {t:"p",x:"*Note: The duration of treatment for UTI in pregnancy is longer than other general UTI."},
 {t:"p",x:"CAUTION: avoid ciprofloxacin in first trimester or preferably avoid completely during pregnancy if a safer alternative is available."},
 {t:"g",ad:1,title:"Second line:",rows:[R("norfloxacin","","B N","400mg","3 times a day","*7 days"),"OR",R("nalidixic acid","po","B V","500mg","4 times a day","*7 days"),"OR",R("amoxicillin-clavulanic acid","po","B N","375mg","3 times a day","*7 days")]},
 {t:"p",x:"*Note: The duration of treatment for UTI in pregnancy is longer than other general UTI."},
 {t:"p",x:"Third line: as per culture and sensitivity."},
 {t:"h",x:"Positive serology for syphilis during pregnancy"},
 {t:"p",x:"Rapid point of care screening must be done at the first antenatal contact for all pregnant mothers."},
 {t:"g",ad:1,title:"Both partners to be counselled and treated with:",rows:[R("benzathine penicillin","im","C V","2.4MU (=1.44g)","once a week","3 doses")]},
 {t:"p",x:"See chapter on Sexually Transmitted Infections for further information particularly for women who are allergic to penicillin."},
 {t:"h",x:"Vaginal discharge during pregnancy"},
 {t:"p",x:"The discharge can be due to candidiasis, bacterial vaginosis, trichomoniasis or physiological. A syndromic diagnosis should be made before treatment. There is need to consider the possibility of sexually transmitted infections including gonorrhoea and chlamydia (see Sexually Transmitted Infections chapter)."},
 {t:"g",ad:1,title:"Vaginal discharge during pregnancy:",rows:[R("miconazole","pv","C V","200mg","every night","3 days"),"OR",R("clotrimazole","pessary","C V","500mg","every night","3 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","7 days"),"OR",R("secnidazole","po","B N","2g","once only","")]},
 {t:"p",x:"Clotrimazole cream can also be used."},
 {t:"p",x:"CAUTION: avoid metronidazole in 1st trimester."}]},
{id:"ob-sepsis-pid",name:"Post-miscarriage sepsis and pelvic inflammatory disease",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Post-miscarriage sepsis"},
 {t:"p",x:"Pyrexia in a woman who has delivered or miscarried in the previous 6 weeks may be due to puerperal or post-miscarriage sepsis and should be managed actively. Abdominal pain in addition to pyrexia is strongly suggestive. The uterus may need evacuation. Suction curettage or manual vacuum aspiration are safer than sharp curettage and are the recommended first line procedures."},
 {t:"p",x:"Note: Every year some women die because of what is thought to be post-miscarriage sepsis when in reality it is fever from malaria causing abortion."},
 {t:"p",x:"Post-miscarriage sepsis will need a laparotomy and evacuation of uterus if the patient does not respond to antibiotic therapy."},
 {t:"g",ad:1,title:"Mild/moderate sepsis:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","10 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","10 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","10 days"),"AND",R("doxycycline","po","C V","100mg","2 times a day","10 days")]},
 {t:"h",x:"Acute pelvic inflammatory disease (PID)"},
 {t:"p",x:"Acute PID refers to the acute syndrome attributed to the ascent of microorganisms, not related to pregnancy or surgery, from the vagina and cervix to the endometrium, fallopian tubes and adnexal structures. Gonorrhoea, chlamydia, mycoplasma, anaerobic bacteria and gram-negative organisms can cause acute PID."},
 {t:"g",ad:1,title:"Mild / Moderate Pelvic Inflammatory Disease:",rows:[R("ceftriaxone","im","C V","1g","once only",""),"AND",R("doxycycline","po","C V","100mg","2 times a day","14 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","14 days")]},
 {t:"h",x:"Severe pelvic inflammatory disease"},
 {t:"p",x:"If the temperature is greater than 38°C with marked abdominal tenderness, then the patient needs IV fluids and IV medicines. If no response within 48 hours suspect pelvic abscess and patient may need laparotomy or referral."},
 {t:"g",ad:1,title:"Severe Pelvic Inflammatory Disease:",rows:[R("ceftriaxone","iv","C V","2g","once only","stop 24-48 hours after sustained clinical improvement"),"AND",R("doxycycline","po","C V","100mg","2 times a day","14 days"),"AND",R("metronidazole","pr","B V","1g","2 times a day","14 days")]},
 {t:"p",x:"Note: Duration of ceftriaxone is determined by the patient's response. Switch to oral after review – treatment for 14 days total."},
 {t:"p",x:"Metronidazole oral dose after stopping ceftriaxone is 400mg 8 hourly."},
 {t:"h",x:"Alternative"},
 {t:"g",ad:1,title:"Alternative regimen for severe pelvic inflammatory disease:",rows:[R("ampicillin","iv","B E","500mg","6 hourly","48–72 hrs"),"AND",R("gentamicin","im","C V","160mg","12 hourly","48–72 hrs"),"AND",R("metronidazole","pr","B V","1g","12 hourly","72hrs")]},
 {t:"p",x:"Note: Duration as determined by the patient's response. Switch to oral after review."}]},
{id:"ob-prom",name:"Pre-labour rupture of membranes and antibiotic prophylaxis in delivery",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Pre-labour rupture of membranes (PROM)"},
 {t:"p",x:"This is rupture of amniotic membranes at term before onset of labour."},
 {t:"g",ad:1,title:"Give stimulant to speed up labour:",rows:[R("oxytocin","infusion","C V","1 unit initially then","every 30 minutes",""),R("oxytocin","infusion","C V","4 units in 1L normal saline","at 15, 30, 60 drops per minute until regular contractions","")]},
 {t:"h",x:"Alternative"},
 {t:"g",ad:1,title:"Alternative to oxytocin:",rows:["OR",R("misoprostol","po","C V","25mcg","4 hourly","max 4 doses"),"OR",R("misoprostol","pv","C V","50mcg","once only","")]},
 {t:"p",x:"Note: For oral administration, dissolve Misoprostol 200 mcg in 200 ml of normal saline or water for injection. This gives a concentration of 1 mcg per ml."},
 {t:"p",x:"Repeat dosing of oral misoprostol can be done 24 hours after commencing the initial dose if the cervix remains unfavourable (Bishop score <6). Proceed with oxytocin infusion if the Bishop score is favourable."},
 {t:"p",x:"Avoid use of buccal and sublingual in viable pregnancies as it is associated with increased occurrence of foetal distress."},
 {t:"g",ad:1,title:"If >24 hours or pyrexia in labour, expedite delivery and give:",rows:[R("benzylpenicillin","iv","C V","2MU","6 hourly","until delivery"),"AND",R("chloramphenicol","iv","B V","500mg","6 hourly","until delivery"),"AND",R("metronidazole","iv","B N","500mg","8 hourly","until delivery")]},
 {t:"g",ad:1,title:"Switch to oral antibiotics for 7 days after delivery:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","7 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","7 days")]},
 {t:"h",x:"Prophylaxis for assisted vaginal delivery"},
 {t:"g",ad:1,title:"Prophylaxis for assisted vaginal delivery:",rows:[R("benzylpenicillin","iv","C V","5MU","once only","single dose"),"OR",R("ceftriaxone","iv","C V","1 gm","once only","single dose"),"OR",R("cefuroxime","iv","B V","750mg","once only","single dose"),"AND",R("metronidazole","iv","B V","500mg","once only","single dose")]},
 {t:"h",x:"Prophylaxis for caesarean section"},
 {t:"g",ad:1,title:"Prophylaxis for Caesarean Section (give 30-60 minutes before surgery):",rows:[R("benzylpenicillin","iv","C V","5MU","once only","single dose"),"OR",R("ceftriaxone","iv","C V","1 gm","once only","single dose"),"OR",R("cefuroxime","iv","B V","750mg","once only","single dose"),"AND",R("metronidazole","iv","B V","500mg","once only","single dose")]},
 {t:"p",x:"If there is evidence of infection during caesarean section, treat for a week with the above regime."}]},
{id:"ob-nvp",name:"Nausea and vomiting in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"During the first trimester, if vomiting is not excessive, advise small frequent bland meals and drinks."},
 {t:"p",x:"Antacids may give symptomatic relief if gastritis is present. If vomiting persists, look for underlying cause e.g. urinary tract infection, molar pregnancy, and multiple pregnancies."},
 {t:"g",ad:1,title:"For nausea and vomiting give:",rows:[R("promethazine","po","B N","25mg","once at night*","as required"),"OR",R("chlorpheniramine","po","C E","4mg","once at night*","5 days"),"OR",R("metoclopramide","","C N","10mg","3 times a day","as required")]},
 {t:"p",x:"*Note: If severe, the dose may be given two to three times a day."},
 {t:"h",x:"Hyperemesis gravidarum (vomiting and dehydration)"},
 {t:"g",ad:1,title:"For hyperemesis Gravidarum (vomiting + dehydration) admit and give fluids plus:",rows:[R("prochlorperazine","im","B E","12.5mg","2 times a day","as needed"),"OR",R("promethazine","im","B V","25mg","2 times a day","as needed"),"OR",R("metoclopramide","","C N","10mg","3 times a day","as needed"),"OR",R("ondansetron","po/iv","S E","4–8mg","2 times a day","as needed")]},
 {t:"h",x:"Alternative therapies for nausea and vomiting in pregnancy"},
 {t:"p",x:"Corticosteroid should be reserved for cases where standard therapies have failed:"},
 {t:"ul",x:["i.v. hydrocortisone 100mg 2 times a day for 48 hours, OR", "oral prednisolone 30-40mg/day for 1 week then tapered gradually with 5mg reduction weekly"]}]},
{id:"ob-anaemia",name:"Anaemia and prophylaxis in antenatal care",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Anaemia during pregnancy"},
 {t:"g",ad:1,title:"For reducing the risk of anaemia during pregnancy give:",rows:[R("ferrous sulphate","po","C E","200mg","once a day","throughout pregnancy"),"AND",R("folic acid","po","C E","5mg","once a week","throughout pregnancy"),"OR",R("combined ferrous sulphate/fumarate and folic acid","po","C E","","once a day","throughout pregnancy")]},
 {t:"p",x:"Start at booking for antenatal care. Continue prophylaxis for 6 weeks after delivery. Also give dietary advice."},
 {t:"p",x:"CAUTION: Iron preparations should be taken after food to avoid gastrointestinal irritation. If vomiting occurs, reduce dosage to that which can be tolerated."},
 {t:"h",x:"Severe anaemia (Hb <8 g) in pregnancy requires full investigation"},
 {t:"ul",x:["stool for ova and parasites", "peripheral blood film for malarial parasites", "full blood count", "mid-stream specimen of urine for microscopy, culture and sensitivity", "HIV test"]},
 {t:"p",x:"Severe anaemia after 36 weeks of gestation requires admission and possible transfusion, as well as oral iron therapy. (See the chapter on Haematology and blood products). Parenteral iron preparations can be used if Hb is <7g/dl."},
 {t:"h",x:"Indications for parenteral iron"},
 {t:"ul",x:["oral iron not tolerated or absorbed", "compliance to oral iron in doubt", "if woman is approaching term and there is insufficient time for oral supplementation to be effective"]},
 {t:"h",x:"Prophylaxis in antenatal care: neural tube defects"},
 {t:"g",ad:1,title:"For reducing the risk of neural tube defects give:",rows:[R("folic acid","po","C E","5mg","once a day","preconceptionally and up to 3 months of pregnancy")]}]},
{id:"ob-cardiac",name:"Cardiac disease in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Types of cardiac disease"},
 {t:"ul",x:["rheumatic heart disease accounts for over 95% of conditions", "hypertension", "puerperal cardiomyopathy", "congenital heart disease", "post-operative cardiac patients"]},
 {t:"h",x:"Antenatal management"},
 {t:"p",x:"The woman should be managed and reviewed more frequently by both a specialist obstetrician and physician. In the antenatal period avoid fluid overload, anaemia and infection. Any infection should be treated aggressively with the appropriate antibiotics."},
 {t:"p",x:"Treatment: see treatment of heart failure under the cardiovascular disease chapter."},
 {t:"p",x:"Anticoagulants: long term anticoagulation (e.g. for valve replacement) – using warfarin should be avoided in the first trimester. Alternatively, use heparin or enoxaparin for the first 12 weeks, and change back to warfarin between weeks 13 – 37. After 37 weeks change back to heparin until after delivery. Warfarin can be commenced 24hrs after delivery."},
 {t:"h",x:"Labour in cardiac patients (refer to the Cardiovascular chapter)"},
 {t:"p",x:"Cardiac disease patients should not be induced. They usually have easy vaginal deliveries, which can be assisted by forceps delivery or vacuum extraction to avoid stress."},
 {t:"g",ad:1,title:"Anticipate assisted delivery and give prophylaxis at the onset of labour:",rows:[R("ampicillin","iv","B V","1g","once only","single dose")]},
 {t:"ul",x:["Keep the resuscitation trolley at hand.", "Nurse in a propped-up position.", "Actively manage the third stage of labour; do not give ergometrine."]},
 {t:"g",ad:1,title:"Active management of the third stage of labour in cardiac patients (do not give ergometrine):",rows:[R("oxytocin","","C V","10 units","once at delivery of the anterior shoulder","")]},
 {t:"h",x:"Post-natal care"},
 {t:"ul",x:["keep the woman in high care for 24 hours", "organise regular reviews at the clinic to avoid sudden decompensation"]},
 {t:"h",x:"Contraception"},
 {t:"p",x:"At 6 weeks after delivery, use the progesterone only oral contraceptive or injectable medroxyprogesterone acetate or progesterone implants."}]},
{id:"ob-htn",name:"Hypertension in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Elevated blood pressures in pregnancy could be due to:"},
 {t:"ul",x:["Women who develop hypertension during pregnancy (after 20 weeks). This is termed pregnancy-induced hypertension (PIH). It is a potentially serious condition possibly requiring early or urgent delivery (see below).", "Pregnant women who have essential hypertension. These women may also develop superimposed PIH and merit the same treatment."]},
 {t:"p",x:"The following considerations are true for hypertension in pregnancy:"},
 {t:"ul",x:["Methyldopa is the recommended antihypertensive throughout pregnancy.", "Prevention of hypertensive disorders through screening for and use of calcium carbonate daily until delivery is recommended."]},
 {t:"p",x:"CAUTION: Avoid diuretic medicines during pregnancy."},
 {t:"h",x:"Essential hypertension"},
 {t:"g",ad:1,title:"First Line treatment for essential hypertension during pregnancy:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review")]},
 {t:"p",x:"Monitor for development of proteinuria by checking urinalysis at antenatal visits."},
 {t:"g",ad:1,title:"Second Line treatment for essential hypertension during pregnancy (combination therapy recommended for poor response):",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review")]},
 {t:"h",x:"Pregnancy induced hypertension"},
 {t:"p",x:"Monitor closely and check urine for protein (exclude urinary tract infection). Manage as high-risk antenatal patient."},
 {t:"p",x:"Any pregnant woman (especially primigravida) with a rise of diastolic pressure >15 mm may have severe pregnancy induced hypertension, even with a BP <140/90."},
 {t:"h",x:"Mild pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic 90-100 mm Hg; no proteinuria."},
 {t:"ul",x:["Bed rest at home.", "Weekly antenatal visits.", "Admit if there is a history of foetal loss or eclampsia."]},
 {t:"h",x:"Moderate pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic 100-110 mm Hg; no proteinuria."},
 {t:"ul",x:["Admit and monitor blood pressure 4 hourly.", "Give antihypertensives.", "At gestation >37 weeks, plan delivery."]},
 {t:"g",ad:1,title:"Antihypertensive therapy for moderate PIH:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review")]},
 {t:"h",x:"Severe pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic >110mm Hg; no proteinuria."},
 {t:"ul",x:["Admit and monitor blood pressure 4 hourly.", "Give antihypertensives.", "Monitor for organ damage (FBC, U&E, LFT).", "At gestation >37 weeks, plan delivery."]},
 {t:"p",x:"Manage as for moderate pregnancy induced hypertension. If not controlled add hydralazine as follows:"},
 {t:"g",ad:1,title:"Stepwise approach to Antihypertensive therapy for severe PIH:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review"),"PLUS (if poorly controlled)",R("hydralazine","im","B V","10mg","every 4 hours","review")]}]},
{id:"ob-eclampsia",name:"Pre-eclampsia and eclampsia",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Pre-eclampsia without severe features"},
 {t:"p",x:"Definition: Any level of PIH plus proteinuria without organ dysfunction/deranged kidney, liver and haematology, placental insufficiency."},
 {t:"ul",x:["Manage as an inpatient.", "Plan to deliver at 37 weeks or before.", "Monitor blood pressure 4 hourly.", "Daily check urine for protein (exclude urinary tract infection).", "Watch for signs of imminent eclampsia (i.e. mental status changes, visual disturbance or epigastric pain and/or signs of brisk reflexes).", "If diastolic >110 mmHg check blood pressure hourly and continue giving medicines as for severe PIH (see Hypertension in pregnancy)."]},
 {t:"h",x:"Imminent eclampsia [severe pre-eclampsia]"},
 {t:"p",x:"Definition: Any level of PIH plus proteinuria with organ dysfunction/severe features such as deranged kidney, liver and haematology, placental insufficiency."},
 {t:"ul",x:["Manage as an inpatient.", "Plan for urgent delivery.", "Monitor blood pressure hourly or continuously.", "If diastolic pressure >110 mmHg give antihypertensives as for severe PIH.", "Prevent convulsions with magnesium sulphate."]},
 {t:"g",ad:1,title:"Prevent convulsions with:",rows:[R("magnesium sulphate","","C V","4g in 20ml normal saline over 20 min then 5g in each buttock (loading dose) then","",""),R("magnesium sulphate","","C V","5g in alternate buttocks every 4 hours until 24 hours after delivery","","")]},
 {t:"p",x:"Monitor carefully: patellar reflex; respiration (respiratory rate must not be less than 16/min); urine output > 100mls in 4 hours."},
 {t:"h",x:"Eclampsia"},
 {t:"p",x:"Definition: Any level of PIH plus epileptiform fits."},
 {t:"ul",x:["Manage as an inpatient.", "Ensure clear airway.", "Stop convulsions with magnesium sulphate.", "Plan for urgent delivery (within 6 hours)."]},
 {t:"g",ad:1,title:"Stop convulsions with:",rows:[R("magnesium sulphate","","C V","4g in 20ml normal saline over 20 min then 5g in each buttock (loading dose) then","",""),R("magnesium sulphate","","C V","5g in alternate buttocks every 4 hours until 24 hours after delivery, or until 24 hours after the last fit, whichever is later","","")]},
 {t:"p",x:"Monitor carefully: patellar reflex; respiration (respiratory rate must not be less than 16/min); urine output > 100mls in 4 hours."},
 {t:"ul",x:["Monitor blood pressures hourly or continuously.", "If diastolic pressure >110 mmHg give hydralazine."]},
 {t:"g",ad:1,title:"Antihypertensive therapy in eclampsia (if diastolic pressure >110mmHg):",rows:[R("hydralazine","im","B V","10mg","once","")]},
 {t:"p",x:"All nurses, midwives and doctors attending to pregnant women should familiarise themselves with the magnesium sulphate regime."},
 {t:"p",x:"Once competence is achieved in its administration, the regime should be used at all levels."},
 {t:"p",x:"At the primary level, the intravenous component of the loading dose may be omitted, but the intramuscular component (10 grams) should always be given."}]},
{id:"ob-diabetes",name:"Diabetes in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Diabetic women who fall pregnant require management before and throughout pregnancy. Some women may develop diabetes while pregnant (gestational diabetes), usually in the second trimester. Ideally, all pregnant diabetics should be managed by specialists. For general information refer to the relevant section in the chapter on diabetes."},
 {t:"ul",x:["Strict blood sugar control pre-conceptually is advised.", "Good blood sugar control with insulin, diet and exercise is essential. All known diabetics should have their glucose control assessed before conceiving if possible.", "Metformin may be considered as first line medical therapy prior to or in conjunction with insulin.", "Throughout pregnancy blood sugar control should be kept strictly within the range 4-6 mmol/L. Control should be measured by regular blood sugar profile (admit and take 4 hourly blood glucose levels for 24 hours). Insulin requirements will increase as pregnancy progresses, so profiles will be necessary at frequent intervals of approximately 2 weeks.", "Labour should be in a tertiary level hospital. Well-controlled diabetics may be allowed to go into labour spontaneously up to term provided the foetus is clinically well. If labour is induced, give half the usual insulin dose in the morning and start an intravenous infusion of dextrose 5% at 1 litre per hour. Labour should not be prolonged. After labour, manage the patient on a sliding scale of insulin."]}]},
{id:"ob-labour-care",name:"Antacids, analgesia and steroids in labour",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Antacids"},
 {t:"g",ad:1,title:"For indigestion give:",rows:[R("magnesium trisilicate","po","C N","10-20ml","as required","")]},
 {t:"p",x:"CAUTION: Particulate antacids (e.g. magnesium trisilicate) may be harmful to the lungs if aspirated; sodium citrate is favoured if available."},
 {t:"g",ad:1,title:"Prior to general anaesthesia for caesarean sections give:",rows:[R("sodium citrate","po","B N","15ml","once only","")]},
 {t:"h",x:"Analgesia"},
 {t:"p",x:"Pain during pregnancy can be a serious problem. Most pain is musculoskeletal (especially back pain), though other types can occur including headaches, procedural pain, nephrolithiasis, and acute abdomen. Treatment is multi-modal: heat and ice, paracetamol, massage, proper posturing, good support shoes, a good exercise program."},
 {t:"p",x:"Note:"},
 {t:"ul",x:["Non-steroidal anti-inflammatory drugs can be used between weeks 12-30 of pregnancy, but they are generally avoided during pregnancy (risk of premature closure of ductus arteriosus and oligohydramnios).", "If prescribed, best to use them for short duration (max 48 hours) and with the lowest effective dose.", "NSAIDs (esp. indomethacin) can be used up to 32 weeks gestation for tocolysis in preterm labour to allow administration of antenatal corticosteroids.", "Opioids should be avoided during pregnancy (risk of maternal dependence and neonatal withdrawal syndrome); however, with appropriate risk-benefit analysis, opioids can be given in labour."]},
 {t:"g",ad:1,title:"For severe pain in labour give:",rows:[R("pethidine","im","B V","50–100mg","4–6 hourly","max. 3 doses"),"OR",R("morphine","im","B V","5mg","4 hourly","as required"),"AND",R("promethazine","im","B V","25mg","once a day","max. 3 doses")]},
 {t:"p",x:"Note: To avoid respiratory depression in the neonate the last dose should be given if delivery is not anticipated within the next 2 hours, and no more than two doses should be given during labour."},
 {t:"p",x:"If the neonate is breathing poorly after pethidine was given to the mother, give respiratory support plus naloxone. See the section in Neonatal Conditions."},
 {t:"g",ad:1,title:"For the incision and subsequent suturing of episiotomies:",rows:[R("lignocaine","1% local infiltration","C V","Up to max of 10ml","once","")]},
 {t:"p",x:"CAUTION: Avoid injecting into a vein! Draw back several times during infiltration."},
 {t:"h",x:"Use of steroids in pre-term labour"},
 {t:"p",x:"Steroids are used to prevent respiratory distress syndrome of the newborn in premature labour before 35 weeks gestation. Most useful between 28-35 weeks gestation."},
 {t:"g",ad:1,title:"In preterm labour between 28-35 weeks gestation give the mother:",rows:[R("dexamethasone","im","C V","12mg each dose\n(total 2 doses)","12 hours apart","")]},
 {t:"h",x:"Anaesthesia"},
 {t:"p",x:"For caesarean section, spinal anaesthesia is now the standard method to be used. All doctors and nurse anaesthetists should become competent in this method."}]},
{id:"ob-labour",name:"Cervical ripening, induction and augmentation of labour, third stage",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Cervical ripeners / labour initiators (prostaglandins)"},
 {t:"g",ad:1,title:"The safest and simplest method of ripening the cervix:",rows:[R("misoprostol","pv","C V","50mcg","once","max 1 dose"),"OR",R("misoprostol","po*","C V","25mcg","2 hourly","max 8 doses")]},
 {t:"p",x:"CAUTION: Use prostaglandins (PG) with caution in multiparous women. Excessive uterine contractions can lead to uterine rupture, particularly if the cervix is not ripe."},
 {t:"p",x:"*Dosing can be repeated"},
 {t:"p",x:"CAUTION: Not to be used in women with previous uterine incisions."},
 {t:"h",x:"Traction method"},
 {t:"p",x:"Where no medicines are available, a size 14 Foley’s catheter can be inserted through the cervix under clean conditions, and then inflated with 40ml water. By strapping to the leg under tension, gentle traction is applied."},
 {t:"h",x:"Myometrial stimulants (oxytocics)"},
 {t:"p",x:"Oxytocics are used for: induction of labour; augmentation of labour; uterine stimulation after delivery."},
 {t:"p",x:"Use them with great caution in highly parous women before delivery and avoid use in obstructed labour. Oxytocin (for induction of labour) does not work well without rupture of the membranes. This may result in unnecessary caesarean section and/or vertical transmission of HIV."},
 {t:"h",x:"Induction of labour"},
 {t:"ul",x:["Surgical method: artificial rupture of membranes.", "Medical method(s): if labour fails to progress, give the following:"]},
 {t:"g",ad:1,title:"Medical induction of labour:",rows:[R("oxytocin","infusion","C V","1 unit initially then","",""),R("oxytocin","infusion","C V","4 units in 1L normal saline","at 15, 30, 60 drops per minute until regular contractions","")]},
 {t:"p",x:"Note: If 4 units is insufficient, and it is the woman’s first pregnancy, then: increase the dose stepwise with regular monitoring – 16, 32 then 64 units in the litre of sodium chloride 0.9% - each time increasing the delivery rate through 15, 30 and 60 drops per minute."},
 {t:"h",x:"Alternative induction regimen"},
 {t:"g",ad:1,title:"Medical induction of labour:",rows:["OR",R("misoprostol","po","C V","25mcg","2 hourly","max 8 doses"),"OR",R("misoprostol","pv","C V","50mcg","once daily","max 2 doses")]},
 {t:"p",x:"Note: For oral administration, dissolve Misoprostol 200 mcg in 200 ml of normal saline or water for injection. This gives a concentration of 1 mcg per ml. repeat cycle next day if cervix not favourable or do amniotomy and oxytocin infusion if Bishop score >6"},
 {t:"h",x:"Augmentation of labour"},
 {t:"p",x:"If membranes have already ruptured but labour is not progressing follow the same steps and precautions as above. Obstructed labour should be considered as a cause if labour fails to progress."},
 {t:"h",x:"Active management of the third stage of labour"},
 {t:"g",ad:1,title:"Active management of the third stage of labour:",rows:[R("oxytocin","","C V","10 units","once with the appearance of the anterior shoulder","")]},
 {t:"g",ad:1,title:"For persistently relaxed uterus or post-partum haemorrhage despite standard oxytocin dosing and manual stimulation, give:",rows:[R("oxytocin","infusion","C V","20 units in 1L normal saline at 10-60 drops per minute","",""),"OR",R("misoprostol","pr","C V","600mcg","once","")]}]},
{id:"ob-termination",name:"Termination of pregnancy, miscarriage and intrauterine fetal death",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Termination of pregnancy: legal conditions for abortion"},
 {t:"ul",x:["where the pregnancy results from rape, whether or not the rapist is caught;", "where continuing with pregnancy poses substantial threat to the woman’s physical health or life (e.g. she suffers from very high blood pressure, diabetes or another serious medical or surgical condition);", "where there is a significant risk, or it is known that the foetus has a serious medical condition or malformation (e.g. rubella in first trimester, or Down’s Syndrome)."]},
 {t:"h",x:"Recommended methods"},
 {t:"ul",x:["medical methods as recommended below using mifepristone/misoprostol as the first preferred option", "manual vacuum aspiration in the first trimester with or without prior use of misoprostol", "suction curettage in the first trimester with or without prior use of misoprostol; dilatation and curettage in the first trimester and early second trimester with or without prior use of misoprostol", "cover with antibiotics where appropriate (an infection is suspected)"]},
 {t:"h",x:"First trimester termination methods (up to 12 weeks)"},
 {t:"g",ad:1,title:"Pregnancy termination (≤ 12 weeks) method 1:",rows:[R("misoprostol","pv","C V","600mcg","12 hourly","max 2 doses")]},
 {t:"g",ad:1,title:"Pregnancy termination (≤ 12 weeks) method 2:",rows:[R("mifepristone","po","B V","200mg","once",""),"THEN (24-48 hours later)",R("misoprostol","buccal/pv/sub-lingual","C V","800mcg","once","")]},
 {t:"p",x:"Combination regimen (Method 2) is recommended because it is more effective."},
 {t:"h",x:"Second trimester termination methods (13 to 27 weeks)"},
 {t:"g",ad:1,title:"Pregnancy termination (13 - 27 weeks) method 1:",rows:[R("misoprostol","pv","C V","200mcg","12 hourly","max 4 doses")]},
 {t:"g",ad:1,title:"Pregnancy termination (13 - 27 weeks) method 2:",rows:[R("mifepristone","po","B V","200mg","once",""),"THEN (24-48 hours later)",R("misoprostol","buccal/pv/sub-lingual","C V","400mcg","3 hourly","")]},
 {t:"p",x:"Combination regimen (Method 2) is recommended because it is more effective."},
 {t:"p",x:"Repeat doses of misoprostol can be considered when needed to achieve success of the abortion process."},
 {t:"p",x:"Health-care providers should use caution and clinical judgement to decide the maximum number of doses of misoprostol when managing pregnant individuals with prior uterine incision."},
 {t:"p",x:"Uterine rupture, though a rare complication, must be considered with advanced gestational age and therefore clinical judgement and health system preparedness for emergency management should be made available."},
 {t:"h",x:"Management of miscarriage (1st trimester pregnancy loss)"},
 {t:"g",ad:1,title:"For cervical ripening preinstrumentation give:",rows:[R("misoprostol","pv","C V","400mcg","4 hours before procedure","once only")]},
 {t:"g",ad:1,title:"For missed miscarriage give:",rows:[R("misoprostol","pv","C V","600mcg","12 hourly","max 2 doses")]},
 {t:"g",ad:1,title:"For incomplete miscarriage give:",rows:[R("misoprostol","pv","C V","600mcg","once","")]},
 {t:"h",x:"Management of intrauterine fetal death: 2nd trimester pregnancy loss (13-27 weeks)"},
 {t:"g",ad:1,title:"For intrauterine foetal death at 13-17 weeks give:",rows:[R("misoprostol","pv","C V","200mcg","12 hourly","max 4 doses")]},
 {t:"g",ad:1,title:"For intrauterine foetal death at 18-27 weeks give:",rows:[R("misoprostol","pv","C V","100mcg","12 hourly","max 3 doses")]},
 {t:"h",x:"3rd trimester pregnancy loss (28-40 weeks)"},
 {t:"g",ad:1,title:"For intrauterine foetal death at ≥28 weeks give:",rows:[R("misoprostol","po","C V","25mcg","2 hourly","max 8 doses"),"OR",R("misoprostol","pv","C V","50mcg","24 hourly","max 2 doses")]},
 {t:"h",x:"Antibiotic regimen for miscarriage/IUFD"},
 {t:"g",ad:1,title:"For preventing uterine infection after any miscarriage/IUFD give:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","5 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","5 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","5 days")]}]},
{id:"ob-misoprostol",name:"Misoprostol dosing chart in obstetric care",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Doses as printed in the EDLIZ misoprostol chart."},
 {t:"m",title:"Misoprostol dosing chart",li:1,cols:["Gestation", "Indication", "Dose"],rows:[[["**≤12 weeks' gestation"], ["Pregnancy termination"], ["600 mcg pv 12 hourly, max 2 doses"]], [["**≤12 weeks' gestation"], ["Missed miscarriage"], ["600 mcg pv 12 hourly, max 2 doses"]], [["**≤12 weeks' gestation"], ["Incomplete miscarriage"], ["600 mcg po single dose"]], [["**≤12 weeks' gestation"], ["Cervical ripening pre-instrumentation"], ["400 mcg pv 4 hours before procedure"]], [["**13–27 weeks' gestation"], ["Pregnancy termination"], ["200 mcg pv 12 hourly, max 4 doses"]], [["**13–27 weeks' gestation"], ["Foetal death"], ["13–17 weeks: 200 mcg pv 12 hourly, max 4 doses", "18–27 weeks: 100 mcg pv 12 hourly, max 3 doses"]], [["**13–27 weeks' gestation"], ["Incomplete miscarriage"], ["600 mcg po single dose"]], [["**13–27 weeks' gestation"], ["Cervical ripening pre-instrumentation"], ["200 mcg pv 12 hourly, max 4 doses"]], [["**≥28 weeks' gestation"], ["Pregnancy termination"], ["25 mcg po 2 hourly, max 8 doses", "or", "50 mcg pv 24 hourly, max 2 doses"]], [["**≥28 weeks' gestation"], ["Foetal death"], ["25 mcg po 2 hourly, max 8 doses", "or", "50 mcg pv 24 hourly, max 2 doses"]], [["**≥28 weeks' gestation"], ["Pre-labour rupture of membranes"], ["25 mcg po 4 hourly, max 4 doses", "or", "50 mcg pv, max 1 dose"]], [["**≥28 weeks' gestation"], ["Induction of labour"], ["25 mcg po 2 hourly, max 8 doses", "or", "50 mcg pv 6 hourly, max 2 doses"]], [["**≥28 weeks' gestation"], ["Cervical ripening/Labour initiation"], ["50 mcg pv single dose", "or", "25 mcg pv 2 hourly, max 8 doses"]], [["**Postpartum use"], ["Postpartum haemorrhage (PPH) prophylaxis"], ["600 mcg pr single dose"]], [["**Postpartum use"], ["PPH treatment"], ["600 mcg pr single dose"]]]}]},

, ["All"], ["Caution"], ["–"]], [["**Lithium"], ["All"], ["Avoid"], ["Needs careful control of levels."]], [["**Metronidazole"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Avoid high doses."]], [["**NSAIDs – other"], ["All"], ["Avoid"], ["Paracetamol is preferred for analgesia in standard doses."]], [["**Opiates"], ["3"], ["Caution"], ["Neonatal respiratory depression, gastric stasis in mother with risk of aspiration in labour."]], [["**Oral hypoglycaemics"], ["All"], ["Avoid"], ["Change to insulin."]], [["**Podophyllin"], ["All"], ["Avoid"], ["–"]], [["**Phenobarbitone / Phenytoin"], ["1 & 3"], ["Caution"], ["Congenital malformations. Prophylactic use of vitamin K and folate is recommended."]], [["**Praziquantel"], ["1"], ["Avoid"], ["Wait."]], [["**Prednisolone"], ["All"], ["Caution"], ["If essential, cover neonate for adrenal suppression."]], [["**Pyrimethamine/Sulphadoxine"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Give with folic acid."]], [["**Quinine"], ["All"], ["Caution"], ["High doses teratogenic. Benefit outweighs risk."]], [["**Reserpine"], ["All"], ["Avoid"], ["–"]], [["**Sulphonamides"], ["3"], ["Avoid"], ["Risk of teratogenicity, methaemoglobinaemia, kernicterus."]], [["**Streptomycin"], ["All"], ["Avoid"], ["May cause auditory or vestibular nerve damage, risk greatest with streptomycin and kanamycin."]], [["**Thiazides"], ["All"], ["Caution"], ["May cause neonatal thrombocytopenia. Avoid for treatment of hypertension."]], [["**Vaccines – live"], ["All"], ["Avoid"], ["–"]], [["**Vitamin A"], ["1"], ["Avoid"], ["High dose may be teratogenic in early pregnancy."]], [["**Warfarin"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Subcutaneous heparin may be substituted in the first trimester and the last few weeks of pregnancy in those with prosthetic heart valves, deep vein thrombosis and pulmonary embolism."]]]},

{id:"stridor",name:"Stridor and croup",sec:"Acute respiratory infections",blocks:[

 {t:"h",x:"Management of croup at the primary level"},
 {t:"p",x:"If no stridor at rest, do not give antibiotics. If there is stridor at rest or chest indrawing or fast breathing refer urgently to hospital for possible intubation or tracheostomy and a course of cloxacillin and chloramphenicol."},
 {t:"h",x:"Mild croup"},{t:"p",x:"Stridor present only when upset. Likely to be of viral origin. An antibiotic is not required. Home care."},
 {t:"h",x:"Severe croup (laryngotracheobronchitis)"},{t:"p",x:"This is stridor in a calm child at rest with chest indrawing."},
 {t:"ul",x:["Refer to higher centre of care.","Do not examine the throat in case it’s epiglottitis!","If referral not possible or there is a delay give chloramphenicol (or ceftriaxone) and cloxacillin:"]},
 {t:"g",title:"Treatment for severe croup:",rows:[R("chloramphenicol","iv","B V","12.5mg/kg","6 hourly","7 days",{k:"mgkg",lo:12.5,u:"mg"}),"OR",R("ceftriaxone","iv","C V","50mg/kg","once a day","7 days",{k:"mgkg",lo:50,u:"mg"}),"AND",CLOX("iv","12.5–25mg/kg","6 hourly","7 days",12.5,25)],note:"Chloramphenicol is preferred; ceftriaxone is the alternative where chloramphenicol is not available.",d:"croup-alt"},
 {t:"ul",x:["Suspect epiglottitis if child very ill, toxic and drooling saliva.","Continue antibiotics.","Watch carefully for signs of obstruction. Intubation or a tracheostomy may be required (poor air entry; severe chest indrawing, restlessness, pallor).","Minimal handling (keep on mother’s lap).","NB. Remember cyanosis is a very late sign."]}]},

{id:'diarrhoea',name:'Diarrhoea: assessment and persistent diarrhoea',sec:'Diarrhoea in children',blocks:[
 {t:'p',x:'About 90% of deaths from diarrhoea in under-fives would be prevented by:'},
 {t:'ul',x:['giving extra home fluids or salt sugar solution (SSS) or ORS at home at onset of diarrhoea to prevent dehydration;','exclusive breastfeeding for first 6 months of life and continuing breast feeding with solids throughout the attack of diarrhoea to prevent malnutrition;','making sure mothers know when to take the child to a health facility;','correct assessment, treatment and continued feeding at the health facility level (see MoHCC Chart and IMNCI Manual);','treatment of invasive diarrhoea (bloody stool) with antibiotics;','clear instructions on discharge from the health facility for continuing above treatments and when it may be necessary to return for further treatment;','referring to hospital for investigation and treatment: severe malnutrition, persistent diarrhoea (lasting ≥ 14 days);','appropriate use of antibiotics, no anti-diarrhoeal or anti-emetic medicines;','zinc sulphate 20mg/day for 10-14 days to all children ≥ 6months and 10mg/day to infants less than 6 months.'],d:'persist-14'},
 {t:'h',x:'If the child has diarrhoea, ask:'},{t:'ul',x:['For how long?','Is there blood in the stool?']},
 {t:'h',x:'Look:'},{t:'ul',x:['Is the child lethargic or unconscious?','Does the child have sunken eyes?','Is the child able to drink or drinking poorly?','Is the child drinking eagerly or thirsty?']},
 {t:'h',x:'Pinch the skin of the abdomen:'},{t:'p',x:'Does it go back very slowly (longer than 2 seconds)? Classify the dehydration using the table below.'},
 {t:'m',title:'Classification of dehydration',cols:['Signs','Dehydration','Management'],rows:[
 [['Two or more of the following signs:','• Lethargic or unconscious','• Sunken eyes','• Not able to drink or drinking poorly','• Skin pinch goes back very slowly'],['Severe dehydration'],['• Initiate treatment for severe dehydration (Plan C).','• Or if another severe classification*, refer urgently to hospital with caregiver giving frequent sips of oral rehydration fluid or by nasogastric tube on the way. Advise mother to continue breastfeeding.','• If the child is 2 years or older and there is cholera in your area, give antibiotic for cholera.']],
 [['Two or more of the following signs:','• Restless or irritable','• Sunken eyes','• Drinks eagerly or thirsty','• Skin pinch goes back slowly'],['Some dehydration'],['Give fluid and food for some dehydration (Plan B).','• If the child also has a severe classification* from another main symptom, refer urgently to hospital with caregiver giving frequent sips of oral rehydration fluid on the way. Advise mother to continue breastfeeding.','• Advise mother when to return urgently.','• Follow-up in 2 days if not improving.']],
 [['Not enough signs to classify as ‘some’ or severe dehydration.'],['No dehydration'],['• Give fluid and food to treat diarrhoea at home (Plan A).','• Advise caregiver when to return immediately.','• Follow-up in 2 days if not improving.']]],note:'* e.g. severe pneumonia, severe febrile disease, severe malnutrition'},
 {t:'p',x:'NB: If temperature is 38.5°C or higher look for other causes of fever and treat.'},
 {t:'h',x:'Persistent diarrhoea'},
 {t:'ul',x:['Severe persistent diarrhoea is diarrhoea lasting 14 days or more and dehydrated. Start rehydration and refer to hospital.','Persistent diarrhoea is diarrhoea lasting 14 days or more but no dehydration. Advise on feeding (below), give vitamin A, and follow up in 5 days.']},
 {t:'h',x:'General notes: persistent diarrhoea'},
 {t:'ul',x:['if breastfeeding, give more frequent, longer breast feeds, day and night','milk feeds should be mixed with maize meal porridge to reduce the concentration of lactose','sour milk is better tolerated than fresh milk','give fermented porridge if available','give foods rich in vitamin A, folic acid and zinc – liver, kidney, dark green vegetables, fish, beans, groundnuts, breast milk, or vitamin supplements.']}]},

 {t:'h',x:'Cholera'},{t:'p',x:'Case definition: rice watery diarrhoea, with or without vomiting, causing severe dehydration or death. In suspected cases immediately notify the Provincial Medical Director and obtain current cholera guidelines. See also the chapter on gastrointestinal conditions.'},
 {t:'ul',x:['Rehydration is most important. The mainstay of cholera management is rehydration, intravenously or orally.','The use of antibiotics is strictly limited to very few indications such as: severe dehydration; high attack rate within a household or congregate settings; as prophylaxis in high-risk areas; if specific guidance is provided as part of the cholera response.','Start antibiotics after the patient is rehydrated and vomiting has stopped – usually after 4-6hrs.','Always confirm recommended medicines for the outbreak.']},
