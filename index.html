 {t:"p",x:"Pyrexia in a woman who has delivered or miscarried in the previous 6 weeks may be due to puerperal or post-miscarriage sepsis and should be managed actively. Abdominal pain in addition to pyrexia is strongly suggestive. The uterus may need evacuation. Suction curettage or manual vacuum aspiration are safer than sharp curettage and are the recommended first line procedures."},
 {t:"p",x:"Note: Every year some women die because of what is thought to be post-miscarriage sepsis when in reality it is fever from malaria causing abortion."},
 {t:"p",x:"Post-miscarriage sepsis will need a laparotomy and evacuation of uterus if the patient does not respond to antibiotic therapy."},
 {t:"g",ad:1,title:"Mild/moderate sepsis:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","10 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","10 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","10 days"),"AND",R("doxycycline","po","C V","100mg","2 times a day","10 days")]},
 {t:"h",x:"Acute pelvic inflammatory disease (PID)"},
 {t:"p",x:"Acute PID refers to the acute syndrome attributed to the ascent of microorganisms, not related to pregnancy or surgery, from the vagina and cervix to the endometrium, fallopian tubes and adnexal structures. Gonorrhoea, chlamydia, mycoplasma, anaerobic bacteria and gram-negative organisms can cause acute PID."},
 {t:"g",ad:1,title:"Mild / Moderate Pelvic Inflammatory Disease:",rows:[R("ceftriaxone","im","C V","1g","once only",""),"AND",R("doxycycline","po","C V","100mg","2 times a day","14 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","14 days")]},
 {t:"h",x:"Severe pelvic inflammatory disease"},
 {t:"p",x:"If the temperature is greater than 38°C with marked abdominal tenderness, then the patient needs IV fluids and IV medicines. If no response within 48 hours suspect pelvic abscess and patient may need laparotomy or referral."},
 {t:"g",ad:1,title:"Severe Pelvic Inflammatory Disease:",rows:[R("ceftriaxone","iv","C V","2g","once only","stop 24-48 hours after sustained clinical improvement"),"AND",R("doxycycline","po","C V","100mg","2 times a day","14 days"),"AND",R("metronidazole","pr","B V","1g","2 times a day","14 days")]},
 {t:"p",x:"Note: Duration of ceftriaxone is determined by the patient's response. Switch to oral after review – treatment for 14 days total."},
 {t:"p",x:"Metronidazole oral dose after stopping ceftriaxone is 400mg 8 hourly."},
 {t:"h",x:"Alternative"},
 {t:"g",ad:1,title:"Alternative regimen for severe pelvic inflammatory disease:",rows:[R("ampicillin","iv","B E","500mg","6 hourly","48–72 hrs"),"AND",R("gentamicin","im","C V","160mg","12 hourly","48–72 hrs"),"AND",R("metronidazole","pr","B V","1g","12 hourly","72hrs")]},
 {t:"p",x:"Note: Duration as determined by the patient's response. Switch to oral after review."}]},
{id:"ob-prom",name:"Pre-labour rupture of membranes and antibiotic prophylaxis in delivery",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Pre-labour rupture of membranes (PROM)"},
 {t:"p",x:"This is rupture of amniotic membranes at term before onset of labour."},
 {t:"g",ad:1,title:"Give stimulant to speed up labour:",rows:[X(R("oxytocin","infusion","C V","1 unit in 1L normal saline/Ringer’s lactate over 6 hours initially then","",""),"oxy-1u"),X(R("oxytocin","infusion","C V","4 units in 1L normal saline","15 drops per minute for the first 30 minutes, then 30 drops per minute for the next 30 minutes, then 60 drops per minute, until regular contractions",""),"oxy-1u")]},
 {t:"h",x:"Alternative"},
 {t:"g",ad:1,title:"Alternative to oxytocin:",rows:["OR",R("misoprostol","po","C V","25mcg","4 hourly","max 4 doses"),"OR",R("misoprostol","pv","C V","50mcg","once only","")]},
 {t:"p",x:"Note: For oral administration, dissolve Misoprostol 200 mcg in 200 ml of normal saline or water for injection. This gives a concentration of 1 mcg per ml."},
 {t:"p",x:"Repeat dosing of oral misoprostol can be done 24 hours after commencing the initial dose if the cervix remains unfavourable (Bishop score <6). Proceed with oxytocin infusion if the Bishop score is favourable."},
 {t:"p",x:"Avoid use of buccal and sublingual in viable pregnancies as it is associated with increased occurrence of foetal distress."},
 {t:"g",ad:1,title:"If >24 hours or pyrexia in labour, expedite delivery and give:",rows:[R("benzylpenicillin","iv","C V","2MU","6 hourly","until delivery"),"AND",R("chloramphenicol","iv","B V","500mg","6 hourly","until delivery"),"AND",R("metronidazole","iv","B N","500mg","8 hourly","until delivery")]},
 {t:"g",ad:1,title:"Switch to oral antibiotics for 7 days after delivery:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","7 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","7 days")]},
 {t:"h",x:"Prophylaxis for assisted vaginal delivery"},
 {t:"g",ad:1,title:"Prophylaxis for assisted vaginal delivery:",rows:[R("benzylpenicillin","iv","C V","5MU","once only","single dose"),"OR",R("ceftriaxone","iv","C V","1 gm","once only","single dose"),"OR",R("cefuroxime","iv","B V","750mg","once only","single dose"),"AND",R("metronidazole","iv","B V","500mg","once only","single dose")]},
 {t:"h",x:"Prophylaxis for caesarean section"},
 {t:"g",ad:1,title:"Prophylaxis for Caesarean Section (give 30-60 minutes before surgery):",rows:[R("benzylpenicillin","iv","C V","5MU","once only","single dose"),"OR",R("ceftriaxone","iv","C V","1 gm","once only","single dose"),"OR",R("cefuroxime","iv","B V","750mg","once only","single dose"),"AND",R("metronidazole","iv","B V","500mg","once only","single dose")]},
 {t:"p",x:"If there is evidence of infection during caesarean section, treat for a week with the above regime."}]},
{id:"ob-nvp",name:"Nausea and vomiting in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"During the first trimester, if vomiting is not excessive, advise small frequent bland meals and drinks."},
 {t:"p",x:"Antacids may give symptomatic relief if gastritis is present. If vomiting persists, look for underlying cause e.g. urinary tract infection, molar pregnancy, and multiple pregnancies."},
 {t:"g",ad:1,title:"For nausea and vomiting give:",rows:[R("promethazine","po","B N","25mg","once at night*","as required"),"OR",R("chlorpheniramine","po","C E","4mg","once at night*","5 days"),"OR",R("metoclopramide","","C N","10mg","3 times a day","as required")]},
 {t:"p",x:"*Note: If severe, the dose may be given two to three times a day."},
 {t:"h",x:"Hyperemesis gravidarum (vomiting and dehydration)"},
 {t:"g",ad:1,title:"For hyperemesis Gravidarum (vomiting + dehydration) admit and give fluids plus:",rows:[R("prochlorperazine","im","B E","12.5mg","2 times a day","as needed"),"OR",R("promethazine","im","B V","25mg","2 times a day","as needed"),"OR",R("metoclopramide","","C N","10mg","3 times a day","as needed"),"OR",R("ondansetron","po/iv","S E","4–8mg","2 times a day","as needed")]},
 {t:"h",x:"Alternative therapies for nausea and vomiting in pregnancy"},
 {t:"p",x:"Corticosteroid should be reserved for cases where standard therapies have failed:"},
 {t:"ul",x:["i.v. hydrocortisone 100mg 2 times a day for 48 hours, OR", "oral prednisolone 30-40mg/day for 1 week then tapered gradually with 5mg reduction weekly"]}]},
{id:"ob-anaemia",name:"Anaemia and prophylaxis in antenatal care",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Anaemia during pregnancy"},
 {t:"g",ad:1,title:"For reducing the risk of anaemia during pregnancy give:",rows:[R("ferrous sulphate","po","C E","200mg","once a day","throughout pregnancy"),"AND",R("folic acid","po","C E","5mg","once a week","throughout pregnancy"),"OR",R("combined ferrous sulphate/fumarate and folic acid","po","C E","","once a day","throughout pregnancy")]},
 {t:"p",x:"Start at booking for antenatal care. Continue prophylaxis for 6 weeks after delivery. Also give dietary advice."},
 {t:"p",x:"CAUTION: Iron preparations should be taken after food to avoid gastrointestinal irritation. If vomiting occurs, reduce dosage to that which can be tolerated."},
 {t:"h",x:"Severe anaemia (Hb <8 g) in pregnancy requires full investigation"},
 {t:"ul",x:["stool for ova and parasites", "peripheral blood film for malarial parasites", "full blood count", "mid-stream specimen of urine for microscopy, culture and sensitivity", "HIV test"]},
 {t:"p",x:"Severe anaemia after 36 weeks of gestation requires admission and possible transfusion, as well as oral iron therapy. (See the chapter on Haematology and blood products). Parenteral iron preparations can be used if Hb is <7g/dl."},
 {t:"h",x:"Indications for parenteral iron"},
 {t:"ul",x:["oral iron not tolerated or absorbed", "compliance to oral iron in doubt", "if woman is approaching term and there is insufficient time for oral supplementation to be effective"]},
 {t:"h",x:"Prophylaxis in antenatal care: neural tube defects"},
 {t:"g",ad:1,title:"For reducing the risk of neural tube defects give:",rows:[R("folic acid","po","C E","5mg","once a day","preconceptionally and up to 3 months of pregnancy")]}]},
{id:"ob-cardiac",name:"Cardiac disease in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Types of cardiac disease"},
 {t:"ul",x:["rheumatic heart disease accounts for over 95% of conditions", "hypertension", "puerperal cardiomyopathy", "congenital heart disease", "post-operative cardiac patients"]},
 {t:"h",x:"Antenatal management"},
 {t:"p",x:"The woman should be managed and reviewed more frequently by both a specialist obstetrician and physician. In the antenatal period avoid fluid overload, anaemia and infection. Any infection should be treated aggressively with the appropriate antibiotics."},
 {t:"p",x:"Treatment: see treatment of heart failure under the cardiovascular disease chapter."},
 {t:"p",x:"Anticoagulants: long term anticoagulation (e.g. for valve replacement) – using warfarin should be avoided in the first trimester. Alternatively, use heparin or enoxaparin for the first 12 weeks, and change back to warfarin between weeks 13 – 37. After 37 weeks change back to heparin until after delivery. Warfarin can be commenced 24hrs after delivery."},
 {t:"h",x:"Labour in cardiac patients (refer to the Cardiovascular chapter)"},
 {t:"p",x:"Cardiac disease patients should not be induced. They usually have easy vaginal deliveries, which can be assisted by forceps delivery or vacuum extraction to avoid stress."},
 {t:"g",ad:1,title:"Anticipate assisted delivery and give prophylaxis at the onset of labour:",rows:[R("ampicillin","iv","B V","1g","once only","single dose")]},
 {t:"ul",x:["Keep the resuscitation trolley at hand.", "Nurse in a propped-up position.", "Actively manage the third stage of labour; do not give ergometrine."]},
 {t:"g",ad:1,title:"Active management of the third stage of labour in cardiac patients (do not give ergometrine):",rows:[R("oxytocin","","C V","10 units","once at delivery of the anterior shoulder","")]},
 {t:"h",x:"Post-natal care"},
 {t:"ul",x:["keep the woman in high care for 24 hours", "organise regular reviews at the clinic to avoid sudden decompensation"]},
 {t:"h",x:"Contraception"},
 {t:"p",x:"At 6 weeks after delivery, use the progesterone only oral contraceptive or injectable medroxyprogesterone acetate or progesterone implants."}]},
{id:"ob-htn",name:"Hypertension in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Elevated blood pressures in pregnancy could be due to:"},
 {t:"ul",x:["Women who develop hypertension during pregnancy (after 20 weeks). This is termed pregnancy-induced hypertension (PIH). It is a potentially serious condition possibly requiring early or urgent delivery (see below).", "Pregnant women who have essential hypertension. These women may also develop superimposed PIH and merit the same treatment."]},
 {t:"p",x:"The following considerations are true for hypertension in pregnancy:"},
 {t:"ul",x:["Methyldopa is the recommended antihypertensive throughout pregnancy.", "Prevention of hypertensive disorders through screening for and use of calcium carbonate daily until delivery is recommended."]},
 {t:"p",x:"CAUTION: Avoid diuretic medicines during pregnancy."},
 {t:"h",x:"Essential hypertension"},
 {t:"g",ad:1,title:"First Line treatment for essential hypertension during pregnancy:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review")]},
 {t:"p",x:"Monitor for development of proteinuria by checking urinalysis at antenatal visits."},
 {t:"g",ad:1,title:"Second Line treatment for essential hypertension during pregnancy (combination therapy recommended for poor response):",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review")]},
 {t:"h",x:"Pregnancy induced hypertension"},
 {t:"p",x:"Monitor closely and check urine for protein (exclude urinary tract infection). Manage as high-risk antenatal patient."},
 {t:"p",x:"Any pregnant woman (especially primigravida) with a rise of diastolic pressure >15 mm may have severe pregnancy induced hypertension, even with a BP <140/90."},
 {t:"h",x:"Mild pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic 90 to <100 mm Hg; no proteinuria."},
 {t:"ul",x:["Bed rest at home.", "Weekly antenatal visits.", "Admit if there is a history of foetal loss or eclampsia."]},
 {t:"h",x:"Moderate pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic 100 to <110 mm Hg; no proteinuria."},
 {t:"ul",x:["Admit and monitor blood pressure 4 hourly.", "Give antihypertensives.", "At gestation >37 weeks, plan delivery."]},
 {t:"g",ad:1,title:"Antihypertensive therapy for moderate PIH:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review")]},
 {t:"h",x:"Severe pregnancy induced hypertension"},
 {t:"p",x:"Definition: Diastolic ≥110 mm Hg; no proteinuria."},
 {t:"ul",x:["Admit and monitor blood pressure 4 hourly.", "Give antihypertensives.", "Monitor for organ damage (FBC, U&E, LFT).", "At gestation >37 weeks, plan delivery."]},
 {t:"p",x:"Manage as for moderate pregnancy induced hypertension. If not controlled add hydralazine as follows:"},
 {t:"g",ad:1,title:"Stepwise approach to Antihypertensive therapy for severe PIH:",rows:[R("methyldopa","po","C V","250–500mg","3–4 times a day","review"),"AND",R("nifedipine","po","B V","20mg","2 times a day","review"),"PLUS (if poorly controlled)",R("hydralazine","im","B V","10mg","every 4 hours","review")]}]},
{id:"ob-eclampsia",name:"Pre-eclampsia and eclampsia",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Pre-eclampsia without severe features"},
 {t:"p",x:"Definition: Any level of PIH plus proteinuria without organ dysfunction/deranged kidney, liver and haematology, placental insufficiency."},
 {t:"ul",x:["Manage as an inpatient.", "Plan to deliver at 37 weeks or before.", "Monitor blood pressure 4 hourly.", "Daily check urine for protein (exclude urinary tract infection).", "Watch for signs of imminent eclampsia (i.e. mental status changes, visual disturbance or epigastric pain and/or signs of brisk reflexes).", "If diastolic ≥110 mmHg check blood pressure hourly and continue giving medicines as for severe PIH (see Hypertension in pregnancy)."]},
 {t:"h",x:"Imminent eclampsia [severe pre-eclampsia]"},
 {t:"p",x:"Definition: Any level of PIH plus proteinuria with organ dysfunction/severe features such as deranged kidney, liver and haematology, placental insufficiency."},
 {t:"ul",x:["Manage as an inpatient.", "Plan for urgent delivery.", "Monitor blood pressure hourly or continuously.", "If diastolic pressure ≥110 mmHg give antihypertensives as for severe PIH.", "Prevent convulsions with magnesium sulphate."]},
 {t:"g",ad:1,title:"Prevent convulsions with:",rows:[R("magnesium sulphate","","C V","4g in 20ml normal saline over 20 min then 5g in each buttock (loading dose) then","",""),R("magnesium sulphate","","C V","5g in alternate buttocks every 4 hours until 24 hours after delivery","","")]},
 {t:"p",x:"Monitor carefully: patellar reflex; respiration (respiratory rate must not be less than 16/min); urine output > 100mls in 4 hours."},
 {t:"h",x:"Eclampsia"},
 {t:"p",x:"Definition: Any level of PIH plus epileptiform fits."},
 {t:"ul",x:["Manage as an inpatient.", "Ensure clear airway.", "Stop convulsions with magnesium sulphate.", "Plan for urgent delivery (within 6 hours)."]},
 {t:"g",ad:1,title:"Stop convulsions with:",rows:[R("magnesium sulphate","","C V","4g in 20ml normal saline over 20 min then 5g in each buttock (loading dose) then","",""),R("magnesium sulphate","","C V","5g in alternate buttocks every 4 hours until 24 hours after delivery, or until 24 hours after the last fit, whichever is later","","")]},
 {t:"p",x:"Monitor carefully: patellar reflex; respiration (respiratory rate must not be less than 16/min); urine output > 100mls in 4 hours."},
 {t:"ul",x:["Monitor blood pressures hourly or continuously.", "If diastolic pressure ≥110 mmHg give hydralazine."]},
 {t:"g",ad:1,title:"Antihypertensive therapy in eclampsia (if diastolic pressure ≥110mmHg):",rows:[R("hydralazine","im","B V","10mg","once","")]},
 {t:"p",x:"All nurses, midwives and doctors attending to pregnant women should familiarise themselves with the magnesium sulphate regime."},
 {t:"p",x:"Once competence is achieved in its administration, the regime should be used at all levels."},
 {t:"p",x:"At the primary level, the intravenous component of the loading dose may be omitted, but the intramuscular component (10 grams) should always be given."}]},
{id:"ob-diabetes",name:"Diabetes in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Diabetic women who fall pregnant require management before and throughout pregnancy. Some women may develop diabetes while pregnant (gestational diabetes), usually in the second trimester. Ideally, all pregnant diabetics should be managed by specialists. For general information refer to the relevant section in the chapter on diabetes."},
 {t:"ul",x:["Strict blood sugar control pre-conceptually is advised.", "Good blood sugar control with insulin, diet and exercise is essential. All known diabetics should have their glucose control assessed before conceiving if possible.", "Metformin may be considered as first line medical therapy prior to or in conjunction with insulin.", "Throughout pregnancy blood sugar control should be kept strictly within the range 4-6 mmol/L. Control should be measured by regular blood sugar profile (admit and take 4 hourly blood glucose levels for 24 hours). Insulin requirements will increase as pregnancy progresses, so profiles will be necessary at frequent intervals of approximately 2 weeks.", "Labour should be in a tertiary level hospital. Well-controlled diabetics may be allowed to go into labour spontaneously up to term provided the foetus is clinically well. If labour is induced, give half the usual insulin dose in the morning and start an intravenous infusion of dextrose 5% at 1 litre per hour. Labour should not be prolonged. After labour, manage the patient on a sliding scale of insulin."]}]},
{id:"ob-labour-care",name:"Antacids, analgesia and steroids in labour",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Antacids"},
 {t:"g",ad:1,title:"For indigestion give:",rows:[R("magnesium trisilicate","po","C N","10-20ml","as required","")]},
 {t:"p",x:"CAUTION: Particulate antacids (e.g. magnesium trisilicate) may be harmful to the lungs if aspirated; sodium citrate is favoured if available."},
 {t:"g",ad:1,title:"Prior to general anaesthesia for caesarean sections give:",rows:[R("sodium citrate","po","B N","15ml","once only","")]},
 {t:"h",x:"Analgesia"},
 {t:"p",x:"Pain during pregnancy can be a serious problem. Most pain is musculoskeletal (especially back pain), though other types can occur including headaches, procedural pain, nephrolithiasis, and acute abdomen. Treatment is multi-modal: heat and ice, paracetamol, massage, proper posturing, good support shoes, a good exercise program."},
 {t:"p",x:"Note:"},
 {t:"ul",x:["Non-steroidal anti-inflammatory drugs can be used between weeks 12-30 of pregnancy, but they are generally avoided during pregnancy (risk of premature closure of ductus arteriosus and oligohydramnios).", "If prescribed, best to use them for short duration (max 48 hours) and with the lowest effective dose.", "NSAIDs (esp. indomethacin) can be used up to 32 weeks gestation for tocolysis in preterm labour to allow administration of antenatal corticosteroids.", "Opioids should be avoided during pregnancy (risk of maternal dependence and neonatal withdrawal syndrome); however, with appropriate risk-benefit analysis, opioids can be given in labour."]},
 {t:"g",ad:1,title:"For severe pain in labour give:",rows:[R("pethidine","im","B V","50–100mg","4–6 hourly","max. 3 doses"),"OR",R("morphine","im","B V","5mg","4 hourly","as required"),"AND",R("promethazine","im","B V","25mg","once a day","max. 3 doses")]},
 {t:"p",x:"Note: To avoid respiratory depression in the neonate, the woman may be given a total of 2 doses of pethidine before delivery, ensuring that neither dose is given within 2 hours of an anticipated delivery. If more analgesia is needed, she may be given a 3rd dose after delivery."},
 {t:"p",x:"If the neonate is breathing poorly after pethidine was given to the mother, give respiratory support plus naloxone. See the section in Neonatal Conditions."},
 {t:"g",ad:1,title:"For the incision and subsequent suturing of episiotomies:",rows:[R("lignocaine","1% local infiltration","C V","Up to max of 10ml","once","")]},
 {t:"p",x:"CAUTION: Avoid injecting into a vein! Draw back several times during infiltration."},
 {t:"h",x:"Use of steroids in pre-term labour"},
 {t:"p",x:"Steroids are used to prevent respiratory distress syndrome of the newborn in premature labour before 35 weeks gestation. Most useful between 28-35 weeks gestation."},
 {t:"g",ad:1,title:"In preterm labour between 28-35 weeks gestation give the mother:",rows:[R("dexamethasone","im","C V","12mg each dose\n(total 2 doses)","12 hours apart","")]},
 {t:"h",x:"Anaesthesia"},
 {t:"p",x:"For caesarean section, spinal anaesthesia is now the standard method to be used. All doctors and nurse anaesthetists should become competent in this method."}]},
{id:"ob-labour",name:"Cervical ripening, induction and augmentation of labour, third stage",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Cervical ripeners / labour initiators (prostaglandins)"},
 {t:"g",ad:1,title:"The safest and simplest method of ripening the cervix:",rows:[R("misoprostol","pv","C V","50mcg","once","max 1 dose"),"OR",X(R("misoprostol","pv*","C V","25mcg","2 hourly","max 8 doses"),"miso-align")]},
 {t:"p",x:"CAUTION: Use prostaglandins (PG) with caution in multiparous women. Excessive uterine contractions can lead to uterine rupture, particularly if the cervix is not ripe."},
 {t:"p",x:"*Dosing can be repeated"},
 {t:"p",x:"CAUTION: Not to be used in women with previous uterine incisions."},
 {t:"h",x:"Traction method"},
 {t:"p",x:"Where no medicines are available, a size 14 Foley’s catheter can be inserted through the cervix under clean conditions, and then inflated with 40ml water. By strapping to the leg under tension, gentle traction is applied."},
 {t:"h",x:"Myometrial stimulants (oxytocics)"},
 {t:"p",x:"Oxytocics are used for: induction of labour; augmentation of labour; uterine stimulation after delivery."},
 {t:"p",x:"Use them with great caution in highly parous women before delivery and avoid use in obstructed labour. Oxytocin (for induction of labour) does not work well without rupture of the membranes. This may result in unnecessary caesarean section and/or vertical transmission of HIV."},
 {t:"h",x:"Induction of labour"},
 {t:"ul",x:["Surgical method: artificial rupture of membranes.", "Medical method(s): if labour fails to progress, give the following:"]},
 {t:"g",ad:1,title:"Medical induction of labour:",rows:[X(R("oxytocin","infusion","C V","1 unit in 1L normal saline/Ringer’s lactate over 6 hours initially then","",""),"oxy-1u"),X(R("oxytocin","infusion","C V","4 units in 1L normal saline","15 drops per minute for the first 30 minutes, then 30 drops per minute for the next 30 minutes, then 60 drops per minute, until regular contractions",""),"oxy-1u")]},
 {t:"p",x:"Note: If 4 units is insufficient, and it is the woman’s first pregnancy, then: increase the dose stepwise with regular monitoring – 16, 32 then 64 units in the litre of sodium chloride 0.9% - each time increasing the delivery rate through 15, 30 and 60 drops per minute."},
 {t:"h",x:"Alternative induction regimen"},
 {t:"g",ad:1,title:"Medical induction of labour:",rows:["OR",R("misoprostol","po","C V","25mcg","2 hourly","max 8 doses"),"OR",R("misoprostol","pv","C V","50mcg","once daily","max 2 doses")]},
 {t:"p",x:"Note: For oral administration, dissolve Misoprostol 200 mcg in 200 ml of normal saline or water for injection. This gives a concentration of 1 mcg per ml. repeat cycle next day if cervix not favourable or do amniotomy and oxytocin infusion if Bishop score >6"},
 {t:"h",x:"Augmentation of labour"},
 {t:"p",x:"If membranes have already ruptured but labour is not progressing follow the same steps and precautions as above. Obstructed labour should be considered as a cause if labour fails to progress."},
 {t:"h",x:"Active management of the third stage of labour"},
 {t:"g",ad:1,title:"Active management of the third stage of labour:",rows:[R("oxytocin","","C V","10 units","once with the appearance of the anterior shoulder","")]},
 {t:"g",ad:1,title:"For persistently relaxed uterus or post-partum haemorrhage despite standard oxytocin dosing and manual stimulation, give:",rows:[R("oxytocin","infusion","C V","20 units in 1L normal saline at 10-60 drops per minute","",""),"OR",R("misoprostol","pr","C V","600mcg","once","")]}]},
{id:"ob-termination",name:"Termination of pregnancy, miscarriage and intrauterine fetal death",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Termination of pregnancy: legal conditions for abortion"},
 {t:"ul",x:["where the pregnancy results from rape, whether or not the rapist is caught;", "where continuing with pregnancy poses substantial threat to the woman’s physical health or life (e.g. she suffers from very high blood pressure, diabetes or another serious medical or surgical condition);", "where there is a significant risk, or it is known that the foetus has a serious medical condition or malformation (e.g. rubella in first trimester, or Down’s Syndrome)."]},
 {t:"h",x:"Recommended methods"},
 {t:"ul",x:["medical methods as recommended below using mifepristone/misoprostol as the first preferred option", "manual vacuum aspiration in the first trimester with or without prior use of misoprostol", "suction curettage in the first trimester with or without prior use of misoprostol; dilatation and curettage in the first trimester and early second trimester with or without prior use of misoprostol", "cover with antibiotics where appropriate (an infection is suspected)"]},
 {t:"h",x:"First trimester termination methods (up to 12 weeks)"},
 {t:"g",ad:1,title:"Pregnancy termination (≤ 12 weeks) method 1:",rows:[R("misoprostol","pv","C V","600mcg","12 hourly","max 2 doses")]},
 {t:"g",ad:1,title:"Pregnancy termination (≤ 12 weeks) method 2:",rows:[R("mifepristone","po","B V","200mg","once",""),"THEN (24-48 hours later)",R("misoprostol","buccal/pv/sub-lingual","C V","800mcg","once","")]},
 {t:"p",x:"Combination regimen (Method 2) is recommended because it is more effective."},
 {t:"h",x:"Second trimester termination methods (13 to 27 weeks)"},
 {t:"g",ad:1,title:"Pregnancy termination (13 - 27 weeks) method 1:",rows:[R("misoprostol","pv","C V","200mcg","12 hourly","max 4 doses")]},
 {t:"g",ad:1,title:"Pregnancy termination (13 - 27 weeks) method 2:",rows:[R("mifepristone","po","B V","200mg","once",""),"THEN (24-48 hours later)",R("misoprostol","buccal/pv/sub-lingual","C V","400mcg","3 hourly","")]},
 {t:"p",x:"Combination regimen (Method 2) is recommended because it is more effective."},
 {t:"p",x:"Repeat doses of misoprostol can be considered when needed to achieve success of the abortion process."},
 {t:"p",x:"Health-care providers should use caution and clinical judgement to decide the maximum number of doses of misoprostol when managing pregnant individuals with prior uterine incision."},
 {t:"p",x:"Uterine rupture, though a rare complication, must be considered with advanced gestational age and therefore clinical judgement and health system preparedness for emergency management should be made available."},
 {t:"h",x:"Management of miscarriage (1st trimester pregnancy loss)"},
 {t:"g",ad:1,title:"For cervical ripening preinstrumentation give:",rows:[R("misoprostol","pv","C V","400mcg","4 hours before procedure","once only")]},
 {t:"g",ad:1,title:"For missed miscarriage give:",rows:[R("misoprostol","pv","C V","600mcg","12 hourly","max 2 doses")]},
 {t:"g",ad:1,title:"For incomplete miscarriage give:",rows:[X(R("misoprostol","po","C V","600mcg","once",""),"miso-align")]},
 {t:"h",x:"Management of intrauterine fetal death: 2nd trimester pregnancy loss (13-27 weeks)"},
 {t:"g",ad:1,title:"For intrauterine foetal death at 13-17 weeks give:",rows:[R("misoprostol","pv","C V","200mcg","12 hourly","max 4 doses")]},
 {t:"g",ad:1,title:"For intrauterine foetal death at 18-27 weeks give:",rows:[R("misoprostol","pv","C V","100mcg","12 hourly","max 3 doses")]},
 {t:"h",x:"3rd trimester pregnancy loss (28-40 weeks)"},
 {t:"g",ad:1,title:"For intrauterine foetal death at ≥28 weeks give:",rows:[R("misoprostol","po","C V","25mcg","2 hourly","max 8 doses"),"OR",R("misoprostol","pv","C V","50mcg","24 hourly","max 2 doses")]},
 {t:"h",x:"Antibiotic regimen for miscarriage/IUFD"},
 {t:"g",ad:1,title:"For preventing uterine infection after any miscarriage/IUFD give:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","5 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","5 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","5 days")]}]},
{id:"ob-misoprostol",name:"Misoprostol dosing chart in obstetric care",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[

{id:"ob-medicines-pregnancy",name:"Medicines in pregnancy and lactation",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Note: the tables below include commonly used medicines, but the absence of a medicine from these tables does not necessarily imply no risk. Always check if unsure."},
 {t:"h",x:"General principles"},
 {t:"ul",x:["medicines should be prescribed during pregnancy and lactation only if the expected benefit to the mother outweighs the risk to the foetus or neonate", "all medicines should be avoided if possible during the first trimester", "well known medicines, which have been extensively used during pregnancy or lactation, should be used in preference to new medicines"]},
 {t:"m",title:"Medicines to be avoided or used with caution during pregnancy",li:0,cols:["Medicine", "Trimester", "Note", "Rationale / advice"],rows:[[["**Albendazole"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Potentially teratogenic. Wait until after delivery."]], [["**Alcohol"], ["All"], ["Avoid"], ["Small quantities probably not harmful"]], [["**Amitriptyline"], ["3"], ["Caution"], ["Convulsions in neonate."]], [["**Androgens"], ["All"], ["Avoid"], ["Virilisation of female foetus."]], [["**Antiemetics"], ["All"], ["Caution"], ["Use promethazine or chlorpheniramine ONLY if vomiting is severe."]], [["**Antiepileptics"], ["All"], ["Caution"], ["Benefits outweigh risks – monitor blood levels and adjust dose accordingly. Use single medicine if possible. See individually listed medicines."]], [["**Aspirin"], ["3", "1 & 2"], ["Avoid", "Caution"], ["Low dose aspirin in PIH is safe in 2 and 3."]], [["**Atenolol / Propranolol"], ["3", "1 & 2"], ["Caution", "Avoid"], ["Neonatal hypoglycaemia, bradycardia, intrauterine growth retardation."]], [["**Carbimazole"], ["2 & 3"], ["Caution"], ["Refer to specialist."]], [["**Chloramphenicol"], ["3"], ["Caution"], ["‘Grey baby syndrome’: avoid long courses."]], [["**Ciprofloxacin"], ["1", "2"], ["Avoid", "Caution"], ["–"]], [["**Cotrimoxazole"], ["All"], ["Avoid"], ["Risk of teratogenicity and methaemoglobinaemia. Use in pregnancy is recommended for women with CD4 counts ≤350 cells/mm³, because the potential benefits (UTI therapy, PCP prophylaxis, reduced risk of preterm birth and early onset neonatal sepsis) outweigh the risks to the fetus (congenital malformations, especially neural tube defects, cardiovascular abnormalities, urinary tract defects, oral clefts, and club foot)."]], [["**Diazepam / Nitrazepam"], ["3"], ["Caution"], ["Neonatal respiratory depression, drowsiness, hypotonia. Avoid regular and prolonged use."]], [["**Doxycycline"], ["All"], ["Avoid"], ["Dental discolouration, maternal hepatotoxicity with large doses."]], [["**Ergotamine"], ["All"], ["Avoid"], ["–"]], [["**Gentamicin / Kanamycin / Amikacin (aminoglycosides)"], ["All"], ["Avoid"], ["May cause auditory or vestibular nerve damage, risk greatest with streptomycin and kanamycin, small with gentamicin."]], [["**Heparin"], ["All"], ["Caution"], ["Maternal bone demineralisation/thrombocytopenia."]], [["**Laxatives – stimulant"], ["All"], ["Caution"], ["–"]], [["**Lithium"], ["All"], ["Avoid"], ["Needs careful control of levels."]], [["**Metronidazole"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Avoid high doses."]], [["**NSAIDs – other"], ["All"], ["Avoid"], ["Paracetamol is preferred for analgesia in standard doses."]], [["**Opiates"], ["3"], ["Caution"], ["Neonatal respiratory depression, gastric stasis in mother with risk of aspiration in labour."]], [["**Oral hypoglycaemics"], ["All"], ["Avoid"], ["Change to insulin."]], [["**Podophyllin"], ["All"], ["Avoid"], ["–"]], [["**Phenobarbitone / Phenytoin"], ["1 & 3"], ["Caution"], ["Congenital malformations. Prophylactic use of vitamin K and folate is recommended."]], [["**Praziquantel"], ["1"], ["Avoid"], ["Wait."]], [["**Prednisolone"], ["All"], ["Caution"], ["If essential, cover neonate for adrenal suppression."]], [["**Pyrimethamine/Sulphadoxine"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Give with folic acid."]], [["**Quinine"], ["All"], ["Caution"], ["High doses teratogenic. Benefit outweighs risk."]], [["**Reserpine"], ["All"], ["Avoid"], ["–"]], [["**Sulphonamides"], ["3"], ["Avoid"], ["Risk of teratogenicity, methaemoglobinaemia, kernicterus."]], [["**Streptomycin"], ["All"], ["Avoid"], ["May cause auditory or vestibular nerve damage, risk greatest with streptomycin and kanamycin."]], [["**Thiazides"], ["All"], ["Caution"], ["May cause neonatal thrombocytopenia. Avoid for treatment of hypertension."]], [["**Vaccines – live"], ["All"], ["Avoid"], ["–"]], [["**Vitamin A"], ["1"], ["Avoid"], ["High dose may be teratogenic in early pregnancy."]], [["**Warfarin"], ["1", "2 & 3"], ["Avoid", "Caution"], ["Subcutaneous heparin may be substituted in the first trimester and the last few weeks of pregnancy in those with prosthetic heart valves, deep vein thrombosis and pulmonary embolism."]]]},
 {t:"m",title:"Medicines to be avoided or used with caution during breastfeeding",li:0,cols:["Medicine", "Recommendations"],rows:[[["**Alcohol"], ["Small quantities probably not harmful"]], [["**Aspirin"], ["Avoid – risk of Reye’s syndrome"]], [["**Atropine"], ["Avoid"]], [["**Bromocriptine"], ["Avoid"]], [["**Carbimazole"], ["May cause hypothyroidism in infant"]], [["**Chloramphenicol"], ["May cause bone marrow toxicity in infant"]], [["**Diazepam / Nitrazepam"], ["Avoid repeated doses"]], [["**Doxycycline"], ["Caution, although probably minimal levels in the milk."]], [["**Ergotamine"], ["Toxic to infant, may inhibit lactation"]], [["**Lithium"], ["Monitor mother’s levels carefully"]], [["**Oestrogen"], ["High level may affect milk flow"]], [["**Oral anti-coagulants"], ["Caution, risk of haemorrhage"]], [["**Phenobarbitone"], ["Inhibits infant’s sucking reflex"]], [["**Radioactive iodine"], ["Avoid breastfeeding for 24 hours after diagnostic doses, contraindicated in therapeutic doses."]], [["**Sulphonamides"], ["Caution – significant risk of kernicterus"]], [["**Thiazides"], ["Caution. Doses are usually too small (25-50 mg) to be harmful. Large doses may suppress lactation."]]]}]}
];

{id:"stridor",name:"Stridor and croup",sec:"Acute respiratory infections",blocks:[
 {t:"p",x:"Definition: harsh noise made when a child breathes in."},
 {t:"h",x:"Management of croup at the primary level"},
 {t:"p",x:"If no stridor at rest, do not give antibiotics. If there is stridor at rest or chest indrawing or fast breathing refer urgently to hospital for possible intubation or tracheostomy and a course of cloxacillin and chloramphenicol."},
 {t:"h",x:"Mild croup"},{t:"p",x:"Stridor present only when upset. Likely to be of viral origin. An antibiotic is not required. Home care."},
 {t:"h",x:"Severe croup (laryngotracheobronchitis)"},{t:"p",x:"This is stridor in a calm child at rest with chest indrawing."},
 {t:"ul",x:["Refer to higher centre of care.","Do not examine the throat in case it’s epiglottitis!","If referral not possible or there is a delay give chloramphenicol (or ceftriaxone) and cloxacillin:"]},
 {t:"g",title:"Treatment for severe croup:",rows:[R("chloramphenicol","iv","B V","12.5mg/kg","6 hourly","7 days",{k:"mgkg",lo:12.5,u:"mg"}),"OR",R("ceftriaxone","iv","C V","50mg/kg","once a day","7 days",{k:"mgkg",lo:50,u:"mg"}),"AND",CLOX("iv","12.5–25mg/kg","6 hourly","7 days",12.5,25)],note:"Chloramphenicol is preferred; ceftriaxone is the alternative where chloramphenicol is not available.",d:"croup-alt"},
 {t:"ul",x:["Suspect epiglottitis if child very ill, toxic and drooling saliva.","Continue antibiotics.","Watch carefully for signs of obstruction. Intubation or a tracheostomy may be required (poor air entry; severe chest indrawing, restlessness, pallor).","Minimal handling (keep on mother’s lap).","NB. Remember cyanosis is a very late sign."]}]},
{id:"foreign-body",name:"Foreign body",sec:"Acute respiratory infections",blocks:[
 {t:"p",x:"Common in age 1-2 years: sudden onset (choking); sometimes local wheeze and/or decreased air entry. May cause stridor/cough; there is usually a history that suggests inhalation of foreign body."},
 {t:"ul",x:["Admit for bronchoscopy to remove the foreign body.","X-ray: opacity and/or air trapping.","Use antibiotics if there is fast breathing (secondary infection).","Whenever foreign body is suspected consult cardiothoracic surgeons."]}]},
{id:"abscess",name:"Abscess (retropharyngeal and lung)",sec:"Acute respiratory infections",blocks:[

 {t:"g",title:"Lung abscess",rows:[CLOX("iv/im/po","12.5–25mg/kg","6 hourly","6 weeks",12.5,25),"AND",GEN("im/iv","24 hourly","14 days")]}]},

{id:"pertussis",name:"Pertussis",sec:"Acute respiratory infections",blocks:[
 {t:"g",title:"Pertussis",rows:[R("erythromycin","po","C V","12.5mg/kg/dose","6 hourly","10 days",{k:"mgkg",lo:12.5,u:"mg"})]}]},
{id:"ear",name:"Ear problems",sec:"Ear, nose and throat",blocks:[
 {t:"p",x:"See also chapter on Ear, Nose and Throat Disorders."},
 {t:"h",x:"Precautions for a child with a draining ear"},
 {t:"ul",x:["Advise the mother not to leave anything in the ear, such as cotton wool, between wicking treatments.","Not to put oil or any fluid into the ear.","Not to let the child go swimming or get water in the ear."]},
 {t:"h",x:"Mastoiditis"},{t:"p",x:"Tender swelling behind the ear. Give first dose of antibiotics, paracetamol for pain and refer to hospital."},
 {t:"g",title:"Mastoiditis:",rows:[R("benzylpenicillin","im","C V","0.05-0.1MU/kg","6 hourly","10 days",{k:"mgkg",lo:0.05,hi:0.1,u:"MU",dp:3}),"AND",GEN("im","24 hourly","treat to effect"),"AND",PARA]},

 {t:"g",title:"Give antibiotics and analgesia:",rows:[R("amoxicillin","po","C V","4 – <6kg = 62.5mg\n6 – <14kg = 125mg\n14 – 19kg = 250mg","3 times a day","5 days",{k:"wt",b:AW}),"AND",PARA]},
 {t:"ul",x:["Use amoxicillin as first line in children on cotrimoxazole prophylaxis.","Dry the ear by wicking.","Follow-up for 5 days."]},
 {t:"h",x:"Chronic ear infection"},{t:"p",x:"Pus is seen draining from the ear and discharge is reported for 14 days or more."},
 {t:"ul",x:["Dry the ear by wicking.","Instill quinolone drops (such as ciprofloxacin, norfloxacin, or ofloxacin).","Follow-up after 5 days then reassess.","If not improving, refer to ENT specialist."]}]},
{id:"sore-throat",name:"Sore throat, thrush and blocked nose",sec:"Ear, nose and throat",blocks:[
 {t:"p",x:"Antibiotics are only needed for streptococcal sore throats to prevent complications such as rheumatic fever. A streptococcal sore throat presents as tender enlarged lymph nodes in front of the neck and a white exudate on the tonsils."},
 {t:"h",x:"Sore throat but no swollen tender glands in neck and no pus on tonsils"},
 {t:"ul",x:["No antibiotics.","Give paracetamol for pain.","Feed child normally, continue breastfeeding.","Give plenty of fluids."]},
 {t:"h",x:"Sore throat with swollen tender glands in neck or pus on tonsils (all ages)",d:"ss-age"},
 {t:"g",title:"Give antibiotic:",rows:[R("procaine penicillin","im","C V","<1yr = 150mg (½ml)\n1 – 3yrs = 300mg (1ml)\n3 – 5yrs = 450mg (1½ml)","once a day","5 days",{k:"age",b:PA(1)}),"THEN",R("amoxicillin","po","C V","<1yr = 62.5mg\n1 – 3yrs = 125mg\n3 – 5yrs = 250mg\n5 – 12yrs = 375mg\n>12yrs = 500mg","3 times a day","5 days",{k:"age",b:[[0,12,"62.5 mg"],[12,36,"125 mg"],[36,60,"250 mg"],[60,144,"375 mg"],[144,999,"500 mg"]]})],note:"Give paracetamol for pain."},
 {t:"h",x:"Treatment of oral candidiasis (thrush)"},
 {t:"g",title:"Oral candidiasis (thrush):",rows:[R("miconazole 2% gel","po","C V","2.5ml after feeds","once","7 days",null)]},
 {t:"h",x:"Child with a blocked nose or nasal discharge"},
 {t:"p",x:"For clear or mucous nasal discharge, do not give antibiotics; keep nose clean with wet soft tissue or cloth and normal saline nasal drops. For a foreign body in nose refer to hospital/admit for removal."}]}
);

{id:'diarrhoea',name:'Diarrhoea: assessment and persistent diarrhoea',sec:'Diarrhoea in children',blocks:[
 {t:'p',x:'About 90% of deaths from diarrhoea in under-fives would be prevented by:'},
 {t:'ul',x:['giving extra home fluids or salt sugar solution (SSS) or ORS at home at onset of diarrhoea to prevent dehydration;','exclusive breastfeeding for first 6 months of life and continuing breast feeding with solids throughout the attack of diarrhoea to prevent malnutrition;','making sure mothers know when to take the child to a health facility;','correct assessment, treatment and continued feeding at the health facility level (see MoHCC Chart and IMNCI Manual);','treatment of invasive diarrhoea (bloody stool) with antibiotics;','clear instructions on discharge from the health facility for continuing above treatments and when it may be necessary to return for further treatment;','referring to hospital for investigation and treatment: severe malnutrition, persistent diarrhoea (lasting ≥ 14 days);','appropriate use of antibiotics, no anti-diarrhoeal or anti-emetic medicines;','zinc sulphate 20mg/day for 10-14 days to all children ≥ 6months and 10mg/day to infants less than 6 months.'],d:'persist-14'},
 {t:'h',x:'If the child has diarrhoea, ask:'},{t:'ul',x:['For how long?','Is there blood in the stool?']},
 {t:'h',x:'Look:'},{t:'ul',x:['Is the child lethargic or unconscious?','Does the child have sunken eyes?','Is the child able to drink or drinking poorly?','Is the child drinking eagerly or thirsty?']},
 {t:'h',x:'Pinch the skin of the abdomen:'},{t:'p',x:'Does it go back very slowly (longer than 2 seconds)? Classify the dehydration using the table below.'},
 {t:'m',title:'Classification of dehydration',cols:['Signs','Dehydration','Management'],rows:[
 [['Two or more of the following signs:','• Lethargic or unconscious','• Sunken eyes','• Not able to drink or drinking poorly','• Skin pinch goes back very slowly'],['Severe dehydration'],['• Initiate treatment for severe dehydration (Plan C).','• Or if another severe classification*, refer urgently to hospital with caregiver giving frequent sips of oral rehydration fluid or by nasogastric tube on the way. Advise mother to continue breastfeeding.','• If the child is 2 years or older and there is cholera in your area, give antibiotic for cholera.']],
 [['Two or more of the following signs:','• Restless or irritable','• Sunken eyes','• Drinks eagerly or thirsty','• Skin pinch goes back slowly'],['Some dehydration'],['Give fluid and food for some dehydration (Plan B).','• If the child also has a severe classification* from another main symptom, refer urgently to hospital with caregiver giving frequent sips of oral rehydration fluid on the way. Advise mother to continue breastfeeding.','• Advise mother when to return urgently.','• Follow-up in 2 days if not improving.']],
 [['Not enough signs to classify as ‘some’ or severe dehydration.'],['No dehydration'],['• Give fluid and food to treat diarrhoea at home (Plan A).','• Advise caregiver when to return immediately.','• Follow-up in 2 days if not improving.']]],note:'* e.g. severe pneumonia, severe febrile disease, severe malnutrition'},
 {t:'p',x:'NB: If temperature is 38.5°C or higher look for other causes of fever and treat.'},
 {t:'h',x:'Persistent diarrhoea'},
 {t:'ul',x:['Severe persistent diarrhoea is diarrhoea lasting 14 days or more and dehydrated. Start rehydration and refer to hospital.','Persistent diarrhoea is diarrhoea lasting 14 days or more but no dehydration. Advise on feeding (below), give vitamin A, and follow up in 5 days.']},
 {t:'h',x:'General notes: persistent diarrhoea'},
 {t:'ul',x:['if breastfeeding, give more frequent, longer breast feeds, day and night','milk feeds should be mixed with maize meal porridge to reduce the concentration of lactose','sour milk is better tolerated than fresh milk','give fermented porridge if available','give foods rich in vitamin A, folic acid and zinc – liver, kidney, dark green vegetables, fish, beans, groundnuts, breast milk, or vitamin supplements.']}]},
{id:'dysentery-cholera',name:'Bloody diarrhoea (dysentery) and cholera',sec:'Diarrhoea in children',blocks:[
 {t:'h',x:'Indications for antibiotics: bloody diarrhoea, cramps and fever (dysentery)'},
 {t:'g',title:'First line:',rows:[CIP(),'OR',R('nalidixic acid','po','B V','<1yr = 62.5mg\n1 – <5yrs = 125mg\n5 – <10yrs = 250mg\n10 – 17yrs = 375mg','4 times a day','5 days',{k:'age',b:[[0,12,'62.5 mg'],[12,60,'125 mg'],[60,120,'250 mg'],[120,204,'375 mg','i']]})],note:'Patients with HIV may require 7 to 10 days of therapy, and if there is bacteremia, they may require 2-6 weeks.'},
 {t:'p',x:'Follow up after 2 days.'},
 {t:'g',title:'Second line (intestinal amoebiasis):',rows:[R('metronidazole','po','C V','10mg/kg','3 times a day','5 days',{k:'mgkg',lo:10,u:'mg'})]},
 {t:'h',x:'Cholera'},{t:'p',x:'Case definition: rice watery diarrhoea, with or without vomiting, causing severe dehydration or death. In suspected cases immediately notify the Provincial Medical Director and obtain current cholera guidelines. See also the chapter on gastrointestinal conditions.'},
 {t:'ul',x:['Rehydration is most important. The mainstay of cholera management is rehydration, intravenously or orally.','The use of antibiotics is strictly limited to very few indications such as: severe dehydration; high attack rate within a household or congregate settings; as prophylaxis in high-risk areas; if specific guidance is provided as part of the cholera response.','Start antibiotics after the patient is rehydrated and vomiting has stopped – usually after 4-6hrs.','Always confirm recommended medicines for the outbreak.']},
 {t:'g',title:'Cholera antibiotics:',rows:[CIP(),'OR',R('azithromycin','po','C V','20mg/kg','single dose','',{k:'mgkg',lo:20,u:'mg'})]}]},
{id:'fluids-zinc',name:'Composition of fluids and zinc',sec:'Diarrhoea in children',blocks:[
 {t:'h',x:'Sugar salt solution (SSS)'},
 {t:'ul',x:['6 level teaspoons of any household sugar (white or brown),','½ level teaspoon of salt (coarse salt may have to be ground fine), dissolved in','1000ml of clean water measured in any 1000ml bottle (soft drink, oil etc). [The water is boiled only if from a contaminated source and is cooled before adding ingredients.]']},
 {t:'h',x:'‘Home fluids’'},{t:'p',x:'Any fluids including water, tea, thin porridge, ‘mahewu’, but avoiding cold drinks with high sugar content.'},
 {t:'h',x:'Oral rehydration solution (ORS)'},{t:'p',x:'Full formula has now been replaced with low osmolarity ORS formula. It has low levels of glucose and salt to achieve osmolarity of 245mOsm/L resulting in improved efficacy and decreased stool output. It is safe and effective even in children with cholera. Made in hospital pharmacies; however, ORS may be available in packets (sachets) in certain situations according to current ministry policy.'},
 {t:'m',li:0,title:'Low osmolarity ORS',cols:['Ingredient','Weight'],rows:[[['Sodium chloride'],['2.6 g']],[['Trisodium citrate dihydrate*'],['2.9 g']],[['Potassium chloride'],['1.5 g']],[['Glucose, anhydrous'],['13.5 g']],[['Water'],['to 1 litre']]],note:'*Trisodium citrate dihydrate may be replaced by sodium bicarbonate 2.5 grams/litre.'},
 {t:'h',x:'Zinc sulphate'},{t:'p',x:'Give zinc sulphate 20mg/day for 10-14 days with every bout of diarrhoea in infants 6 months and above. Give 10mg/day in infants below 6 months.'},

);

{id:'mal-hypo',name:'Acute malnutrition: hypoglycaemia and infection',sec:'Acute malnutrition',blocks:[
 {t:'p',x:'Patients with severe or moderate acute malnutrition AND complications should be admitted for inpatient care. Complications should be managed according to national protocols for different age groups.'},
 {t:'h',x:'Treatment of hypoglycaemia in severe acute malnutrition'},
 {t:'p',x:'Hypoglycaemia and hypothermia usually occur together and are signs of infection. Check for hypoglycaemia (blood glucose < 3mmol/l) whenever hypothermia (axillary <35.0°C; rectal <35.5°C) is found. Frequent feeding is important in preventing both conditions.'},
 {t:'g',title:'If the child is conscious and has hypoglycaemia give:',rows:[R('10% glucose solution','','C E','50ml bolus','once','',null),'OR',R('10% sucrose solution','','C E','3ml/kg/feed','every 30 minutes','2 hours',{k:'mgkg',lo:3,u:'ml'}),'THEN',R('F-75','','C E','11ml/kg/feed','2 hourly','2 days',{k:'mgkg',lo:11,u:'ml'})]},
 {t:'p',x:'The glucose or sucrose solution (1 rounded teaspoon of sugar in 3.5 tablespoons water) can be given orally or by nasogastric (NG) tube. If the child is unconscious, lethargic or convulsing give IV sterile 10% glucose (5ml/kg), followed by 50ml of 10% glucose or sucrose by NG tube. Then give starter F-75.'},
 {t:'h',x:'Treatment of infection in severely malnourished children'},
 {t:'p',x:'The usual signs of infection, such as fever, are often absent in severe malnutrition. Therefore, presume infection in severe malnutrition and give routinely broad-spectrum antibiotic(s) AND measles-rubella vaccine if child is > 9 months and not immunized (delay if the child is in shock). If the child has no complications, give amoxicillin orally:'},
 {t:'g',title:'No complications:',rows:[R('amoxicillin','po','C V','15mg/kg','8 hourly','5 days',{k:'mgkg',lo:15,u:'mg'})]},
 {t:'p',x:'If the child is severely ill (apathetic, lethargic) or has complications (hypoglycaemia, hypothermia, raw skin/fissures, respiratory tract or urinary tract infection) start with an iv/im penicillin (e.g. ampicillin) before transitioning to an oral penicillin. Combine the penicillins with gentamicin for synergy.'},
 {t:'g',title:'If the child is seriously unwell give:',rows:[R('ampicillin','im/iv','C V','50mg/kg','6 hourly','2 days',{k:'mgkg',lo:50,u:'mg'}),'THEN',R('amoxicillin','po','C V','15mg/kg','8 hourly','5 days',{k:'mgkg',lo:15,u:'mg'}),'AND',R('gentamicin','im/iv','C V','5–7mg/kg','once daily','7 days',{k:'mgkg',lo:5,hi:7,u:'mg'})],note:'Give benzylpenicillin if ampicillin is not available. If amoxicillin is not available continue with ampicillin but give orally 50mg/kg every 6 hours.'},
 {t:'g',title:'If the child fails to improve after 48 hours or if sepsis/septic shock are present give:',rows:[R('ceftriaxone','im/iv','C V','50mg/kg','once daily','5 days',{k:'mgkg',lo:50,u:'mg'}),'OR',R('cefuroxime','im/iv','B N','10–20mg/kg','8–12 hourly','5 days',{k:'mgkg',lo:10,hi:20,u:'mg'}),'AND',R('ciprofloxacin','iv/po','B V','10-15mg/kg','12 hourly','5 days',{k:'mgkg',lo:10,hi:15,u:'mg'})]},
 {t:'g',title:'If the child has suspected staphylococcal infection:',rows:['ADD',R('cloxacillin','iv','B V','25–50mg/kg','6 hourly','7 days',{k:'mgkg',lo:25,hi:50,u:'mg'})]},
 {t:'g',title:'If the child has chronic diarrhoea:',rows:['ADD',R('metronidazole','iv/po','C V','5–10mg/kg','8 hourly','7 days',{k:'mgkg',lo:5,hi:10,u:'mg'})]},
 {t:'g',title:'If the child has parasitic worms give:',rows:['ADD',R('albendazole','po','C V','1–2yr=200mg\n>2yr=400mg','once only','',{k:'age',b:MA()})]}]},
{id:'mal-fluids',name:'Acute malnutrition: dehydration and supplements',sec:'Acute malnutrition',blocks:[
 {t:'h',x:'Treatment of dehydration in severely malnourished children'},
 {t:'p',x:'Dehydration can be considered when the following signs are present: reduced urine output, thirst, rapid pulse, fast respirations. Signs used in well-nourished children (sunken eyes, slow skin pinch, absent tears or dry mouth) are unreliable in severe malnutrition and should be used for monitoring the response to rehydration therapy, rather than for diagnosis.'},
 {t:'p',x:'If signs of shock are present (cold peripheries, weak/thready pulse, prolonged capillary refill time): put the child on oxygen; give 10% dextrose at 5ml/kg IV; give a bolus of IV fluid at 15ml/kg over 1 hour using half-strength Darrow’s solution with 5% dextrose, Ringer’s lactate with 5% dextrose, or 0.45% saline with 5% dextrose; the bolus can be repeated if necessary; if there is no improvement after the second bolus, put the child on maintenance fluids and continue treatment for septic shock.'},
 {t:'ul',x:['Do not use the IV route for rehydration except in cases of shock and then do so with care, infusing slowly to avoid flooding the circulation and overloading the heart.','Do not give standard oral rehydration salts solution (90 mmol sodium/l) in severely malnourished children as it contains too much sodium and too little potassium.']},
 {t:'g',title:'Give special Rehydration Solution for Malnutrition (ReSoMal):',rows:[R('ReSoMal','','C E','5ml/kg bolus then','every 30 minutes','2 hours',{k:'mgkg',lo:5,u:'ml'}),R('','','','5–10ml/kg/hr','determined by stool loss, vomiting and how much the child wants','4–10hrs',null)],note:'If F-75 is available and rehydration is to continue beyond 4 hours, then replace some of the ReSoMal doses with F-75 as follows: give an equivalent volume of F-75 at 4, 6, 8 and 10 hours. At 10 hours, continue feeding with F-75 using recommended feeding volumes and frequencies.'},
 {t:'h',x:'Supplements in malnutrition: anaemia'},
 {t:'ul',x:['Children with SAM (kwashiorkor or marasmus) should be assumed to be severely anaemic.','However, oral iron supplementation should be delayed until the child regains appetite and starts gaining weight, usually after 14 days.','Provide 3 months of therapeutic supplementation, then switch to a preventive supplementation regimen.','Test and treat for hookworm (see Tropical Diseases). After recovery from the acute state treat with ferrous sulphate.']},
 {t:'g',title:'Vitamin therapy in SAM (initiate at day 14 of rehabilitation):',rows:[R('vitamin A','po','C V','<6mths=50,000IU\n6–12mths=100,000IU\n1–5yr=200,000IU','once at the clinic and once at home','2 doses only',{k:'age',b:[[0,6,'50,000 IU'],[6,12,'100,000 IU'],[12,60,'200,000 IU']]}),'AND',R('ferrous sulphate','po* (therapeutic doses)','C E','3–6mg/kg Fe\n(usual max dose=120mg)\n(select patients max dose=200mg)','once a day','3 months',null),'AND',R('folic acid','po (therapeutic doses)','C E','<6kg=2.5mg\n>6kg=5mg','once a day','3 months',{k:'wt',b:[[0,6,'2.5 mg'],[6,999,'5 mg']]}),'AND (if positive for hookworm)',R('albendazole','po','C V','1–2yr=200mg\n>2yr=400mg','once only','',{k:'age',b:MA()})],note:'Iron supplementation is prescribed in units of elemental Fe. Ferrous sulphate suspension has 12mg elemental Fe/5mL.'},
 {t:'g',title:'Vitamin therapy in SAM (initiate at 3 months after therapeutic dosing):',rows:['THEN',R('ferrous sulphate','po* (preventive doses)','C E','<6mnths=1mg/kg Fe\n6–<2yrs=12mg Fe\n2–<5yrs=24mg Fe\n5–12yrs=36mg Fe','once a day','3 consecutive months every year',{k:'age',b:[[0,6,'1 mg/kg Fe'],[6,24,'12 mg Fe'],[24,60,'24 mg Fe'],[60,144,'36 mg Fe','i']]}),'AND',R('folic acid','po (preventive doses)','C E','<6kg=0.2mg\n>6kg=0.4mg\nOR\n5mg','once a day (0.2mg and 0.4mg doses)\nweekly (5mg dose)','3 consecutive months every year',{k:'wt',b:[[0,6,'0.2 mg once a day'],[6,999,'0.4 mg once a day']]})],note:'Iron supplementation is prescribed in units of elemental Fe. Ferrous sulphate suspension has 12mg elemental Fe/5mL.'},
 {t:'g',title:'Mineral therapy in SAM:',rows:[R('electrolyte mixture','po','B -','1ml/kg','4 times a day','until no oedema',{k:'mgkg',lo:1,u:'ml'}),'OR',R('potassium mixture','po','B -','1–2mmol/kg','4 times a day','until no oedema',{k:'mgkg',lo:1,hi:2,u:'mmol'})],note:'No need to give these supplements if on F-75 or F-100. For non-oedematous kwashiorkor and marasmic-kwashiorkor children, the duration is until discharge.'},
 {t:'g',title:'Vitamin supplementation in the general paediatric population:',rows:[R('multivitamin syrup','po','B E','5–10ml','once a day','3 consecutive months every year',null),'AND',R('folic acid','po','C E','5mg','weekly','3 consecutive months every year',null),'AND',R('vitamin A','po','C V','<6mths=50,000IU\n6–12mths=100,000IU\n1–5yr=200,000IU','once at the clinic and once at home','2 doses only',{k:'age',b:[[0,6,'50,000 IU'],[6,12,'100,000 IU'],[12,60,'200,000 IU']]})]}]}
);

{id:'plan-a',name:'Plan A: treat diarrhoea at home',sec:'Diarrhoea in children',blocks:[
 {t:'h',x:'Counsel the mother on the 3 Rules of Home Treatment'},{t:'ul',x:['Give extra fluid','Continue feeding','When to return']},{t:'p',x:'Explain function of ORT (oral rehydration therapy) to mother.'},
 {t:'h',x:'Give extra fluid (as much as the child will take)'},{t:'p',x:'Tell the mother:'},{t:'ul',x:['Breastfeed frequently and for longer each feed.','If the child is exclusively breastfed, give Sugar Salt Solution or ORS in addition to breast milk.','If the child is not exclusively breastfed, give food-based fluids available at home.']},
 {t:'h',x:'It is especially important to give ORT at home when the:'},{t:'ul',x:['Child has been treated with Plan B or Plan C during this visit.','Child cannot return to a clinic if the diarrhoea gets worse.']},
 {t:'h',x:'Teach and show the mother'},{t:'ul',x:['Teach the mother how to prepare and give Sugar Salt Solution or ORS.','Explain to mother the reason for giving Oral Rehydration Therapy and what it does.','Show the mother how much Sugar Salt Solution or ORS to give.','Continue to give as much of the normal feeds as the child will take AND give Sugar Salt Solution or ORS.']},
 {t:'g',title:'Amount to give is:',rows:[FL('ORT fluid','Child’s weight × 100 = ml to give per 24 hours','24 hours',100,0,'per 24 hours')],note:'Show mother how to measure this in a container available at home.'},
 {t:'h',x:'Tell the mother:'},{t:'ul',x:['To give frequent small sips from a cup.','If the child vomits, wait 10 minutes. Then continue but more slowly.','To continue giving extra fluid until the diarrhoea stops.','To continue (breast) feeding.','When to return.']}]},
{id:'plan-b',name:'Plan B: treat some dehydration with oral rehydration therapy',sec:'Diarrhoea in children',blocks:[
 {t:'g',title:'In the health facility give approximately 75ml/kg of oral rehydration therapy over four (4) hours:',rows:[FL('Total','75ml/kg','4 hours',75,0,'in total'),FL('First hour','Start with 10ml per kg in first hour. If the child wants more oral rehydration therapy than this, give more.','1 hour',10,0,'in the first hour'),FL('After the first hour','Give 15 to 20mls per kg per hour. If the child wants and can take more oral rehydration therapy without vomiting, give more.','',15,20,'per hour')]},
 {t:'h',x:'Show the mother how to give oral rehydration solution'},{t:'ul',x:['Give frequent small sips from a cup and spoon.','If the child vomits, wait 10 minutes, then continue, but slowly.','Continue breastfeeding or other normal feeding whenever the child wants.']},
 {t:'h',x:'Reassess after 4 hours'},{t:'ul',x:['If no signs of dehydration: Plan A, and can send home.','If still some dehydration: Plan B, remaining in health facility.','If signs of severe dehydration: Plan C, start in health facility and refer.','Begin feeding the child if not already doing so.']},
 {t:'h',x:'If the mother must leave before completing the treatment:'},{t:'ul',x:['Show her how to prepare Sugar Salt Solution at home.','Show her how much Sugar Salt Solution to give to finish Plan B treatment at home.','If available give 2 packets ORS sachets to prepare and give at home.','Explain to caregiver the reason for giving oral rehydration therapy and what it does.','Explain the 3 Rules of Home treatment: (1) Give extra fluid. See Plan A for recommended fluids. (2) Continue feeding and COUNSEL the mother. (3) When to return.']}]},
{id:'plan-c',name:'Plan C: treat severe dehydration quickly',sec:'Diarrhoea in children',blocks:[
 {t:'g',title:'Start intravenous fluid immediately:',rows:[FL('Amount of fluid','30 ml per kg body weight in 1 hour','1 hour',30,0,'in 1 hour')]},
 {t:'p',x:'Type of fluid:'},{t:'ul',x:['Ringers lactate','OR ½ strength Darrow’s solution in 2.5% dextrose iv','OR if above unavailable 0.9% sodium chloride solution iv','If the child can drink, give oral rehydration therapy while the infusion is being set up (about 5mls per kg body weight per hour).','Caution if child malnourished or is a neonate.']},
 {t:'h',x:'Reassess after one hour'},
 {t:'p',x:'If response good – child regaining consciousness and radial pulses easily palpable or child passing good quantity of urine:'},
 {t:'g',title:'Fluid volumes by weight:',rows:[FL('IV fluid if response good','Continue intravenous fluid at 10ml per kg body weight per hour for a further 5 hours (6 hours in total from the start).','5 hours',10,0,'per hour'),FL('Oral rehydration therapy','About 5mls per kg body weight per hour as soon as the child can drink.','',5,0,'per hour')]},
 {t:'p',x:'If response poor – child remains unconscious or radial pulses weak or undetectable and no urine passed. Response may be poor if child is hypoglycaemic.'},
 {t:'ul',x:['Repeat 30 ml per kg body weight in next hour.','Then continue intravenous fluid at 10 ml per kg body weight per hour for a further 4 hours (6 hours in total from the start).','Continue to assess hydration status and general condition hourly.']},
 {t:'g',title:'If intravenous fluid cannot be started, give by nasogastric tube while awaiting referral:',rows:[FL('Nasogastric fluid','Give 20ml per kg body weight per hour for 6 hours.','6 hours',20,0,'per hour')],note:'Reassess hourly: if there is repeated vomiting or abdominal distension, give fluid more slowly.'},
 {t:'h',x:'Refer urgently to hospital. Reassess hydration status 6 hours after starting fluids'},{t:'ul',x:['If no signs of dehydration: Plan A.','If still some signs of dehydration: Plan B remaining in health facility.','If signs of severe dehydration: Plan C and refer urgently to hospital.','Begin feeding the child if not already doing so.']},
 {t:'p',x:'Child should be referred urgently to hospital if at any time assessment shows poor response.'}]}
);

 [['Children less than 6 months'],['Classify severe if presence of any of the following:','• Bilateral pitting oedema','• Weight for length < −3 SD (WHO)','• Mid-upper arm circumference (MUAC) < 110 mm','• Infant too weak to suckle effectively leading to poor intake','• Mother reports insufficient milk to feed child AND child is not gaining weight'],[''],['']],
 [['Children 6 to 59 months'],['Weight for height'],['< −3 SD (WHO)'],['≥ −3 and < −2 SD (WHO)']],
 [[''],['Mid-upper arm circumference (MUAC)'],['< 115 mm'],['≥ 115 mm and < 125 mm']],
 [[''],['Bilateral pitting oedema'],['Yes'],['No']],

 [[''],['Bilateral pitting oedema'],['Yes'],['No']]],'',0)]},
{id:'mal-feeding',name:'Acute malnutrition: therapeutic feeding and rehabilitation',sec:'Acute malnutrition',blocks:[
 {t:'h',x:'Nutritional rehabilitation at the referral level: general guidelines'},
 {t:'ul',x:['Keep malnourished children in a special area where they can be constantly monitored.','Malnourished children should be isolated from other patients because they are very susceptible to infection.','Try not to separate the caregiver from the child; they should share a bed where possible.','Keep the child in a warm environment. Properly cover the child with clothes, including a hat, and blankets. The child must be dried immediately and properly after bathing. Bath time should be minimal and, done during the day.','Attempt to incorporate an educational message into each intervention.','Intravenous infusions should be avoided except when essential, as for severe dehydration with shock or septic shock.','Intramuscular injections should be given with care in the thigh, using the smallest possible gauge needle and volume of fluid.','The room temperature should be kept at 28-32 degrees Celsius. This will seem uncomfortably warm for active, fully clothed staff, but is necessary for small, immobile children who easily become hypothermic.','Those children who do not need emergency treatment for complications should be admitted directly to outpatient therapeutic programme (OTP) and started on Ready to Use (RTU) feed e.g. plumpy nut, as soon as possible (refer to nutrition guidelines).']},
 {t:'h',x:'Therapeutic feeding'},
 {t:'p',x:'The therapeutic diet for malnourished children consists of two formulas, F-75 and F-100 or Ready to use Therapeutic Food (RUTF). F-75 (75 kcal/100 ml) is used during the initial phase of treatment, while F-100 or RUTF (100 kcal/100 ml) is used during the rehabilitation phase, after the appetite has returned.'},
 {t:'g',title:'Daily feed volumes by weight:',rows:[FL('F-75 / diluted F-100 (Phase 1)','130 ml/kg/day','',130,0,'per day'),FL('F-75 with gross oedema or after shock','100 ml/kg/day','',100,0,'per day'),FL('F-100 (Phase 2, 6 to 59 months)','150 ml/kg/day','',150,0,'per day')]},
 {t:'h',x:'Important notes about Phase 1'},
 {t:'ul',x:['Diluted F-100 (aka modified F-100) is prepared in a manner that mimics breastmilk calories (i.e. 70kcal/mL).','Prepare 100mL by mixing 70mL of F-100 with sterile water.','F-100 contains 100 kcal and 2.9 g protein/100 ml.','F-75 contains 75 kcal and 0.9 g protein/100 ml.','F-75 formula as given above provides 130ml/kg/day.','If there is gross oedema (involves lower limbs, upper limbs and face) or the child has been managed for shock, reduce the volume to 100 ml/kg/day.','Give feeds from a cup or from a spoon, dropper or syringe if the child is very weak to feed.','If the appetite is poor, coax and encourage the patient to finish the feed.','If intake does not reach 75% of prescribed amount despite frequent feeds, coaxing and re-offering, use a nasogastric tube.','If the child is breastfed, encourage continued breastfeeding but also give prescribed amounts of feeds to make sure the child’s needs are met.','In children ≥6 months, switch to F-100 formula as soon as appetite has returned (usually within 7 days) and oedema has started subsiding.','To change from F-75 to F-100 formula replace F-75 with the same amount of F-100 for 48 hours then, increase each successive feed by 10 ml until some feed remains uneaten. The point when some remains unconsumed is likely to occur when intakes reach about 30 ml/kg/feed (200 ml/kg/d).']},
 MM('Inpatient therapeutic feeding recommendations: Phase 1 (stabilisation care)',['Age group','Product and prescription'],[[['Children <6 months'],['• Give Diluted F-100 at 130 ml/kg of body weight per day','• Breastfed children should always be offered breast milk before the therapeutic milk, and always on demand']],[['Children 6 to 59 months'],['• Give F-75 at 130 ml per kg of body weight per day until the patient re-gains appetite.','• Start with 2 hourly feeds (12 feeds per day), and gradually decrease the frequency of feeding and increase the volume of each feed until the patient is getting 3-hourly feeds (8 feeds per day)']]],'',0),
 {t:'h',x:'Important notes about Phase 2'},
 {t:'ul',x:['Readiness to enter the rehabilitation phase is signaled by a return of appetite, usually about one week after admission.','A gradual transition is recommended to avoid the risk of heart failure which can occur if children suddenly consume huge amounts.','A vigorous approach to feeding is required to achieve very high intakes and rapid weight gain of >10 g gain/kg/day.','The recommended milk-based F-100 contains 100 kcal and 2.9 g protein/100 ml.','If gross oedema (lower limbs, upper limbs and face) returns, or the child has been managed for shock, return to Phase 1 feeding at 100 ml/kg/day. Otherwise give F-100 at 150 ml/kg/day and increase each feed to meet the child’s appetite.','F-100 can be replaced by an alternative Ready-to-use therapeutic food (RUTF) once the appetite has returned.'],d:'mal-p2'},
 MM('Inpatient therapeutic feeding recommendations: Phase 2 (transition and rehabilitation)',['Age group','Product and prescription'],[[['Children <6 months'],['• Give twice the volume offered during Phase 1']],[['Children 6 to 59 months'],['• Replace F-75 with F-100 at 150 ml per kg of body weight per day','• Gradually introduce RUTF in small amounts until the child can consume ¾ sachet per day','• When accepted, provide RUTF at 130 kcal per kg of body weight per day']]],'',0),
 {t:'p',x:'If commercial formulas F-75 and F-100 are not available, prepare as follows. DO NOT USE HIGH ENERGY MILK. For alternate ingredients refer to Protocol for management of acute malnutrition.'},
 MM('F-75 and F-100 recipes',['Ingredient','F-75','F-100'],[[['Fresh cow’s milk'],['300 ml'],['900 ml']],[['Sugar'],['100 g'],['50 g']],[['Vegetable oil'],['20 ml'],['25 ml']],[['Vitamin & mineral mix (CMV)'],['3 g (½ scoop)'],['3 g (½ scoop)']],[['Add water to make'],['1000 ml'],['1000 ml']]],'',0),
 MM('ReSoMal recipe',['Ingredient','Amount'],[[['Water (boiled & cooled)'],['2 litres']],[['WHO-ORS'],['One 1-litre packet*']],[['Sugar'],['50 g']],[['Combined vitamin and mineral mix (CMV)*'],['3 g']]],'',0),
 {t:'h',x:'Home management'},
 {t:'ul',x:['Regularly monitor child’s weight: For children less than 1year old monitor weight every month and for those 1year and above, check weight every 2 months.','Encourage exclusive breastfeeding up to 6 months (no additional fluids/foods), introducing other foods in addition to breast milk at 6 months, and breastfeeding up to two years. For young children, continue breastfeeding on demand.','RUTF is a food and medicine for children with Severe acute malnutrition. (SAM)- oedematous and non oedematous (Kwashiorkor or Marasmus) only. It should not be shared.','Children with SAM (Kwashiorkor or Marasmus) often do not like to eat. Give small regular meals of RUTF and encourage the child to eat often (if possible eight meals a day).','Always offer the child plenty of cooled, boiled water to drink while he or she is eating RUTF.','Keep food clean and covered. Hygienic food handling and preparation. Use soap to wash children’s hands and face before feeding. Wash hands with soap and water after visiting the toilet.','Children with SAM (Kwashiorkor or Marasmus) get cold quickly. Always keep the child covered and warm.','When a child has diarrhoea, never stop feeding. Give extra food and extra clean water.','As soon as the child gets better, introduce the fortified, family type diet.']}]}

let CE=[];
function cpEst(){const g=document.getElementById('dg'),clr=()=>{if(P.est){P.w=null;document.getElementById('w').value=''}P.est=false;upd()};
 if(P.a==null){clr();enote('Enter the child\u2019s age first.');return}
 if(P.a<24||P.a>240){clr();enote('The cerebral palsy charts cover ages 2 to 20 years. Please measure the weight.');return}
 const sx=document.getElementById('cs').value,lv=+document.getElementById('cl').value;
 if(!CPW[sx]){clr();enote('Only the girls\u2019 cerebral palsy charts are loaded so far. Please measure the weight.');return}
 const x=(P.a/12-2)/0.25,i=Math.min(Math.floor(x),71),f=x-i;CE=CPW[sx][lv].map(c=>c[i]+(c[i+1]-c[i])*f);P.cl=lv;P.cs=sx;

function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[m][n]}

const ALERTS=[
{id:'sepsis',title:'Child might have sepsis',sum:'Illness in a neonate or young infant is non-specific. Treat as possible sepsis.',max:12,incl:1,ps:['neonate','infant'],topics:['pneumonia','stridor','abscess','diphtheria','pertussis','ear','diarrhoea','dysentery-cholera','meningitis','convulsions','jaundice','nec','tetanus','congenital-syphilis','rds'],
 body:['Illness in neonates is non-specific. A neonate with a urinary tract infection can look the same as one with pneumonia or meningitis. As a rule, treat every neonate (and sometimes an infant, especially under 3 months) as if there is sepsis.','Sepsis is managed like a serious infection, with roughly the same protocol:',['IV medicines','Fluids','Find the source','Confirm the status of critical consequences: HIV, syphilis, TB, and prenatal or intrapartum infection risk factors'],'Other things may be needed, for example:',['Phototherapy if jaundice is above the threshold','Incision and drainage of abscesses','3-hourly umbilical stump care','Adequate breastfeeding']]},
{id:'bf6',title:'Diarrhoea in a young breastfed infant is abnormal',sum:'Diarrhoea in an exclusively breastfed child under 6 months needs full investigation.',max:6,ps:['neonate','infant'],topics:['diarrhoea','dysentery-cholera','plan-a','plan-b','plan-c'],
 body:['Diarrhoea in any child under 6 months of age who is exclusively breastfed is abnormal. It needs to be fully investigated.']}];
function alertOn(a,id){return a.topics.includes(id)&&(P.a!=null?(a.incl?P.a<=a.max:P.a<a.max):a.ps.includes(P.prof))}

const tdy=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};

 if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}
 return{y,m,d,days:Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5)}}

  [['I \u2013 Walks without limitations'],['Walks indoors and outdoors and climbs stairs without limitation. Runs and jumps, but speed, balance and coordination are limited.']],
  [['II \u2013 Walks with limitations'],['Walks indoors and outdoors; holds a railing on stairs. Limited on uneven ground, slopes and in crowds; only minimal running and jumping. May use wheeled mobility for long distances.']],
  [['III \u2013 Walks using a hand-held mobility device'],['Walks with a device indoors or outdoors on level ground; may climb stairs holding a railing. Uses wheeled mobility for long distances or uneven ground.']],
  [['IV \u2013 Self-mobility with limitations; may use powered mobility'],['May walk short distances with a walker; otherwise relies on wheeled mobility at home, school and in the community. Needs adaptive seating.']],
  [['V \u2013 Transported in a manual wheelchair'],['Severe limits in head and trunk control; no independent mobility. May use a powered wheelchair with extensive adaptations.']]],'',0),
 {t:'h',x:'Telling neighbouring levels apart'},
 {t:'ul',x:['Level I and II: in Level II walking long distances and balance are limited, a hand-held device may be needed when first learning to walk, stairs need a railing, and running and jumping are less able.','Level II and III: from about age 4 a child in Level II can walk without a hand-held device (may still choose one at times); a child in Level III needs a device indoors and wheeled mobility outdoors and in the community.','Level III and IV: a child in Level III sits alone or with limited support, transfers more independently and walks with a device; a child in Level IV sits (usually supported), has limited self-mobility, and is more often transported or uses powered mobility.','Level IV and V: Level V has severe limits of head and trunk control and needs extensive assistive technology and physical help; self-mobility is possible only if the child can learn to drive a powered wheelchair.']},
 {t:'p',x:'Descriptions for each age band (before 2 years, 2 to 4, 4 to 6, 6 to 12 and 12 to 18 years) are in the full GMFCS \u2013 E & R document, which should be used when classifying a child.'},
 {t:'gm'},
 {t:'p',x:'How to use the percentile finder: the GMFM-66 score comes from a formal assessment with the GMFM-66 manual. The reference is for children with cerebral palsy only (2 to 12 years, 1940 assessments of 650 children in Ontario, Canada, 1996\u20132001), so consider whether it suits your patient. The closest reference age row, in 3-month steps, is used.'},
