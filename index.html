 {t:"ul",x:["Counselling and support for the HIV positive mother to adhere to ART is crucial.","Exclusive breastfeeding for the first 6 months of life, introducing appropriate complementary foods at 6 months and continuing breastfeeding to 24 months and beyond.","Weaning should not be abrupt, but rather should be gradual over a one-month period.","Breastfeeding mothers should immediately seek treatment for mastitis, cracked nipples, infant mouth lesions and thrush to reduce the risk of MTCT.","Immunisations should be given according to the national guidelines. The BCG vaccination should still be given at birth, but BCG should not be given to children with symptomatic HIV infection.","Always look for and treat opportunistic infections."]}]},
{id:"hiv-child-art",name:"ART in children",sec:"HIV and antiretroviral therapy",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Infants and young children have an exceptionally high risk of poor outcomes from HIV infection. The goal of ART for children is to increase survival and decrease HIV-related morbidity and mortality."},
 {t:"h",x:"Criteria to initiate ART in children"},
 {t:"p",x:"Test earlier, test closer (using early infant diagnosis POC where available) and treat earlier. ART should be initiated in ALL children living with HIV, regardless of WHO clinical stage and CD4 count. Children under 5 years or with WHO clinical stage III/IV or CD4 <25% (<5 years) or ≤350 (>5 years) should be a priority. Health workers should initiate ART immediately if the first NAT result is positive and then retest to confirm the result. ART initiation in children should not be delayed by pending retest results."},
 {t:"h",x:"Issues to consider in initiating ART in children"},
 {t:"p",x:"Psychosocial factors: it is important to identify and counsel at least one dedicated caregiver who can supervise and/or give medicines."},
 {t:"p",x:"Disclosure: disclosure to another adult in the same household (secondary caregiver) is encouraged to assist with medication. The process of disclosure to the child should be initiated as early as possible, usually after 7 years of age. Full disclosure should be completed by 10 years of age. Adherence is good in children who know their status and are supported to adhere to medicines."},
 {t:"h",x:"Preferred and alternative initial regimens"},
 {"t": "m", "title": "Initial ART regimens for neonates", "li": 0, "cols": ["", "Term neonates (≥37 weeks)", "Preterm neonates (<37 weeks)"], "rows": [[["**Preferred"], ["AZT + 3TC + NVP"], ["AZT + 3TC + NVP"]], [["**Special circumstances"], ["ABC + 3TC + DTG", "(in infants identified from 2 weeks of age)"], ["–"]]]},
 {"t": "m", "title": "Initial ART regimens for children more than 4 weeks of age and less than 30 kg", "li": 0, "cols": ["", "Preferred initial regimen", "Alternative regimen", "Special circumstances"], "rows": [[["**Children (>4 weeks of age) and less than 30 kg"], ["ABC + 3TC + DTG"], ["ABC + 3TC + LPV/r"], ["ABC + 3TC + EFV", "AZT + 3TC + LPV/r"]]]},
 {t:"ul",x:["DTG 10 mg dispersible tablets are recommended for use in children living with HIV for term infants (gestational age ≥37 weeks). The dispersible FDC of pALD (paediatric abacavir + lamivudine + dolutegravir) can be used in children living with HIV as indicated in the dosing table.","For children who weigh 20 kg or more, DTG 50mg single film coated tablet is recommended in combination with ABC + 3TC. A child should only be switched to the DTG 50mg tablet when they can swallow the tablet whole.","TAF + 3TC can be an alternative to ABC + 3TC for those >25 kg.","For children who are at least 10 years old and weigh 30 kg or more the FDC of TLD is recommended."]},
 {t:"h",x:"Starting ART in children using FDCs"},
 {t:"p",x:"Refer to the dosing tables. Keep the following factors in mind regarding dosing: medicine doses must be adjusted as the child grows; dosing is by weight; scored tablets may be divided into two equal halves."},
 FIG("art-d0","Recommended dosing for antiretroviral medicines from 0-4 weeks of age"),
 {t:"p",x:"Note: raltegravir (RAL) was the preferred backbone for neonates 0–4 weeks of age in EDLIZ 2020. It is no longer available and has been replaced by the current preferred regimen. EDLIZ kept it in the tables, perhaps in case it is resupplied."},
 FIG("art-d4","Dosing tables for children more than 4 weeks of age"),
 {t:"p",x:"Note: blank cells in these tables (for example the raltegravir rows, and some ATV/r, ABC/3TC and LPV/r cells for 25–34.9 kg) mostly reflect medicine availability and the currently recommended regimens. EDLIZ left the cells blank rather than removing the rows."},
 FIG("art-dpd","Recommended paediatric ARV medicines by weight band"),
 {t:"h",x:"Monitoring children on ART"},
 {t:"ul",x:["Growth should be monitored and development assessed.","Infant feeding practices should be reviewed regularly and appropriate supportive counselling and appropriate referrals provided.","Check haemoglobin after at least 6-8 weeks if on zidovudine.","Use urine dipsticks to check for glycosuria and creatinine clearance (CrCl) and/or serum creatinine when on tenofovir.","Check CD4 count at ART initiation (in children older than 5 years), for clients returning to care and those with suspected or confirmed treatment failure.","Conduct viral load testing 6 months after ART initiation, 12 months after ART initiation and once every year thereafter or when clinical signs are suggestive of treatment failure.","Opportunistic infections should be evaluated at every visit."]},
 {t:"h",x:"Treatment failure in children"},
 {t:"ul",x:["Clinical failure: new or recurrent clinical event indicating advanced or severe immunodeficiency (WHO clinical stage 3 and 4 clinical condition with the exception of TB) after 6 months of effective treatment.","Immunological failure: in children younger than 5 years, CD4 percentage <15%. In children older than 5 years, CD4 levels persistently below 200 cells/mm³.","Virological failure: plasma viral load above 1000 copies/ml based on two consecutive viral load measurements after 3 months, with adherence support."]},
 {t:"h",x:"Second line treatment for children"},
 {"t": "m", "title": "Second line treatment regimens for children below 30 kg", "li": 0, "cols": ["Failing regimen", "Preferred subsequent regimen", "Alternative subsequent regimen"], "rows": [[["**ABC + 3TC + DTG"], ["ABC + 3TC (or FTC) + LPV/r (or ATV/r)"], ["ABC (or TAF) + 3TC (or FTC) + DRV/r", "AZT + 3TC + LPV/r (or ATV/r)"]], [["**ABC (or AZT) + 3TC + LPV/r"], ["ABC + 3TC (or FTC) + DTG"], ["ABC (or AZT) + 3TC + DRV/r"]], [["**AZT + 3TC + NVP"], ["ABC + 3TC (or FTC) + DTG"], ["ABC + 3TC + LPV/r (or ATV/r or DRV/r)"]]], "note": "Where dosage guidelines and appropriate formulations are available: DTG is preferred as first line in children; DTG can also be used in 1st, 2nd and 3rd line; DRV should not be used for children younger than 3 years of age; DRV should be used with ritonavir boosting in those above 3 years of age."},
 {t:"p",x:"Discuss the child with your mentor if not sure of second line treatment."}]},
{id:"hiv-child-gen",name:"HIV infection in children: general care",sec:"HIV and antiretroviral therapy",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Paediatric HIV infection can be significantly reduced by implementing an effective Prevention of Mother to Child Transmission (PMTCT) program. Symptomatic HIV infection may be difficult to distinguish from other childhood conditions such as respiratory infections, diarrhoea and malnutrition. Suspect HIV related disease if two or more of the following signs are present:"},
 {t:"ul",x:["severe or recurrent pneumonia","generalised lymphadenopathy","hepato-splenomegaly","failure to thrive","severe/recurrent oro-pharyngeal candidiasis","finger clubbing"]},
 {t:"p",x:"In most cases, the route of transmission is from mother to child. Ensure pre-test counselling of parents/caregivers before testing the child for HIV infection. Antibody detection tests are not diagnostic of true infection before 18 months due to persistence of maternal antibodies in the child."},
 {t:"h",x:"General guidelines for HIV care in children"},
 {t:"ul",x:["Nutrition: advise the caregiver on a high calorie diet and other essential nutrients for the child. Safe food and water practices.","Hydration: oral rehydration, together with dietary advice, is most important in the management of persistent diarrhoea. Intravenous fluids may be needed during severe diarrhoeal episodes.","Immunisation: BCG should be given to all children at birth. Immunisation is contraindicated only where there is symptomatic HIV infection. The current recommendation is to give the other live vaccines, measles and oral poliomyelitis vaccine, even in immune-compromised children (see chapter on Immunisation).","Home care is preferable to hospital admission for chronic care.","Counselling: the family will require support in facing the emotional and financial demands of the child’s chronic ill health as well as those arising from the parents’ own HIV status."]},
 {t:"h",x:"Common HIV related conditions"},
 {t:"p",x:"Bacterial infections: in the HIV infected child infections are likely to be more frequent, of longer duration with a poorer response to treatment. Septicaemia, meningitis, pneumonia and abscesses frequently occur before any other features of HIV infection are evident. The causative organisms, however, are likely to be similar to those found in non-HIV-infected children and the standard guidelines on the choice of antibiotics apply. However, in a child with severe pneumonia where Pneumocystis jiroveci pneumonia (PCP) is suspected, a course of high dose cotrimoxazole (60mg/kg every 8 hours) and steroids are indicated."},
 {t:"p",x:"Once a child is diagnosed as having HIV-related pneumonia, cotrimoxazole prophylaxis should be commenced:"},
 {t:"g",title:"Prophylaxis in HIV-related pneumonia:",rows:[R("cotrimoxazole","po","C V","<6 months or <5kg = 120mg\n6 months to <5 years or 5 to <15kg = 240mg\n5-14 years or 15-30kg = 480mg","once a day","for paediatric life")]},
 {t:"ul",x:["There is an increased risk of tuberculosis infection in the HIV infected child. Where TB is confirmed, or with a diagnosis of probable TB, use the anti-TB treatment regimens recommended in the chapter on Tuberculosis.","Recurrent or persistent diarrhoea: current evidence suggests that no single pathogen is responsible for the persistence of episodes of diarrhoea (>14 days). Follow the diarrhoea management guidelines in the section on diarrhoea.","Chronic otitis media, oral candidiasis, eczema/papular rash, and anaemia may be related to HIV infection but are managed according to standard guidelines.","Lymphocytic interstitial pneumonitis (LIP) is more commonly seen, presenting after the first year of life. Short term steroids have been used with good effect in children with severe respiratory symptoms. Give first dose of antibiotic (see management of pneumonia) and refer for specialist diagnosis. The child needs to be initiated on ART."]}]},
{id:"hiv-prep",name:"Pre-exposure prophylaxis (PrEP)",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Pre-exposure prophylaxis (PrEP) is the use of ARVs by people who are HIV negative before HIV exposure to prevent the acquisition of HIV. With optimum adherence, oral PrEP is more than 90% effective in reducing the risk of HIV infection."},
 {t:"h",x:"Eligibility criteria for oral PrEP"},
 {t:"p",x:"Oral PrEP should be offered to individuals who are HIV negative and are at substantial risk of HIV infection. An HIV test must be done before PrEP is initiated. Individuals at high risk have:"},
 {t:"ul",x:["multiple sexual partners","inconsistent and incorrect use of condoms","female sex workers (FSWs) and those who engage in transactional sex","men who have sex with men (MSM)","use or abuse of injectable drugs and alcohol","episode(s) of STI within the last six months","discordant couples, especially if the HIV positive partner is not on ART or has been on ART for less than six months or those with high viral load","recurrent users of PEP"]},
 {t:"p",x:"In addition, individuals should commit and be supported to adhere to PrEP. Sub-populations considered to be at high risk for HIV infection include people in sero-discordant relationships, sex workers, long-distance truck drivers, men who have sex with men (MSM), adolescent girls and young women, and pregnant and breastfeeding women."},
 {t:"g",ad:1,title:"Recommended regimens for oral PrEP:",rows:[R("tenofovir (TDF) 300mg + emtricitabine (FTC) 200mg","po","C V","1 tablet FDC","once a day","period of substantial risk"),"OR",R("tenofovir (TDF) 300mg + lamivudine (3TC) 300mg","po","C V","1 tablet FDC","once a day","period of substantial risk")],note:"NB: In cases where TDF/FTC or TDF/3TC are both not available, TDF single formulation can be used. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"ul",x:["NB: it takes about 7 days of daily oral dosing for PrEP to be effective. During this period, other HIV preventive options such as abstinence and condoms must be used.","PrEP medications should be continued for 28 days after the last potential HIV exposure in those wanting to stop taking PrEP.","PrEP may be used intermittently during periods of perceived HIV acquisition risk, rather than continually and lifelong, as is the case with antiretroviral treatment.","Other regimens and formulations for PrEP will be introduced in the future."]},
 {t:"h",x:"Injectable PrEP"},
 {t:"p",x:"New HIV prevention tools are now available, including:"},
 {t:"ul",x:["Long acting cabotegravir (CAB-LA), which is given deep into the gluteal muscle (the buttock) every two months. CAB-LA is an antiretroviral (ARV) in the integrase inhibitor class offering a convenient alternative to daily pills for people at substantial risk of HIV.","Long-acting injectable lenacapavir (LEN), introduced in July 2025 as an additional HIV prevention tool. It reduces the risk of sexually acquired HIV-1 in adults and adolescents weighing at least 35 kg who are at risk. It is a highly effective, twice-yearly option that can help people who struggle with the adherence needed for daily oral pills."]},
 {t:"h",x:"Administration and dosing"},
 {t:"p",x:"The injection is given subcutaneously (under the skin) into the abdomen or thigh. The full treatment or PrEP regimen begins with a combination of oral lenacapavir tablets and injections (loading doses), followed by maintenance injections every 26 weeks (six months). If an injection is anticipated to be delayed, a healthcare provider may prescribe interim oral tablets to maintain protection."},
 {t:"h",x:"Contraindications for PrEP"},
 {t:"ul",x:["HIV positive status","unknown HIV status","recent exposure (in the past 72 hours)","evidence or suspicion of HIV primary infection (characterised by a flu-like illness)","allergy to any of the PrEP medicines","unwilling or unable to adhere to PrEP","known renal impairment","estimated creatinine clearance of <60 cc/min"]},
 {t:"p",x:"Note: in the general population TDF is not started when the creatinine clearance (CrCl) is below 50 ml/min. The usual person seeking PrEP is a healthy, sexually active individual, so the higher CrCl cut-off of <60 ml/min is used for PrEP."},
 {t:"h",x:"Follow up and monitoring of PrEP clients"},
 {t:"ul",x:["After initiating PrEP, the client should be reviewed after one month to monitor adherence and side effects as well as resupply of medicines; subsequent clinic visits should be every three months.","Perform an HIV antibody test every three months and document negative HIV status.","For women, perform a pregnancy test based on clinical history. Pregnancy is not a contraindication for PrEP use.","Review the client’s understanding of PrEP, any barriers to adherence, tolerance to the medication as well as any side effects.","Review the client’s risk exposure profile and perform risk reduction counselling.","Evaluate and support PrEP adherence at each clinic visit.","Evaluate the client for any symptoms of STIs at every visit and treat as needed.","Provide risk assessment and risk reduction counselling at every visit."]},
 {t:"h",x:"Discontinuing PrEP"},
 {t:"p",x:"PrEP can be discontinued in the following circumstances:"},
 {t:"ul",x:["on seroconversion (HIV positive)","intolerable toxicities and side effects associated with PrEP use","changed life situations resulting in lowered risk of HIV acquisition","social adverse events associated with PrEP","poor adherence despite efforts to improve daily pill taking","when a personal choice is made to stop PrEP; such individuals should be linked to other preferred HIV prevention options","in sero-discordant couples when the HIV infected partner on ART has achieved viral suppression (VL <1,000 copies/ml) with at least 6 months of ART"]},
 {t:"p",x:"NB: it is important to ensure that the client continues to take the medicines for at least 28 days after the last exposure."},
 {t:"h",x:"Event-driven PrEP (ED-PrEP) for high-risk men"},
 {t:"p",x:"ED-PrEP is taking of PrEP for a period that is as short as three days and timed to correspond with anticipated sex. ED-PrEP use is only approved for all individuals assigned male at birth not exposed to exogenous hormones such as gender-affirming hormone therapy."},
 {t:"g",ad:1,title:"Recommended regimens for event-driven PrEP in high risk men:",rows:[R("tenofovir (TDF) 300mg + emtricitabine (FTC) 200mg","po","C V","2 tablets stat, then 1 tablet FDC","once a day","2 days after last potential exposure"),"OR",R("tenofovir (TDF) 300mg + lamivudine (3TC) 300mg","po","C V","2 tablets stat, then 1 tablet FDC","once a day","2 days after last potential exposure")],note:"NB: ED-PrEP is contraindicated in people with HBV infection. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."}]},
{id:"hiv-pep",name:"Post-exposure prophylaxis (PEP)",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"In people who have been exposed to HIV through needle-stick inoculation or through contamination of mucous membranes by secretions, it has been shown that administration of ARVs within 72 hours of exposure reduces the likelihood of HIV infection being transmitted. There are also similar benefits of reduction of HIV transmission following use of PEP within 72 hours for those who have been sexually assaulted (rape, intimate partner violence or sexual abuse) or had a high risk unprotected sexual encounter. In these situations, ART needs to be continued for one month. The following guidelines should be followed in the event of accidental occupational exposure to material (i.e. blood, secretions and excretions) that may contain HIV, and also after sexual assault or high-risk sexual encounter."},
 {t:"p",x:"The following types of exposures should be considered for post-exposure prophylaxis:"},
 {t:"ul",x:["needle-stick injury or injury with a sharp object used on a patient","mucosal exposure of the mouth or eyes by splashing fluids","broken skin exposed to a small volume of blood or secretions such as may occur with sexual assault (rape, intimate partner violence or sexual abuse)","exposure after unprotected sexual intercourse"]},
 {t:"p",x:"Occupational exposure can be classified as high risk or low risk for HIV infection, as follows:"},
 {t:"h",x:"Low risk"},
 {t:"ul",x:["small volume (for example drops of blood) on mucous membranes or non-intact skin","source patient asymptomatic or with VL less than 1,500 copies/ml"]},
 {t:"h",x:"High risk"},
 {t:"ul",x:["large-bore needle, deep injury","large-volume splash on mucous membranes or non-intact skin","source patient symptomatic or with high VL levels"]},
 {"t": "m", "title": "Post-exposure prophylaxis (PEP) in adults and adolescents", "li": 0, "cols": ["", ""], "rows": [[["**Preferred regimen"], ["TDF/3TC/DTG (a) once a day"]], [["**Alternative regimen"], ["TDF/3TC/ATV/r (b) once a day"]]], "note": "(a), (b): Available at all health facilities from clinic upwards as starter pack and one-month course."},
 {t:"h",x:"Main considerations"},
 {t:"p",x:"There should be no delay in starting the best available starter pack in situations where resistance is suspected. Start the best available starter pack and then get expert advice on the way forward."}]},
{id:"hiv-pmtct",name:"Prevention of mother-to-child transmission of HIV (PMTCT)",sec:"HIV and antiretroviral therapy",aud:"adult",src:"EDLIZ 2025, HIV Related Disease and Antiretroviral Therapy chapters",blocks:[
 {t:"p",x:"Mother-to-child transmission is responsible for more than 90% of HIV infection in children and at least two thirds of such infections occur during pregnancy and delivery whilst the remainder occur during breastfeeding. It is therefore critical to identify HIV-positive pregnant and lactating women and manage them appropriately."},
 {t:"h",x:"When to start ART in HIV positive pregnant and breastfeeding women"},
 {t:"ul",x:["All HIV infected pregnant and breastfeeding women should be initiated on lifelong antiretroviral treatment (ART) irrespective of their CD4 count or WHO clinical stage (Option B+).","Women who are not yet ready for lifelong ART should be initiated on triple ARVs (ART), which should be continued at least for the duration of breastfeeding to prevent further risk of mother-to-child transmission of HIV through breast milk."]},
 {t:"p",x:"Being on lifelong ART will necessitate ongoing counselling of HIV positive pregnant and breastfeeding women to support retention and adherence and to minimise loss to follow-up."},
 {t:"ul",x:["Emphasise modes of HIV transmission and prevention, PMTCT, and access to care and treatment.","Encourage partner HIV testing and counselling.","Encourage the importance of skilled birth attendance, clean and safe delivery, and newborn care.","Counsel on infant and young child feeding and maternal nutrition.","Counsel on sexual and reproductive health including family planning and the need for dual contraception (reliable hormonal contraceptive plus a barrier method like male or female condoms).","Make an appointment for family planning at six weeks postpartum.","Stress the need for condom use for prevention of STIs and HIV during pregnancy and in the postpartum period.","Retest previously negative women during the 3rd trimester of pregnancy and/or at delivery, 6 weeks postnatally and 6 monthly thereafter.","Initiate PrEP (oral or injectable) in pregnant and breastfeeding women including adolescents at high risk of HIV acquisition.","Stress the importance of follow-up for the HIV exposed infant.","Commence cotrimoxazole prophylaxis from 6 weeks of age.","Collect dried blood spot (DBS) for HIV nucleic acid test (NAT) at birth, at 6 weeks of age and 9 months of age (early infant diagnosis, EID).","Infants should be retested at 18 months or, if still breastfeeding, 3 months after complete cessation of breastfeeding, using HIV rapid antibody tests to confirm the final outcome."]},
 {t:"h",x:"Dolutegravir (DTG) and neural tube defects"},
 {t:"p",x:"When using ARVs in pregnant women, certain precautions should be kept in mind. Exposure to DTG at the time of conception may be associated with an increased risk of neural tube defects (NTDs) among infants, although NTD risk has been further reduced compared to when first reported."},
 {t:"h",x:"Infant and young child feeding recommendations"},
 {t:"p",x:"All mothers whether known to be HIV positive or not should exclusively breastfeed their infants (no mixed feeding) for the first 6 months of life, introducing safe, adequate and nutritious complementary foods thereafter, with continued breastfeeding up to 24 months and beyond."},
 {t:"h",x:"ARV prophylaxis in an HIV-exposed infant"},
 {t:"p",x:"See the page Early infant diagnosis and care of the HIV-exposed infant, and the page ART in children."}]},
{id:"hep-b-diag",name:"Chronic hepatitis B: diagnosis and assessment",sec:"Hepatitis B and C",aud:"adult",src:"EDLIZ 2025, Chronic Hepatitis B and C chapter",blocks:[
 {t:"h",x:"General notes"},
 {t:"p",x:"Hepatitis B infection is caused by the hepatitis B virus (HBV) and can either be acute or chronic. Acute hepatitis B is a new onset infection that may or may not be icteric or symptomatic. Acute infection is self-limiting with recovery usually within three months accompanied by clearance of hepatitis B surface antigen (HBsAg) and seroconversion of antibodies to hepatitis B surface antigen (anti-HBs). Chronic HBV infection (CHB) is defined by persistence of HBsAg for six months or more after acute infection with HBV and encompasses a spectrum of diseases that includes progressive liver fibrosis, cirrhosis, end stage liver disease and hepatocellular carcinoma. Chronicity is common following acquisition in childhood. Most individuals in Zimbabwe are infected in childhood, and thus most adults who have a positive HBsAg have chronic infection."},
 {t:"h",x:"Transmission"},
 {t:"p",x:"The greatest risk of developing chronic infection is following mother to child transmission (MTCT) or horizontally in childhood (see the page on elimination of MTCT of hepatitis B). Generally, HBV is predominately transmitted by percutaneous or mucosal exposure to infected blood or body fluids. Accidental inoculation of minute amounts of blood or fluid may occur during medical and surgical procedures, use of inadequately sterilised syringes, intravenous and percutaneous drug abuse, tattooing, body piercing or sexual transmission. Transmission in the healthcare setting is now mainly historical, although continued vigilance is paramount."},
 {t:"h",x:"Diagnosis"},
 {t:"ul",x:["Rapid diagnostic test to detect HBsAg or laboratory based serological immunoassay.","Transaminases (ALT and AST) may help determine liver inflammation.","Additional serology markers (HBeAg, HBeAb and HBcIgM) may help ascertain the stage of infection.","The degree of fibrosis can be determined non-invasively using the aspartate aminotransferase-to-platelet ratio index (APRI).","Where available, transient elastography can be used to assess fibrosis. A value of >7.0 kPa indicates fibrosis, while a value of >12.5 kPa indicates cirrhosis."]},
 {t:"h",x:"Assessing liver fibrosis using the APRI score"},
 {t:"p",x:"APRI = [(AST ÷ AST upper limit of normal) × 100] ÷ platelet count (10⁹/L). AST = aspartate aminotransferase."},
 {"t": "m", "title": "Interpretation of the APRI score", "li": 0, "cols": ["APRI score", "Interpretation"], "rows": [[["<0.5"], ["No significant fibrosis (below the 0.5 mark on the chart)"]], [["0.5 to <1.0"], ["Significant fibrosis"]], [["≥1.0"], ["Cirrhosis"]]], "note": "Taken from the figure in the print. The print marks the cut-offs at 0.5 and 1.0 without stating which band includes the cut-off value itself; the bands here follow the app’s “<” and “≥” convention. See the Corrections log / roadmap for the flag."},
 {t:"h",x:"Assessment for treatment eligibility"},
 {t:"ul",x:["Clinical assessment for presence of cirrhosis, and its complications including ascites, oesophageal varices, and hepatocellular carcinoma.","Medical history: screening for presence of coinfections (e.g. HIV or HCV), comorbidities (e.g. diabetes, steatotic liver disease, alcohol use disorder), other causes of immune suppression (e.g. long-term steroids, transplant), extrahepatic manifestations (e.g. glomerulonephritis, vasculitis), or family history of liver cancer or cirrhosis.","Measure bilirubin, ALT, AST, ALP, GGT, prothrombin time, and platelet count. A low platelet count often suggests significant portal hypertension.","Do an HIV test and check renal function.","Check for severity of liver disease using non-invasive tests, i.e. calculate the APRI score or use transient elastography if this is available.","Exclude hepatocellular carcinoma: ultrasonography and alpha-fetoprotein.","HBV DNA nucleic acid test should be done if available, and necessary. HBV DNA is the optimal method to monitor viral replication before, and during antiviral treatment."]}]},
{id:"hep-b-treat",name:"Chronic hepatitis B: who to treat, treatment and monitoring",sec:"Hepatitis B and C",aud:"adult",src:"EDLIZ 2025, Chronic Hepatitis B and C chapter",blocks:[
 {t:"h",x:"Who to treat among adults and adolescents (≥12 years) with chronic hepatitis B"},
 {t:"p",x:"Patients who should be treated regardless of HBV DNA level or transaminases:"},
 {t:"ul",x:["Cirrhosis or clear evidence of significant fibrosis (APRI score >0.5, and transient elastography >7 kPa in adults).","HIV or HCV co-infection, or any other causes of immune suppression.","Family history of liver cancer or cirrhosis.","Comorbidities (e.g. diabetes, metabolic dysfunction-associated steatotic liver disease).","Extrahepatic manifestations (e.g. glomerulonephritis or vasculitis)."]},
 {t:"p",x:"Patients with HBV DNA >2000 IU/mL and an ALT level above the upper limit of normal (ULN) (30 U/L for men and boys and 19 U/L for women and girls) should also be treated."},
 {t:"p",x:"When HBV DNA is not available, patients with persistently abnormal ALT levels should be treated. This is defined as at least two measurements above the upper limit of normal within a 6-to-12-month period."},
 {t:"p",x:"People who do not meet the criteria for antiviral therapy or who have deferred treatment should be monitored annually for disease progression using ALT and HBV DNA levels (where available)."},
 {t:"h",x:"General care measures"},
 {t:"ul",x:["Counselling on lifestyle e.g. alcohol consumption, diet and physical activity.","Preparation for starting treatment e.g. adherence support, risk factors for renal dysfunction and baseline renal function (as indicated).","Preventive measures e.g. HBsAg screening of family and household members and sexual contacts, with HBV vaccination of those negative."]},
 {t:"h",x:"Antiviral therapy"},
 {t:"p",x:"Treatment with nucleoside analogues delays progression of cirrhosis, reduces the incidence of hepatocellular carcinoma and improves long term survival."},
 {t:"p",x:"Testing for HIV is recommended before commencing hepatitis B treatment to ensure an optimal ARV regimen. HIV and HBV co-infection should be treated with dual NRTI inhibitors i.e. TDF or TAF with 3TC or FTC together with a third anchor drug e.g. dolutegravir."},
 {t:"p",x:"Entecavir (ETV) is not an appropriate option for people with both HIV and hepatitis B. ETV is primarily used to treat chronic hepatitis B virus (HBV) infection in adults and children aged ≥2 years and has no clinically meaningful activity against HIV. [source: McMahon et al (2007), NEJM 356 (25): 2614-2621]"},
 {t:"p",x:"Assessment of baseline renal function should be considered before initiating antiviral therapy to inform the choice of regimen. Refer for specialist care if renal function is abnormal. People receiving long-term TDF should be monitored annually for renal function."},
 {t:"g",ad:1,title:"First line treatment for hepatitis B infection:",rows:[R("tenofovir disoproxil fumarate (TDF)","po","B V","300mg","once a day","for life"),"OR",R("tenofovir alafenamide fumarate (TAF)","po","B V","25mg","once a day","for life")],note:"Prefer TAF for people with established osteoporosis and/or impaired kidney function. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"g",ad:1,title:"Alternative first line treatment for hepatitis B infection:",rows:[R("tenofovir / emtricitabine","po","C V","300/200mg","once a day","for life"),"OR",R("tenofovir / lamivudine","po","C V","300/300mg","once a day","for life")],note:"This alternative regimen is used when single drug formulations are not available. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"h",x:"Monitoring patients"},
 {t:"ul",x:["Ultrasound and alpha-fetoprotein to screen for HCC every 6 months in patients with cirrhosis or a family history of cancer. Consider similar screening in patients in whom treatment has been deferred.","Adherence at each visit if on treatment.","The following should be performed annually: non-invasive tests (APRI or transient elastography); ALT and HBV DNA level; renal function (creatinine), as indicated."]},
 {t:"h",x:"When to stop and restart antiviral therapy"},
 {t:"p",x:"All people with cirrhosis require lifelong treatment and should not discontinue antiviral therapy because of the risk of reactivation, which can cause severe acute-on-chronic liver injury. Specialist referral (or a virtual discussion) is recommended if discontinuation is being contemplated."}]},
{id:"hep-c",name:"Chronic hepatitis C",sec:"Hepatitis B and C",aud:"adult",src:"EDLIZ 2025, Chronic Hepatitis B and C chapter",blocks:[
 {t:"h",x:"General notes"},
 {t:"p",x:"HCV infection causes both acute and chronic hepatitis. Approximately 25% of individuals will spontaneously clear the infection within six months of infection. The remainder will develop chronic infection, which can lead to progressive fibrosis and cirrhosis. The age of acquisition, alcohol use, HBV or HIV coinfection and immunosuppression due to any cause increase the risk of developing cirrhosis or hepatocellular carcinoma. Co-infection of hepatitis B and C is common in endemic countries and co-infection increases the risk of developing an infiltrating and more aggressive form of hepatocellular carcinoma at a younger age. Therefore, those starting HCV direct-acting antiviral (DAA) therapy should be assessed for current or past HBV infection and monitored for potential post-therapy HBV reactivation as hepatitis C can suppress HBV DNA."},
 {t:"h",x:"Transmission"},
 {t:"p",x:"HCV is primarily transmitted through percutaneous exposure to infected blood and injection. Drug use poses the greatest risk for HCV infection. Most of the cases of HCV in Zimbabwe are likely to have been from historical exposure in healthcare settings or during risky cultural practices facilitating percutaneous exposure. Other modes of transmission include unsafe health care injection practices, mother to child transmission, incarceration, tattoos, body piercing and less commonly, sexual exposure."},
 {t:"h",x:"Diagnosis"},
 {t:"p",x:"Screening for HCV can be conducted with a laboratory based or point of care antibody assay. As the antibody test can signify current or past infection, viraemic hepatitis C infection should be confirmed in these individuals by reflex quantitative or qualitative PCR. An assay to detect HCV core (p22) antigen, which has comparable clinical sensitivity to laboratory-based HCV RNA NAT assay, can be an alternative approach to confirm HCV viraemia. An assessment of the severity of liver disease is important for patients with chronic hepatitis C to determine initial and follow-up care. Non-invasive tests such as the APRI score as well as assessment of liver surface nodularity and spleen size by liver ultrasound or other cross-sectional imaging modalities can help determine if patients with HCV have cirrhosis and associated portal hypertension. This assessment will facilitate decision making regarding HCV treatment strategy and determine the need for initiating additional measures for the management of cirrhosis."},
 {t:"h",x:"Who to treat"},
 {t:"p",x:"Treatment is recommended for all adults, adolescents and children aged 3 years and above (regardless of stage of disease) with chronic HCV infection, defined as the presence of persistent HCV RNA or HCVcAg in serum in association with positive serology for HCV antibody. The goal of treatment is an undetectable HCV RNA in the blood at a defined time point after the end of treatment, usually at 12 or 24 weeks (sustained virological response, i.e. SVR12 or SVR24)."},
 {t:"p",x:"The algorithm below summarises the assessment, treatment and monitoring of people with chronic hepatitis C:"},
 FIG("hepc","Hepatitis C testing, treatment and monitoring algorithm"),
 {t:"p",x:"*Persons who failed prior therapy with interferon, ribavirin, and/or sofosbuvir with HCV genotype 1, 2, 4–6 with cirrhosis should be treated for 12 weeks, and with HCV genotype 3 with or without cirrhosis should be treated for 16 weeks."},
 {t:"h",x:"Antiviral treatment"},
 {t:"p",x:"The following pan-genotypic DAA regimens are recommended:"},
 {"t": "m", "title": "Pan-genotypic DAA regimens (once a day)", "li": 0, "cols": ["Medicine (po)", "Codes", "Weight", "Dose", "Duration"], "rows": [[["**sofosbuvir / velpatasvir"], ["B V"], [">26 kg", "14–25 kg"], ["400/100mg", "200/60mg"], ["12 weeks"]], [["**sofosbuvir / daclatasvir"], ["B V"], [">30 kg", "17–29 kg", "<17 kg"], ["400/100mg", "200/50mg", "150/37.5mg"], ["12 weeks"]], [["**glecaprevir / pibrentasvir"], ["S V"], [">45 kg", "30–45 kg", "20–30 kg", "<20 kg"], ["300/120mg", "250/100mg", "200/80mg", "150/60mg"], ["8 weeks"]]], "note": "Patients with decompensated cirrhosis, and those who are treatment experienced should be referred for specialist care. Flag: the algorithm figure shows sofosbuvir/daclatasvir for 24 weeks in compensated cirrhosis or prior therapy, and the footnote says 12 or 16 weeks; the dosing table above says 12 weeks. See the roadmap."},
 {t:"h",x:"Assessment of treatment response"},
 {t:"p",x:"Assess sustained virological response (SVR) 12 weeks after completion of treatment. An undetectable HCV RNA at SVR12 means cure. People with cirrhosis should continue surveillance for hepatocellular carcinoma with liver ultrasound and alpha-fetoprotein (AFP) every 6 months, with routine clinical care and management of liver disease as appropriate. (From the algorithm figure; the print section heading has no text of its own.)"}]},
{id:"hep-b-emtct",name:"Elimination of mother to child transmission (EMTCT) of hepatitis B",sec:"Hepatitis B and C",aud:"adult",src:"EDLIZ 2025, Chronic Hepatitis B and C chapter",blocks:[
 {t:"h",x:"General notes"},
 {t:"p",x:"Most of the global burden of chronic hepatitis B can be attributed to peripartum mother to child transmission (MTCT) of HBV or through horizontal transmission in early childhood from infected children and adults. Infection at the time of, or shortly after birth leads to a high rate of chronicity with resultant liver complications of cirrhosis and hepatocellular carcinoma in adulthood. The greatest risk of developing chronic infection is 90% following MTCT (up to 6 months of age) and decreases to approximately 30% between the ages of 6 months and 5 years. High coverage of the timely hepatitis B birth dose and completion of the infant hepatitis B vaccine series are the most important interventions for reducing MTCT, and early childhood transmission of HBV. In addition, universal HBsAg screening of pregnant women alongside HIV and syphilis testing is recommended combined with use of antiviral prophylaxis to further prevent HBV MTCT."},
 {t:"h",x:"Testing"},
 {t:"p",x:"All pregnant women should be tested for HIV, syphilis and hepatitis B surface antigen (HBsAg) at booking, ideally in the first trimester of pregnancy. HBV can be diagnosed by using a rapid diagnostic test to detect HBsAg. HBV DNA nucleic acid test (NAT) and HBeAg are useful to identify women at high risk of MTCT of hepatitis B. However, access to HBV DNA viral load or HBeAg serology testing among HBsAg-positive pregnant women to determine eligibility for antiviral prophylaxis may be limited. Where HBV DNA viral load and HBeAg are not available, universal TDF prophylaxis is recommended to reduce the risk of MTCT."},
 {t:"h",x:"Treatment"},
 {t:"p",x:"All pregnant women who test HBsAg positive should be assessed first for eligibility for long-term treatment for their own health (see chronic hepatitis B in the general population). Pregnant women who are not eligible for long term treatment for their own health should receive antiviral prophylaxis as follows:"},
 {t:"g",ad:1,title:"Universal protocol (where HBV DNA viral load and HBeAg are not available):",rows:[R("tenofovir disoproxil fumarate (TDF)","po","B V","300mg","once a day","6 months [from at least 28 weeks of pregnancy until completion of the infant HBV vaccination series, i.e. at 14 weeks post-delivery]")],note:"If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"g",ad:1,title:"Preferred protocol (where HBV DNA viral load and HBeAg are available):",rows:[R("tenofovir disoproxil fumarate (TDF)*","po","B V","300mg","once a day","6 months [similar to universal protocol]")],note:"*Give only to HBsAg-positive pregnant women with HBV DNA ≥200 000 IU/mL or positive HBeAg. If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"g",ad:1,title:"Alternative prophylaxis regimens (used when single drug formulations are not available):",rows:[R("tenofovir / lamivudine","po","C V","300/300mg","once a day","6 months [similar to universal protocol]"),"OR",R("tenofovir / emtricitabine","po","C V","300/200mg","once a day","6 months [similar to universal protocol]")],note:"If resources permit, determine the creatinine clearance whenever TAF (or TDF) is prescribed."},
 {t:"p",x:"Mothers have a potential risk of exacerbation or postpartum flare after antiviral therapy ends, therefore they need to be monitored carefully postpartum after discontinuing TDF."},
 {t:"h",x:"Immunisation of the infant"},
 {t:"ul",x:["A timely birth dose followed by three additional doses is the intervention that leads to the greatest impact at the lowest cost.","All infants should receive their first dose of hepatitis B vaccine as soon as possible after birth, preferably within 24 hours.","The birth dose should be followed by three additional doses at 6, 10 and 14 weeks to complete the hepatitis B primary immunisation series."]}]},
{id:"imm-general",name:"Immunisation: general notes, cold chain and safety",sec:"Immunisation",src:"EDLIZ 2025, Immunisation chapter",blocks:[
 {t:"h",x:"General notes"},
 {t:"p",x:"The terms immunisation and vaccination are used interchangeably in this chapter. Further information on immunisation may be found in the Manual for the Zimbabwe Expanded Programme on Immunisation (ZEPI). Information relating to rabies can be found in the chapter on tropical diseases. More vaccines have been introduced since the last version of EDLIZ and additional vaccines are expected to be introduced before next review. Vaccines currently under consideration are hepatitis B birth dose, malaria and hexavalent. (Note: the hepatitis B birth dose is now part of the official immunisation schedule, as in the schedule below.) Vaccines used in response to outbreaks such as COVID-19, oral cholera, novel oral polio type 2 (nOPV2) are not discussed in this section."},
 {t:"h",x:"Diseases preventable by immunisation"},
 {t:"ul",x:["Diphtheria","Measles","Rubella","Hepatitis B","Pertussis (whooping cough)","Poliomyelitis","Rotavirus diarrhoea","Rabies (see Tropical diseases section)","Tetanus","Tuberculosis","Typhoid","Malaria","Haemophilus influenzae type b","Cancer caused by human papillomavirus infection"]},
 {t:"p",x:"There are other vaccine preventable diseases, for example anthrax, that are not yet provided under the national immunisation programme."},
 {t:"h",x:"Cold chain"},
 {"t": "m", "title": "Vaccine storage temperatures", "li": 0, "cols": ["Level", "Duration", "Temperature"], "rows": [[["**Central"], ["3–6 months"], ["bOPV and Rotavac: −25°C to −15°C", "All other antigens in schedule: +2°C to +8°C"]], [["**Provincial"], ["3 months"], ["bOPV and Rotavac: −25°C to −15°C", "All other antigens in schedule: +2°C to +8°C"]], [["**District"], ["2 months"], ["bOPV and Rotavac: −25°C to −15°C", "All other antigens in schedule: +2°C to +8°C"]], [["**Service delivery points"], ["2 months"], ["All vaccines: +2°C to +8°C"]], [["**Transit"], ["12 hours"], ["All vaccines: +2°C to +8°C"]]], "note": "At service delivery points all vaccines should be kept at +2°C to +8°C. bOPV and Rotavac can be kept at +2°C to +8°C at district level if freezing capacity is limited."},
 {t:"h",x:"Open multi-dose vials"},
 {t:"p",x:"Multi-dose vials of bOPV, PCV 13, IPV, pentavalent, DTP, and Td vaccines, from which one or more doses of vaccine have been removed during a static immunisation session, may be used in subsequent immunisation sessions for up to a maximum of 28 days, provided that all of the following conditions are met:"},
 {t:"ul",x:["the expiry date has not passed","the vaccines are stored under appropriate cold chain conditions","the vaccine vial septum has not been submerged in water","aseptic technique has been used to withdraw all doses","the vaccine vial monitor (VVM) has not reached the discard point","the vial has been marked with the date-of-opening and discard date","the label is still visible"]},
 {t:"p",x:"Multi-dose vials of vaccine opened at outreach sites must be discarded at the end of the session. Multi-dose vials of BCG and measles vaccine (which are reconstituted before use) must be discarded at the end of each immunisation session or at the end of 6 hours, whichever comes first, or as per manufacturer’s instructions."},
 {t:"h",x:"Contraindications to vaccination"},
 {t:"ul",x:["BCG vaccine should not be given to a child with symptomatic HIV infection.","A subsequent dose of a vaccine should not be given to a child who severely reacted to a previous dose.","A child with an evolving neurological disease such as uncontrolled epilepsy or progressive encephalopathy should not be given pentavalent and DTP.","Caution should be exercised when vaccinating anyone who has a bleeding disorder or who is taking anticoagulant therapy. Bleeding may occur after an intramuscular injection in these individuals.","All vaccines should be postponed if an individual is suffering from acute severe febrile illness. However, a minor infection such as a cold is not a contraindication for vaccination."]},
 {t:"h",x:"Adverse events"},
 {t:"p",x:"All adverse events following immunisation (AEFI) should be reported using the “Adverse Events Following Immunisation” (AEFI) reporting form (Annex: AEFI reporting form). Refer to the AEFI surveillance guidelines for more information."}]},
{id:"imm-schedule",name:"Immunisation schedule for children (ZEPI)",sec:"Immunisation",src:"EDLIZ 2025, Immunisation chapter",blocks:[
 {t:"p",x:"The ZEPI schedule is as shown in the table below. This schedule is the only schedule to be used in Zimbabwe. Ages given are minimum ages for each vaccination. Children should receive doses at these stated ages or at the first contact after reaching that age, as indicated in the catch-up vaccination schedule."},
 {t:"p",x:"If a vaccine dose is given at less than the recommended interval, it should not be counted as a valid dose and therefore should be repeated at the appropriate interval from the previous dose. This applies to vaccines given during campaigns such as child health days, national immunisation days or in reaction to outbreaks of vaccine preventable diseases. Always check the dosage instructions in the manufacturer’s information supplied with the vaccine, as the strength may vary between manufacturers."},
 {t:"ul",x:["Always remember to record the batch number of the vaccine on the child’s health card when entering the date of immunisation.","Always ensure that the emergency box is available and is stocked with appropriate emergency medicines."]},

 {t:"h",x:"Hospital visit/admission policy on immunisation"},
 {t:"p",x:"To reduce nosocomial transmission, measles vaccine should be given on admission to all children six months to 15 years. This admission dose must be recorded on the graph side of the child health card corresponding with the age at which it was given and written vertically. If the child is 9 months and receives the first dose on admission this is charted on the appropriate section of the card. Health workers should ascertain the vaccination status for all children visiting health facilities including those without a child health card and give all due and overdue antigens according to the routine and catch-up vaccination schedules. Children who are very ill on admission should be vaccinated as soon as their condition has improved."}]},

{id:"amr-principles",name:"Antimicrobial use: general guidelines and principles",sec:"Antimicrobial guidelines",src:"EDLIZ 2025, Antimicrobial Treatment and Prophylaxis Guidelines",blocks:[
 {t:"p",x:"Antimicrobial medicines are the most over-used class of medicines worldwide including Zimbabwe. It has become a global concern that we are reaching the post-antimicrobial (post antibiotics, post viral, post parasitic and post fungal) era where common infections are no longer treatable with common antimicrobials. Apart from the unnecessary cost and risk to the patient, overuse encourages development of resistant organisms, a problem that has proven serious and expensive in many countries. In many cases antimicrobial medicines are given “blindly” or “empirically”, based on clinical suspicion without microbiological confirmation. Antimicrobials should be used guided by antibiogram, only in patients with likely microbial illness requiring systemic therapy. Positive identification of the pathogen and antimicrobial susceptibility testing should be sought wherever possible as this will result in improved and more cost-effective treatment outcome."},
 {t:"h",x:"Principles of antimicrobial use"},
 {t:"ul",x:["Choice of agent should be based on factors such as spectrum of activity, anticipated efficacy, safety, previous clinical experience, cost, and potential for resistance. These are influenced by the severity of illness and whether the medicine is to be used for prophylaxis, empirical therapy or therapy directed by identification of one or more pathogens.","Prophylactic therapy should be restricted to the use of a limited range of agents of proven efficacy in invasive procedures with a high risk of infection or where the consequences of infection are disastrous. Most surgical prophylaxis should be parenteral and commence just before the procedure, continuing for no more than one or two doses after the end of the operation. The aim is to achieve high plasma and tissue levels at the time that contamination would most likely occur, i.e. during the surgical procedure.","Empirical therapy should be based on local epidemiological data on potential pathogens and their patterns of antimicrobial susceptibility. For bacteria, appropriate specimens for Gram stain, culture and sensitivity testing should be obtained before commencing antibiotic therapy and similar precautions should be applied to antiviral, antifungal/yeasts, and antiparasitic. Maintaining a database of susceptibility profiles is useful as a guide for appropriate choice of empirical antimicrobial therapy which is based on local, regional and national patterns.","Directed antimicrobial therapy for proven pathogens should include the most effective, least toxic, narrowest spectrum agent available. This practice reduces the problems associated with broad-spectrum therapy, that is, selection of resistant micro-organisms and super-infection.","Choice of route and administration should be determined by the site and severity of infection. For mild to moderate infections the oral route is preferred, whilst the parenteral route should only be used for severe infections. It is also important that topical antimicrobial therapy be restricted to a few proven indications, for example eye infections, because of the capacity of most agents to select for resistant micro-organisms and to cause sensitisation.","Antimicrobial combinations have few indications. These include: to extend the spectrum of cover, for example in empirical therapy or in mixed infections; to achieve a more rapid and complete bactericidal effect, for example in enterococcal endocarditis; to prevent the emergence of resistant micro-organisms, for example in the therapy of tuberculosis."]},
 {t:"p",x:"Note: Doses given are for a 70 kg adult with normal hepatic and renal function. Paediatric doses are given in the chapter on Paediatric Conditions. In the elderly, as a general rule, doses given could be lower than the recommended adult dose (see the chapter on Medicines and the Elderly)."},
 {t:"h",x:"Access, Watch, Reserve principles (AWaRe)"},
 {t:"p",x:"In the case of antibiotics and other antimicrobials, their careful use is vital to maintaining their effectiveness. To improve the quality of hospital antimicrobial use, the selection of antibiotics was guided by the WHO Essential Medicines List Access, Watch, and Reserve (AWaRe) classification."},
 {t:"ul",x:["Access: antibiotics that have a narrow spectrum of activity, generally low resistance potential and a good safety profile in terms of side-effects. These antibiotics are often recommended as empiric first or second-choice treatment options for common infections and should always be available, affordable and quality-assured.","Watch: broader-spectrum antibiotics, recommended as first choice options for patients with more severe clinical presentations or for infections where the causative pathogens are more likely to be resistant to Access antibiotics, for instance upper urinary tract infections. Most of the “highest-priority critically important antimicrobials” for human medicine and veterinary use. These antibiotics are recommended only for specific, limited indications.","Reserve: antibiotics that should only be used as a last resort when all other antibiotics have failed. These are antibiotics used to treat multidrug-resistant infections."]},
 {t:"h",x:"Notes on specific antimicrobials"},
 {t:"ul",x:["Some antimicrobials are becoming ineffective because micro-organisms are resistant to them. Antimicrobial susceptibility testing should be sought whenever possible. Patients should be counselled to complete courses even when they feel better. For some common infections at primary health care level, mild cases can be safely treated symptomatically with no antimicrobial use.","Oral amoxicillin should be used in preference to oral ampicillin because of its better absorption, efficacy and cost-effectiveness. However, the same is not true of the injectable preparations because they have similar efficacy.","Chloramphenicol must be limited to serious infections such as Klebsiella pneumonia, Haemophilus influenzae infections, difficult to treat pelvic inflammatory disease and brain abscesses and not used indiscriminately in the treatment of fever. An exception to this is when there is need for a broad-spectrum antibiotic and it is unavailable. Furthermore, the oral preparation should be used judiciously as it is more prone to cause aplastic anaemia than the injectable formulation.","Dosage of gentamicin, streptomycin, and kanamycin (aminoglycosides) must be carefully adjusted for weight and renal function. Careful monitoring of serum urea and/or creatinine and checking for complaints of auditory or vestibular symptoms (adverse effects) is necessary. An exception exists for duration less than 3 days use or when lower doses are used.","The use of last resort or last line antibiotics (e.g. imipenem, meropenem, vancomycin, amikacin, piperacillin + tazobactam) is subject to the presence of antimicrobial/microbiologic sensitivity (AST) testing results.","Patients with penicillin allergy (that is, a pruritic rash, angioedema, or anaphylaxis) must not be given penicillin. Rashes occurring after 48 hours are rarely due to allergy and are not a contraindication to further use. (Note that penicillins have cross-reactivities with other medicines including cephalosporins and carbapenems.) In such instances macrolides are suitable alternatives. Patients with a history of cotrimoxazole allergy may be offered desensitisation (see the chapter on HIV-related diseases)."]}]},
{id:"amr-fever",name:"Fever of unknown origin and antibiotic prophylaxis",sec:"Antimicrobial guidelines",src:"EDLIZ 2025, Antimicrobial Treatment and Prophylaxis Guidelines",blocks:[
 {t:"h",x:"Pyrexia/fever of unknown origin"},
 {t:"p",x:"Pyrexia/fever of unknown origin is a common presenting symptom for all ages. In adults there usually would be some localising signs or symptoms, which point to a likely focus of infection."},
 {t:"p",x:"If after careful examination no clear focus of infection is identified, the following should be considered in a previously healthy patient admitted from the community with fever of less than two weeks’ duration:"},
 {t:"ul",x:["Viral infections (frequently resolve after 4–5 days, or may be the prodromal phase, for example hepatitis)","Malaria","Typhoid","Urinary tract infection","Bacteraemia","HIV related causes of fever"]},
 {t:"p",x:"If HIV infection is suspected see guidelines in the chapter on HIV-related diseases. If the patient’s general condition is satisfactory, it is reasonable to withhold antibiotics while carrying out a few basic investigations: urinalysis (dipstick), urine microscopy, haemoglobin, white cell count and differential and malaria parasites, which are all within the capabilities of, for example, a district hospital laboratory. If possible, send a blood culture to the nearest microbiology diagnostic laboratory (NMRL and the TB laboratories). Liver function tests and urine testing for bile products are appropriate if hepatitis is suspected. If no improvement occurs after 3–4 days, and there is still no identifiable focus of infection, and there is no evidence of malaria (at least two negative blood films), the subsequent management of the patient should be guided by further results of the investigations."},
 {t:"p",x:"In those patients who present very ill or toxic, or whose condition deteriorates, antibiotic therapy should be initiated on the basis of clinical suspicion (typhoid: ciprofloxacin, staphylococcal septicaemia: cloxacillin, anaerobes: metronidazole, etc.)."},
 {t:"g",ad:1,title:"Recommended “blind” therapy for septicaemia with no identifiable source:",rows:[R("ceftriaxone","iv","C V","2g","once a day","7–14 days"),"AND",R("gentamicin","iv","C V","5mg/kg","once a day","max 2 weeks")]},
 {t:"g",ad:1,title:"Alternative:",rows:[R("chloramphenicol","iv","B V","1g","4 times a day","review"),"AND",R("gentamicin","iv","C V","5mg/kg","once a day","max 2 weeks")]},
 {t:"h",x:"The use of antibiotics for infection prophylaxis"},
 {t:"p",x:"There are some instances where the use of prophylactic antibiotics is well established. However, this often consumes a disproportionate amount of all antibiotics used in the hospital setting and consideration to their appropriate use must be given. Prophylactic antibiotic use must be within accepted principles and guidelines."},
 {t:"p",x:"General recommendations: use the appropriate medicine (see below); give as a single dose where possible; repeat when the procedure lasts longer than 3–4 hours; give intravenously 10–15 minutes before incision, or orally 1–2 hours before incision."},
 {t:"h",x:"Surgical prophylaxis"},
 {t:"p",x:"NB: There is a need for the recommendations to be guided by sensitivity patterns. It is important to establish a Healthcare Associated Infection Surveillance system for monitoring of sensitivity or resistance patterns."},
 {t:"g",ad:1,title:"Vaginal operations:",rows:[R("chloramphenicol","iv","B V","1g","single dose","")]},
 {t:"g",ad:1,title:"Caesarean section:",rows:[R("ceftriaxone","iv","C V","1g","single dose","")]},
 {t:"g",ad:1,title:"Hysterectomy, or colorectal surgery e.g. appendicectomy:",rows:[R("ceftriaxone","iv","C V","1g","single dose",""),"AND",R("gentamicin","iv","C V","5mg/kg","single dose","")]},
 {t:"g",ad:1,title:"If signs of infection after operation, give:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","7 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","7 days")]},
 {t:"ul",x:["For treatment of subacute bacterial endocarditis see the Cardiovascular chapter.","For treatment of contacts in meningococcal meningitis, give the following:"]},
 {t:"g",ad:1,title:"Give as soon as diagnosis is made in the index case:",rows:[R("ceftriaxone","im","C V","250mg","single dose","")],note:"Print note: this table sits under “For treatment of contacts in meningococcal meningitis” and is headed “as soon as diagnosis is made in the index case”."}]},
{id:"ipc-standard",name:"Infection prevention and control: standard precautions",sec:"Infection prevention and control",src:"EDLIZ 2025, Basic Infection Prevention and Control Measures",blocks:[
 {t:"h",x:"General notes"},
 {t:"p",x:"Transmission of infections in healthcare facilities can be prevented and controlled through the application of basic infection prevention and control practices. The 2 tiers or categories of infection control prevention and practices are standard precautions and transmission-based precautions. The goal of this two-tier system is to minimise the risk of infection, the spread of antimicrobial resistance and maximise safety level within our healthcare facilities. These precautions should be embedded in a facility-based infection prevention and control programme (see National Infection Control Guidelines)."},
 {t:"p",x:"It is important to educate healthcare workers not only on what to do but why it is important to do it, and to emphasise outcomes which help healthcare workers to see how their routine duties interact with the infection control system."},
 {t:"ul",x:["Standard precautions (previously known as universal precautions): must always be applied to all patients, regardless of diagnosis or infectious status.","Transmission-based precautions: specific to modes of transmission and include airborne, droplet and contact precautions."]},
 {t:"h",x:"Standard precautions"},
 {t:"p",x:"Treating all patients in the healthcare facility with the same basic level of “standard” precautions involves work practices that are essential to provide a high level of protection to patients, healthcare workers and visitors. These precautions include:"},
 {t:"ul",x:["Hand hygiene (hand washing, hand antisepsis)","Use of personal protective equipment when handling blood, excretions and secretions","Appropriate handling of patient care equipment and soiled linen","Prevention of needlestick/sharp injuries","Environmental cleaning and spills management","Appropriate, safe handling of waste"]},
 {t:"h",x:"Hand hygiene"},
 {t:"p",x:"Appropriate hand hygiene can minimise micro-organisms acquired on the hands by contact with body fluids and contaminated surfaces. Hand hygiene breaks the chain of infection transmission and reduces person to person transmission. It is the simplest and most cost-effective way of preventing the transmission of infection and reducing the incidence of healthcare associated infections. It should be performed before and after touching a patient, before an aseptic procedure, after touching a patient’s surroundings and after body fluid exposure."},
 {t:"ul",x:["Hand washing: usually limited to hands and wrists; the hands are washed for 40–60 seconds with soap and water.","Hand antisepsis/decontamination: decontaminate hands with a waterless alcohol-based hand gel or rub for 20–30 seconds. This is appropriate for hands that are not visibly soiled.","Surgical hand antisepsis: removes or destroys transient micro-organisms and confers a prolonged effect. The hands and forearms are washed thoroughly with an antiseptic soap for 2–3 minutes and dried with a sterile towel. This is required before performing invasive procedures."]},
 {t:"p",x:"NB: Hands should be dried with single use towels or disposable paper towels."},
 {t:"h",x:"Personal protective equipment (PPE)"},
 {t:"p",x:"Types: scrub suit or gowns, plastic aprons, boots or shoe covers, caps, protective eye wear, gloves."},
 {t:"h",x:"Gloves"},
 {t:"p",x:"Gloves reduce the incidence of hand contamination with infectious material, which in turn reduces the opportunity for personnel to become infected and/or the organisms to spread to other personnel and/or patients. Gloves should not replace hand hygiene. Gloves are to be worn when touching blood, all body fluids, all body secretions and all body excretions. Gloves should be removed before touching clean items (e.g. phone, door knobs or patients’ charts). Perform hand hygiene after removing gloves."},
 {t:"ul",x:["Use gloves when there is potential exposure to blood, body fluids, excretions, or secretions.","Change gloves between patients, and between procedures on the same patient when gloves become soiled.","Remove gloves before leaving the patient’s bedside and decontaminate hands immediately with 70% alcohol hand rub solution.","Discard gloves after attending to each patient."]},
 {t:"h",x:"Boots/shoe covers and caps"},
 {t:"ul",x:["Boots and shoe covers protect the wearer from splashes of blood, body fluids, secretions, and excretions. Shoe covers should be disposable and waterproof. Waterproof boots should be washable.","Disposable and waterproof caps that completely cover the hair are used when splashes of blood and body fluids are expected."]},
 {t:"h",x:"Masks and respirators"},
 {t:"p",x:"A surgical mask protects healthcare providers from inhaling respiratory pathogens transmitted by the droplet routes. It is particularly designed to protect against large respiratory droplets and prevent the wearer from spreading respiratory secretions. It prevents the spread of infectious diseases such as COVID-19, influenza and meningococcal disease (meningococcal meningitis)."},
 {t:"p",x:"An N95 respirator protects healthcare providers from inhaling respiratory pathogens that are transmitted via both the airborne and droplet route. This helps to prevent the spread of infectious diseases such as TB or MDR-TB, chickenpox (varicella), measles or rubella."},
 {t:"p",x:"NB: In order to prevent the spread of infection, the appropriate mask/respirator should be worn by healthcare providers and visitors when attending to a patient suffering from a communicable disease that is spread via the airborne or droplet route. The patient with a communicable disease via the droplet or airborne route should wear a surgical mask when being transferred to other departments or hospitals or in an isolation room to prevent spread of infection. Disposable masks are for single use only and should be discarded after use."},
 {t:"ul",x:["Masks/respirators should not be worn around the neck.","Masks/respirators cannot be worn with beards or unshaven faces.","Respirators should be “fit-tested” to ensure maximum protection, or at least “fit-checked” before use to ensure complete seal for effective filtering of micro-organisms."]},
 {t:"h",x:"Gowns and plastic aprons"},
 {t:"ul",x:["Gowns made of impervious material are worn to protect the wearer’s clothing/uniform from possible contamination with micro-organisms and exposure to blood, body fluids, secretions and excretions. Use a gown once for one patient and discard. Healthcare workers should remove gowns before leaving the unit.","Lab coats or scrub suits should not be viewed as an effective barrier to blood or other body fluids. Use of fluid resistant gowns, impervious gowns or plastic aprons is highly recommended where soiling of clothes with blood or other potentially infectious material will likely occur.","A plastic apron protects the wearer’s uniform from contact with contaminated body fluids. The inside of the apron is considered clean, the outside is considered contaminated. The neck of the apron is clean because that part is not touched with contaminated hands. Wash hands thoroughly after removing the apron."]},
 {t:"h",x:"Protective eyewear/goggles"},
 {t:"ul",x:["Should always be worn during patient contact where there is a possibility that patients’ body fluids may splash or spray onto the care giver’s face/eyes (e.g. during suctioning, intubation, endoscopy and cleaning of instruments used for these procedures).","During all dental, surgical, laboratory and post-mortem procedures.","Full face shields may also be used to protect the eyes and mouth of the healthcare worker in high risk situations.","Re-usable goggles should be washed and decontaminated after removal and in between use.","All protective equipment should be removed prior to leaving the work area."]},
 {t:"h",x:"Needles, sharp instruments and other devices"},
 {t:"p",x:"All equipment contaminated with blood or other body fluids should be handled with special care. Keep in mind these recommendations:"},
 {t:"ul",x:["Never recap needles.","Never bend or break needles.","Never remove needles from disposable syringes.","Immediately dispose of all disposable syringes and needles, scalpel blades and other sharp instruments, after use, in a labelled leak-proof puncture resistant container.","Never over-fill the container. Seal and dispose when the sharps container is ¾ full."]}]},
{id:"ipc-transmission",name:"Infection prevention and control: transmission-based precautions",sec:"Infection prevention and control",src:"EDLIZ 2025, Basic Infection Prevention and Control Measures",blocks:[
 {t:"p",x:"These are designed to supplement standard precautions or protocols and must always be used in conjunction with standard precautions isolation techniques. Transmission-based precautions provide extra safety by facilitating a concerted effort to control the spread of specific pathogens. Whilst mostly used for diagnosed infection, they are useful when a specific diagnosis is suspected. Transmission-based precautions are divided into 3 basic categories: contact, droplet and airborne."},
 {"t": "m", "title": "Transmission-based precautions", "li": 0, "cols": ["Category", "Purpose and examples", "Precautions include"], "rows": [[["**Contact precautions"], ["Reduces the risk of transmission of organisms from an infected or colonised patient through direct or indirect contact (e.g. herpes simplex, haemorrhagic fever virus, Ebola, multi-drug-resistant bacteria)."], ["Hand gloving; patient placement; hand washing; use of aprons and gowns; patient care equipment; patient transport."]], [["**Droplet precautions"], ["Reduces the risk of nosocomial transmission of pathogens spread by large droplet particles, usually within a metre (e.g. mumps, diphtheria, Haemophilus influenzae and SARS-CoV-2). Droplets may be expelled during sneezing, coughing and talking. Teach cough hygiene, i.e. cover the mouth when coughing."], ["Patient placement; respiratory protection; patient transportation."]], [["**Airborne precautions"], ["Designed to provide protection from infectious aerosols which may be suspended in the air for an extended period of time. Used in addition to standard precautions for patients known or suspected to be infected with micro-organisms transmitted by the airborne route, e.g. TB, chickenpox, measles."], ["Respiratory protection; patient placement; patient transportation."]]]}]},
{id:"hrd-general",name:"HIV-related disease: general guidelines and cotrimoxazole prophylaxis",sec:"HIV-related disease",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"p",x:"These guidelines aim to encourage a consistent clinical management approach and draw a balance between possible interventions and available resources. Further information is available in the Guidelines for HIV Prevention, Testing and Treatment in Zimbabwe."},
 {t:"h",x:"General notes"},
 {t:"p",x:"All patients should be offered HIV counselling and testing services (HTS). A documented proof of a positive HIV test result should be availed before a patient is enrolled into the Chronic HIV Care programme. For notes on the management of HIV infection and related conditions in children, see also “Paediatric HIV infections”."},
 {t:"p",x:"The goal is to provide the earliest possible diagnosis of HIV infection, diagnose opportunistic infections (OIs) promptly and implement therapeutic measures that will extend and improve the quality of life and prevention of infections post diagnosis of HIV. The following are fundamental to the management of HIV related illness, but cannot be covered fully here:"},
 {t:"ul",x:["Counselling: pre-testing, post-test, crisis/support; including Enhanced Adherence Counselling (EAC)","Health education for prevention of further transmission of HIV and positive living","Maintenance of good nutrition, vitamin and mineral supplements","Prevention, diagnosis and treatment of OIs","Consistent use of antiretroviral therapy"]},
 {t:"h",x:"Clinical presentation"},
 {t:"p",x:"Clinical presentation in HIV infection varies greatly, from asymptomatic infection in a fit individual to life-threatening conditions. Most infected persons remain healthy for a varying period, often many years, but may transmit the virus to others during unprotected sex and during pregnancy and breastfeeding. Children however experience rapid disease progression if treatment is delayed."},
 {t:"h",x:"Cotrimoxazole prophylaxis"},
 {t:"p",x:"Cotrimoxazole (trimethoprim-sulfamethoxazole) prophylaxis provides protection against some but not all severe bacterial infections and has been shown to prolong life and reduce hospital admissions. Cotrimoxazole prophylaxis should be given to the following:"},
 {"t": "m", "title": "Who should receive cotrimoxazole prophylaxis", "li": 0, "cols": ["Population", "Criteria for initiating cotrimoxazole", "Criteria for discontinuing cotrimoxazole"], "rows": [[["**Adults (including pregnant women) living with HIV"], ["WHO clinical stage 2, 3 and 4", "CD4 cell count <350 cells/mm³"], ["Stop for those who are clinically stable, with evidence of immune recovery (CD4 >350 cells/mm³) and/or suppression of viral load on ART"]], [["**Children and adolescents living with HIV"], ["Initiate for everyone regardless of WHO clinical stage or CD4 cell count.", "As a priority: initiate for everyone younger than five years regardless of WHO clinical stage or CD4 cell count; initiate for everyone five years and older with severe advanced HIV disease (WHO clinical stage 2, 3 or 4) or CD4 cell count <350 cells/mm³."], ["Continue until adulthood, then use adult criteria for discontinuing"]], [["**HIV-exposed infants"], ["Initiate for everyone starting at 4–6 weeks after birth"], ["Until the risk of HIV transmission ends (up to the end of the breastfeeding period), and HIV infection is excluded with an age-appropriate test"]], [["**People living with HIV and TB"], ["Initiate for everyone with active TB regardless of CD4 cell count"], ["Until the criteria for discontinuation for adults or children are met"]]]},
 {t:"p",x:"Cotrimoxazole prophylaxis must be stopped when patients become clinically stable with evidence of immune recovery (CD4 >350 cells/mm³) and/or are virally suppressed below 1000 copies/ml for those patients who have been on ART for at least 6 months."},
 {t:"g",ad:1,title:"Prophylaxis dosing for cotrimoxazole in adult patients:",rows:[R("cotrimoxazole","po","C V","960mg","once a day","")],note:"Give until CD4 >350 cells/mm³ and/or VL is less than 1000 copies per ml for those who have been on ART for at least 6 months."},
 {t:"h",x:"Cotrimoxazole prophylaxis in children"},
 {t:"p",x:"Give once daily orally according to the following table. Duration: until adulthood."},
 {"t": "m", "title": "Cotrimoxazole (sulfamethoxazole/trimethoprim) prophylaxis in children, once a day", "li": 0, "cols": ["Age or weight", "Recommended daily dose", "Suspension (200mg/40mg per 5ml)", "Paediatric tablets (100mg/20mg)", "Adult tablet (400mg/80mg)"], "rows": [[["<6 months or <5 kg"], ["100mg/20mg"], ["2.5 ml"], ["1"], ["¼"]], [["6 months to <6 years or 5–15 kg"], ["200mg/40mg"], ["5 ml"], ["2"], ["½"]], [["6–14 years or >15–30 kg"], ["400mg/80mg"], ["10 ml"], ["4"], ["1"]]]},
 {t:"h",x:"If allergic to cotrimoxazole, try desensitisation"},
 {t:"p",x:"Desensitisation can be offered rapidly or over a longer period of time. Do not desensitise anyone who has had an anaphylactic reaction to cotrimoxazole or a severe skin rash such as Stevens-Johnson syndrome. Desensitisation should be carried out under clinical specialist supervision."},
 {t:"g",ad:1,title:"Prophylaxis alternative to cotrimoxazole (or if desensitisation is not possible) in adult patients:",rows:[R("dapsone","po","B V","100mg","once a day","")]},
 {t:"h",x:"TB/HIV co-infection"},
 {t:"p",x:"HIV care settings should implement the following TB control measures: intensified TB case finding; infection prevention and control at all clinical encounters; TB preventive therapy (TPT)."},
 {t:"ul",x:["All PLHIV should be routinely screened for TB at every encounter with a health care worker, using a four-symptom checklist (current cough, night sweats, loss of weight, and fever) and/or a CXR (where available) to timely assess their eligibility to be commenced on TB preventive therapy or treatment.","Among children younger than 10 years who are living with HIV, screening for TB disease should be conducted at every visit using a symptom screen including any one of the symptoms of current cough, fever, night sweats and poor weight gain. Consider client history such as close contact with a person with TB disease.","All PLHIV with a positive history to any one of the symptoms on the checklist and/or having an abnormal CXR should be classified as presumptive TB case and MUST have one sputum sample collected and submitted for TB investigation using the Xpert MTB/Rif assay as the preferred diagnostic test.","All PLHIV who have advanced HIV disease should have the urine lateral flow lipoarabinomannan assay (LF-LAM) to assist in TB diagnosis.","Other non-sputum samples such as nasogastric lavage, nasopharyngeal aspirates, and stool for children under 5 years as well as organ specific samples can be collected for investigation depending on screening findings. WHO-recommended rapid diagnostic instruments such as Truenat MTB-Rif can be used for initial diagnosis where available."]},
 {t:"h",x:"TB preventive therapy (TPT) in people living with HIV: steps"},
 {t:"ul",x:["1. What is it? Medication to prevent catching tuberculosis (TB) / prevent activating latent TB.","2. Who is eligible? Adults and adolescents including pregnant women living with HIV (pre-ART and on ART); children living with HIV (pre-ART and on ART); adult, adolescent or child contacts of active TB cases.","3. Who should be excluded? Patients who have symptoms and signs suggestive of active TB; patients on treatment for TB; people living with HIV who have received TPT before and are not contacts of active TB cases.","4. When should TPT be taken? PLHIV should take TPT as routine prevention at least once, preferably at the time of HIV diagnosis and ART initiation. Repeat TPT for PLHIV is only recommended if they become a contact of a bacteriologically confirmed TB patient.","5 and 6. Recommended regimens and doses: see the Tuberculosis page “TB prevention and TB preventive therapy”. (The print repeats the same regimen and dose tables in this chapter; they are shown once, in the TB pages.) NOTE: rifapentine dosing starts at 10 kg, limiting its use in younger children. Avoid rifapentine/rifampicin in pregnancy, or in women using hormonal contraceptives (all types)."]},
 {t:"h",x:"7. Children on fixed-dose tablets"},
