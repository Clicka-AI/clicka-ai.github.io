 {"t": "m", "title": "Recommended daily dosage of isoniazid for TPT by weight (6H)", "li": 0, "cols": ["Weight range (kg)", "Dose of INH given (mg)", "Number of 100mg INH tablets per dose (total dose 10mg/kg/day)", "Number of pyridoxine 50mg tablets per day"], "rows": [[["≤5"], ["50"], ["½ tablet"], ["¼"]], [["5.1–9.9"], ["100"], ["1 tablet"], ["¼"]], [["10–13.9"], ["150"], ["1½ tablets"], ["¼"]], [["14–19.9"], ["200"], ["2 tablets"], ["½"]], [["20–24.9"], ["250"], ["2½ tablets"], ["½"]], [["≥25"], ["300"], ["3 tablets or one adult tablet"], ["½"]]]},
 {"t": "m", "title": "Recommended daily dosage of rifampicin and isoniazid preventive therapy (3RH)", "li": 0, "cols": ["Weight band", "Number of RH 75/50 tablets per dose"], "rows": [[["4–7.9 kg"], ["1"]], [["8–11.9 kg"], ["2"]], [["12–15.9 kg"], ["3"]], [["16–24.9 kg"], ["4"]]]},
 {t:"p",x:"Note: Liver toxicity symptoms should be apparent. Anyone on TPT who develops poor appetite, nausea, or vomiting should be assumed to have liver toxicity until proven otherwise and should be referred to hospital for same day admission to investigate possible liver toxicity."}]},
{id:"hrd-common",name:"HIV-related conditions: lymphadenopathy, candidiasis, diarrhoea, wasting",sec:"HIV-related disease",aud:"adult",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"h",x:"Persistent generalised lymphadenopathy (PGL)"},
 {t:"p",x:"Definition: lymph nodes >1.5 cm in two or more areas, not due to another cause such as TB and persisting for 1 month or more. Should be started on ART but exclude other causes of PGL, particularly TB, Kaposi’s sarcoma, lymphomas or syphilis."},
 {t:"h",x:"Oral and oesophageal candidiasis (thrush)"},
 {t:"p",x:"Refer to the chapter on Common Oral Conditions. Candida infections are commonly encountered in patients with HIV infection. Oral thrush may precede AIDS but is a sign of waning immunity that signals the development of AIDS. Oesophageal thrush is an indicator of more severe cellular immunodeficiency."},
 {t:"p",x:"CAUTION: Neither of these conditions occur exclusively in patients with HIV infection. For example, oral thrush may follow treatment with broad spectrum antibiotics or steroids or be associated with any other debilitating disease."},
 {t:"h",x:"Diarrhoea: acute"},
 {t:"p",x:"Definition: three or more liquid stools daily for 2 to 14 days in patients with symptomatic HIV infection. Management of diarrhoea should be broadly along the same lines as that described in the chapter on Gastrointestinal Conditions."},
 {t:"p",x:"Note: Antidiarrhoeals should NOT be used in the initial treatment of acute diarrhoea, especially in children or with bloody diarrhoea cases. If there is no improvement after 5 days, attempt to identify the pathogen through stool microscopy, culture and sensitivity tests then treat according to the result."},
 {t:"h",x:"Diarrhoea: chronic"},
 {t:"p",x:"Definition: three or more liquid stools daily continuously or episodically for more than 1 month in patients with symptomatic HIV infection."},
 {t:"ul",x:["Assess for dehydration, malnutrition, and check electrolytes for hypokalaemia.","Rehydrate as required, maintain nutrition.","Initially treat diarrhoea with blood in stool and/or fever as acute diarrhoea.","If diarrhoea (without blood/fever) continues after conservative management for 14 days, and exclusion of common causes of acute diarrhoea, symptomatic antidiarrhoeal treatment may be appropriate."]},
 {t:"g",ad:1,title:"Antidiarrhoeal therapy for persistent diarrhoea:",rows:[R("loperamide","po","C N","4mg stat, then 2mg after every loose stool","as needed","review"),"OR",R("codeine phosphate","po","B V","30–60mg","<4 times a day","7 days")],note:"CAUTION: Only use the above agents if diarrhoea is disabling. Before constipating agents are given, rule out helminth infestation. (The print repeats this table twice; shown once.)"},
 {t:"ul",x:["If diarrhoea continues or recurs within 3 weeks, and no pathogen is identified, repeat microscopy and culture and sensitivity.","If there is weight loss investigate for concurrent disseminated TB with CXR and urine TB-LAM.","In cases of diarrhoea with fever, bloody and/or mucus; ensure culture and sensitivity testing is conducted."]},
 {t:"g",ad:1,title:"Treatment for refractory diarrhoea despite constipating agents:",rows:[R("ciprofloxacin","po","B V","500mg","2 times a day","7 days"),"AND",R("ceftriaxone","iv","C V","1g","2 times a day","up to 7 days")],note:"Use this regimen if there is no improvement OR in very ill/toxic patients. Admit to hospital and give iv fluids."},
 {t:"g",ad:1,title:"Treatment for bloody diarrhoea:",rows:[R("ciprofloxacin","po","B V","500mg","2 times a day","5 days")]},
 {t:"h",x:"Wasting syndrome (slim disease)"},
 {t:"p",x:"Definition: weight loss of more than 10%, plus either unexplained chronic diarrhoea for more than one month, or unexplained prolonged fever for more than one month. It is important to exclude treatable conditions, especially TB, and to treat them appropriately. A chest X-ray is mandatory and a urine LAM is recommended. Emaciation: encourage a high calorie and protein diet, and add mineral and vitamin supplementation."},
 {t:"g",ad:1,title:"Vitamin and mineral supplementation for emaciated individuals:",rows:[R("nicotinamide","po","B E","50mg","once a day","review"),"AND",R("pyridoxine","po","B E","25–50mg","once a day","review"),"AND",R("thiamine","po","A N","50mg","once a day","review")]},
 {t:"p",x:"Further management: treat according to results of investigations. Keep referrals to a minimum and refer only if an alternative diagnosis is suspected, e.g. malabsorption. Initiate antiretroviral therapy or switch ART medication if there is treatment failure."}]},
{id:"hrd-resp",name:"HIV-related respiratory conditions and Pneumocystis pneumonia (PCP)",sec:"HIV-related disease",aud:"adult",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"p",x:"A multitude of different manifestations of respiratory complications may occur in patients with HIV infection. These include bacterial pneumonias, pulmonary tuberculosis, Pneumocystis jiroveci pneumonia (PCP) and pulmonary Kaposi’s sarcoma. All HIV infected patients should be screened for TB at every visit using the standard TB screening tools."},
 {t:"p",x:"Management depends on the severity of the condition, location and mobility of the patient. Outpatient management in adults is preferred wherever possible. Only severe cases requiring investigations and inpatient admission should be referred for admission. This is particularly true for acute infection (less than 2 weeks) that does not warrant admission. Treat initially as for other respiratory conditions."},
 {t:"g",ad:1,title:"Treatment for mild/moderate respiratory infection (<2 weeks duration):",rows:[R("amoxicillin","po","C V","500mg","3 times a day","7 days"),"OR",R("erythromycin (in penicillin allergy)","po","C V","500mg","4 times a day","7 days"),"OR",R("doxycycline (in penicillin allergy)","po","C V","100mg","2 times a day","7 days"),"OR",R("azithromycin","po","C V","500mg","once a day","3 days")]},
 {t:"g",ad:1,title:"Treatment for severe respiratory infection:",rows:[R("ceftriaxone","iv","C V","*1g","2 times a day","7 days"),"AND",R("cotrimoxazole","po","C V","960mg","once a day","Until CD4 >350 or viral load <1000")],note:"*Use 2g 2 times a day iv if there are features of septicaemia (low BP, tachycardia) or meningitis. A stat dose may be given at primary care level prior to transfer. If severe symptoms, i.e. respiratory distress, cyanosis, tachycardia, hypotension or altered mental state, consider admission and get a chest X-ray. Note: Switch to oral amoxicillin to complete the course as soon as the patient’s condition improves."},
 {t:"h",x:"Pneumocystis jiroveci pneumonia (PCP)"},
 {t:"p",x:"An opportunistic infection caused by Pneumocystis jiroveci. Patients present with progressive shortness of breath and possibly cyanosis with few or no chest signs."},
 {t:"g",ad:1,title:"Treatment for mild/moderate PCP:",rows:[R("cotrimoxazole","po","C V","1920mg","3 times a day","21 days")],note:"For infant or child over 1 month: 10mg/kg (trimethoprim component) every 12 hours for 21 days. Note: the total daily dose may alternatively be given in 3–4 divided doses orally."},
 {t:"g",ad:1,title:"Treatment for PCP with cotrimoxazole allergy:",rows:[R("clindamycin","po","B V","450–600mg","every 6 hours","21 days"),"AND",R("primaquine","po","C V","30mg","once a day","21 days")],note:"Note: first try cotrimoxazole desensitisation under specialist supervision."},
 {t:"g",ad:1,title:"Adjunctive treatment for PCP with any tachypnoea or cyanosis:",rows:[R("prednisolone","po","B V","40mg","2 times a day","5 days"),"THEN",R("prednisolone","po","B V","40mg","once a day","5 days"),"THEN",R("prednisolone","po","B V","20mg","once a day","11 days")],note:"Note: High flow oxygen and nursing the patient propped up are key in the treatment of severe PCP."},
 {t:"p",x:"If still no response, consider other OIs or malignancy, for example Kaposi’s sarcoma. After PCP has been treated give cotrimoxazole prophylaxis until immunity is restored (follow current Guidelines for HIV Prevention, Testing and Treatment). This also applies to any other patients with AIDS-defining disease."}]},
{id:"hrd-crypto",name:"Cryptococcal meningitis in adults: diagnosis, treatment and prevention",sec:"HIV-related disease",aud:"adult",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"h",x:"Headache and problems of the nervous system"},
 {t:"p",x:"The symptom of headache is commonly encountered in patients with HIV infection. Careful evaluation and follow up is required to exclude meningitis and other CNS infections."},
 {t:"ul",x:["Rule out a serum cryptococcal antigenaemia (CrAg), especially if the CD4 count is less than 100.","If CrAg positive, refer for lumbar puncture (LP).","Refer for LP if the headache is associated with fever, vomiting, neck stiffness, seizures, confusion, as all these are “danger” symptoms and signs. Also refer to the section on Neurological Conditions.","Other commonly encountered neurological conditions in HIV infection include HIV encephalopathy, peripheral neuropathy, Guillain-Barré syndrome, facial nerve palsy and stroke."]},
 {t:"h",x:"Cryptococcal meningitis: general notes"},
 {t:"p",x:"Cryptococcal meningitis (CM) is caused by Cryptococcus neoformans. It is less acute in onset than bacterial meningitis and may occur as part of the immune reconstitution syndrome (IRIS). Diagnosis of cryptococcal meningitis is based on either LP positive CSF CrAg or India ink stain, or positive serum CrAg plus headache or relevant symptoms."},
 {t:"p",x:"Treatment of cryptococcal disease must be with liposomal amphotericin B based regimens (see tables below)."},
 {t:"ul",x:["First line induction regimen: liposomal amphotericin B combined with flucytosine.","Second line induction regimen (used if flucytosine is not available): amphotericin B and fluconazole.","Third line induction regimen (used in the absence of liposomal amphotericin B): high dose fluconazole and flucytosine."]},
 {t:"p",x:"All regimens are characterised by a 2-week induction phase, followed by an 8 week consolidation phase and finally a maintenance therapy phase which is continued until adequate immune reconstitution is achieved (until CD4 count >200 for 6 months and VL <1000 copies/ml for 6 months). Therapeutic lumbar punctures to treat raised CSF pressure and monitoring of renal function are essential components of management."},
 {t:"h",x:"ART initiation"},
 {t:"p",x:"Immediate ART initiation is not recommended among adults, adolescents and children living with HIV who have cryptococcal meningitis because of the risk of increased mortality due to cryptococcal IRIS. However, ART should be continued in patients already on ART at the time of CM diagnosis. ART initiation or switching (in the setting of treatment failure) should be done 4 weeks after amphotericin induction therapy, or 4–6 weeks after fluconazole induction therapy. Amphotericin has the earliest start date because it is more effective, so the patient is less likely to develop IRIS; fluconazole is less effective and therefore needs the broader range. The summary table below covers all the possibilities (4–6 weeks after antifungal treatment begins)."},
 {t:"g",ad:1,title:"First line treatment of cryptococcal meningitis in adults:",rows:[R("liposomal amphotericin B*","iv","B V","10mg/kg","once only on day 1","",{"k": "mgkg", "lo": 10, "u": "mg"}),"AND",R("flucytosine","po/iv","B V","25mg/kg","4 times a day","14 days",{"k": "mgkg", "lo": 25, "u": "mg"}),"AND",R("fluconazole","po","B V","1200mg","once a day","14 days"),"THEN",R("fluconazole","po","B V","800mg","once a day","8 weeks"),"THEN",R("fluconazole","po","B V","200mg","once a day","at least 12 months and until immune recovery")],note:"Note: Run 500–1000mL of normal saline prior to amphotericin B infusion (pre-hydration), then give KCl 1.2g po 2 times a day and MMT 500mg po 2 times a day to prevent hypokalaemia and hypomagnesaemia (this is the prophylactic dosing, given to all patients on amphotericin B). *If using amphotericin B deoxycholate, the dose is 1mg/kg IV daily for 1 week. Close monitoring during the induction phase is recommended for: creatinine, potassium, magnesium, haemoglobin. Flucytosine oral and intravenous doses are equivalent, so both routes are shown."},
 {t:"p",x:"Liposomal amphotericin has fewer risks of drug toxicity than amphotericin B deoxycholate and requires a less intensive package for preventing, monitoring and managing toxicity. The recommended package of preventing, monitoring and managing toxicity should be provided to minimise the serious types of amphotericin B related toxicity when using amphotericin B deoxycholate based regimens, especially hypokalaemia, nephrotoxicity and anaemia. A single high dose (10 mg/kg) of liposomal amphotericin B and a seven-day amphotericin B deoxycholate regimen are better tolerated than a 14-day amphotericin B deoxycholate regimen, but these two regimens still require careful monitoring."},
 {t:"h",x:"Alternative regimens"},
 {t:"g",ad:1,title:"Flucytosine available but amphotericin B not (the all-oral regimen):",rows:[R("flucytosine","po/iv","B V","25mg/kg","4 times a day","14 days",{"k": "mgkg", "lo": 25, "u": "mg"}),"AND",R("fluconazole","po","B V","1200mg","once a day","14 days"),"THEN",R("fluconazole","po","B V","800mg","once a day","8 weeks"),"THEN",R("fluconazole","po","B V","200mg","once a day","at least 12 months and until immune recovery")]},
 {t:"g",ad:1,title:"Amphotericin B available but flucytosine not:",rows:[R("amphotericin B deoxycholate*","iv","B V","1mg/kg","once a day","14 days",{"k": "mgkg", "lo": 1, "u": "mg"}),"AND",R("fluconazole","po","B V","1200mg","once a day","14 days"),"THEN",R("fluconazole","po","B V","800mg","once a day","8 weeks"),"THEN",R("fluconazole","po","B V","200mg","once a day","at least 12 months and until immune recovery")],note:"Note: Run normal saline (up to 1000mL) prior to amphotericin B infusion (pre-hydration), then give KCl 1.2g po 2 times a day (adults) and MMT 500mg po 2 times a day (adults) to prevent hypokalaemia and hypomagnesaemia (prophylactic dosing, given to all patients on amphotericin B). Without flucytosine, amphotericin B must be given for 2 weeks instead of 1 week. Flucytosine markedly improves fungicidal activity, allowing the amphotericin course to be shortened. *There is no WHO guidance on use of liposomal amphotericin B when flucytosine is unavailable. However, due to the superior safety profile of liposomal amphotericin B, a typical substitution dose is 3–4mg/kg/day IV. Close monitoring during induction: creatinine, potassium, magnesium, haemoglobin."},
 {t:"h",x:"Summary of cryptococcal meningitis treatment in adults and children"},
 {"t": "m", "title": "Expanded summary table (from the print figures)", "li": 0, "cols": ["Phase", "Regimen", "Adults", "Children"], "rows": [[["**Preferred induction, day 1"], ["Liposomal amphotericin B + flucytosine + fluconazole (single dose of L-AmB)"], ["Liposomal amphotericin B 10mg/kg IV once"], ["Liposomal amphotericin B 10mg/kg IV once"]], [["**Preferred induction, days 1–14"], ["Flucytosine + fluconazole (continuation of the above)"], ["Flucytosine 100mg/kg/day PO in 4 divided doses", "+ fluconazole 1200mg/day PO"], ["Flucytosine 100mg/kg/day PO in 4 divided doses", "+ fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**Alternative induction if L-AmB unavailable, days 1–14"], ["Amphotericin B deoxycholate + flucytosine + fluconazole"], ["Amphotericin B deoxycholate 1mg/kg/day IV (days 1–7 only)", "+ flucytosine 100mg/kg/day PO", "+ fluconazole 1200mg/day PO"], ["Amphotericin B deoxycholate 1mg/kg/day IV (days 1–7 only)", "+ flucytosine 100mg/kg/day PO", "+ fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**Alternative induction if flucytosine unavailable, days 1–14"], ["Amphotericin B deoxycholate + fluconazole"], ["Amphotericin B deoxycholate 1mg/kg/day IV", "+ fluconazole 1200mg/day PO"], ["Amphotericin B deoxycholate 1mg/kg/day IV", "+ fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**All-oral induction, days 1–14"], ["Flucytosine + fluconazole"], ["Flucytosine 100mg/kg/day PO", "+ fluconazole 1200mg/day PO"], ["Flucytosine 100mg/kg/day PO", "+ fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**Fluconazole-only induction (last resort), days 1–14"], ["Fluconazole"], ["Fluconazole 1200mg/day PO"], ["Fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**Consolidation, 8 weeks"], ["All regimens"], ["Fluconazole 800mg/day PO"], ["Fluconazole 12mg/kg/day PO (max 800mg/day)"]], [["**Maintenance (secondary prophylaxis)"], ["All regimens"], ["Fluconazole 200mg/day PO"], ["Fluconazole 6mg/kg/day PO (max 200mg/day)"]], [["**Duration of maintenance"], ["All regimens"], ["≥12 months and until immune recovery on ART"], ["≥12 months and until immune recovery on ART"]], [["**ART initiation in HIV-associated disease"], ["All regimens"], ["Start ART 4–6 weeks after antifungal treatment begins"], ["Start ART 4–6 weeks after antifungal treatment begins"]]], "note": "ART timing: 4 weeks after amphotericin induction, or 4–6 weeks after fluconazole induction; the summary shows the full range."},
 {t:"h",x:"Complications of cryptococcal meningitis"},
 {t:"p",x:"Management of raised intracranial pressure (ICP): Mortality and morbidity from cryptococcal meningitis are high with a significant proportion attributable to raised intracranial pressure. Clinical features of raised intracranial pressure include headache, nausea and vomiting, reduced vision or hearing, change in mental status or reduced level of consciousness, seizures, 6th cranial nerve palsy or other focal neurology. Management of raised ICP is critical to ensure good clinical outcomes. CSF pressure can be measured using a CSF manometer or improvisation using an IV fluid tubing and a ruler or tape measure. If the ICP is >20 cm of water, remove a maximum of 20–25 ml of CSF using daily therapeutic LPs until the CSF pressure is less than 20 cm or half the baseline pressure if this was extremely high. The LP might need to be repeated more than once a day if the CSF pressure is grossly elevated, and symptoms recur quickly despite the initial therapeutic LP on a given day. If the CSF pressure cannot be measured, then take off a maximum of 20 ml CSF."},
 {t:"p",x:"Management of amphotericin B associated toxicities: Liposomal amphotericin B has less renal toxicity. Amphotericin B deoxycholate is associated with renal tubular toxicity and can lead to electrolyte abnormalities such as hypokalaemia and hypomagnesaemia. It can also result in anaemia and administration related febrile reactions."},
 {t:"ul",x:["Amphotericin B is often provided as a powder and should be mixed with 5% dextrose water. It should NEVER be mixed with normal saline or half normal saline as this will result in precipitation of the amphotericin B. To minimise renal toxicity, amphotericin B must be administered slowly over 4 hours.","For adults, pre-hydration with 1000 ml (1 L) of normal saline with 20 mEq of potassium chloride over 2 hours is recommended based on the volume status of the patient. Patients must receive oral potassium supplementation such as 1200 mg 2 times a day (prophylactic dosing, for all patients). Where available, supplementation with magnesium trisilicate 500 mg orally 2 times a day is also recommended.","Renal function must be monitored at baseline. U&Es should be measured twice weekly and abnormal results repeated daily until they normalise. Amphotericin B should be discontinued if renal toxicity is noted but can be restarted at a reduced dosage if the U&Es are improving.","If potassium is less than 3.3 mmol/L, increase oral KCl to 600–1200 mg 3 times a day (therapeutic dosing for proven hypokalaemia) and monitor U&Es daily. If potassium levels do not increase despite oral potassium replacement, this may be due to low magnesium levels, therefore consider measuring magnesium levels and replenishing magnesium if necessary.","If the creatinine increases (which is already too late and should be avoided), a dose of amphotericin B can be omitted, and pre-hydration increased to 1 L of normal saline every 8 hours and creatinine rechecked. If creatinine normalises, pre-hydrate with 1 L normal saline with 20 mEq KCl (therapeutic dosing, given over 2 hours in proven hypokalaemia) and restart amphotericin B (according to the dosing table) given over 4 hours and thereafter consider giving amphotericin B on alternate days. Monitor renal function 2 to 3 times weekly.","If repeat creatinine remains elevated or continues to increase, discontinue amphotericin B and initiate high dose fluconazole 1200 mg orally once a day."]},
 {t:"p",x:"Cryptococcal IRIS syndrome: occurs after initiation of ART or switching ART and is associated with raised intracranial pressure and resultant symptoms. The patients will need admission, therapeutic LPs as above, and an assessment for cryptococcal relapse, with CSF sent to the lab for India ink exam, CSF biochemistry, CrAg titres and culture for Cryptococcus (up to 14 days). Relapse would indicate re-induction with amphotericin B. The CSF CrAg may remain positive for a long time after treatment."},
 {t:"h",x:"Prevention of cryptococcal meningitis"},
 {t:"p",x:"Primary prevention: patients with CD4 count 200 or less are at higher risk of cryptococcal meningitis. Every newly diagnosed patient with a CD4 count less than 200 should have a serum CrAg screen done. If CrAg negative, they should be started on ART. If CrAg positive, they should be referred for LP to exclude cryptococcal meningitis. If CSF CrAg negative, give pre-emptive therapy to prevent cryptococcal meningitis."},
 {t:"g",ad:1,title:"Prevention of/prophylaxis for cryptococcal meningitis in adults:",rows:[R("fluconazole","po","B V","800mg","once a day","10 weeks"),"THEN",R("fluconazole","po","B V","200mg","once a day","until CD4 count >200 cells/mm³ for 6 months")]},
 {t:"p",x:"Secondary prevention: all patients who have completed primary management must be educated about adhering to the correct doses of fluconazole, not running out of treatment, and completing the consolidation, continuation and maintenance phases at appropriate doses. Discontinuation of fluconazole can be considered if one of the following criteria is fulfilled:"},
 {t:"ul",x:["stable on ART and fluconazole for 1 year; CD4 >200 and viral load undetectable, or","stable on ART and fluconazole for 1 year; CD4 >200 where a viral load is not able to be obtained."]}]},
{id:"hrd-crypto-child",name:"Cryptococcal meningitis in children and neonates",sec:"HIV-related disease",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"g",title:"First line treatment of cryptococcal meningitis in children and adolescents:",rows:[R("liposomal amphotericin B*","iv","B V","10mg/kg","once only on day 1","",{"k": "mgkg", "lo": 10, "u": "mg"}),"AND",R("flucytosine","po/iv","B V","25mg/kg","4 times a day","14 days",{"k": "mgkg", "lo": 25, "u": "mg"}),"AND",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","14 days",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","8 weeks",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","6mg/kg (max 200mg)","once a day","at least 12 months and until immune recovery",{"k": "mgkg", "lo": 6, "u": "mg", "mx": 200})],note:"Note: Run normal saline (up to 1000mL) prior to amphotericin B infusion (pre-hydration), then give KCl (doses vary) and MMT (doses vary) to prevent hypokalaemia and hypomagnesaemia (this is the prophylactic dosing, given to all patients on amphotericin B). *If using amphotericin B deoxycholate, the dose is 1mg/kg IV daily for 1 week. Close monitoring during induction: creatinine, potassium, magnesium, haemoglobin. Flucytosine oral and intravenous doses are equivalent, so both routes are shown."},
 {t:"g",title:"All-oral regimen in children (flucytosine available, amphotericin B not):",rows:[R("flucytosine","po/iv","B V","25mg/kg","4 times a day","14 days",{"k": "mgkg", "lo": 25, "u": "mg"}),"AND",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","14 days",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","8 weeks",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","6mg/kg (max 200mg)","once a day","at least 12 months and until immune recovery",{"k": "mgkg", "lo": 6, "u": "mg", "mx": 200})]},
 {t:"g",title:"Amphotericin B available but flucytosine not (children):",rows:[R("amphotericin B deoxycholate","iv","B V","1mg/kg","once a day","14 days",{"k": "mgkg", "lo": 1, "u": "mg"}),"AND",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","14 days",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","12mg/kg (max 800mg)","once a day","8 weeks",{"k": "mgkg", "lo": 12, "u": "mg", "mx": 800}),"THEN",R("fluconazole","po","B V","6mg/kg (max 200mg)","once a day","at least 12 months and until immune recovery",{"k": "mgkg", "lo": 6, "u": "mg", "mx": 200})],note:"Without flucytosine, amphotericin B must be given for 2 weeks instead of 1 week. Pre-hydrate with normal saline (up to 1000mL); KCl and MMT doses vary in children."},
 {t:"h",x:"Treatment of cryptococcal meningitis in neonates and infants"},
 {t:"p",x:"For a neonate, infant or child: initial test dose of amphotericin B 100 micrograms/kg (maximum 1 mg) included as part of the first dose, then 250 micrograms/kg daily, gradually increased up to 1 mg/kg daily (maximum of 1.5 mg/kg daily). Prolonged treatment is usually necessary."},
 {t:"g",title:"Treatment of cryptococcal meningitis in neonates/infants:",rows:[R("amphotericin B deoxycholate","iv","B V","100mcg/kg (max 1mg)","first dose on day 1 only","",{"k": "mgkg", "lo": 0.1, "u": "mg", "mx": 1, "dp": 2}),"THEN",R("amphotericin B deoxycholate","iv","B V","250mcg/kg (titrate slowly up to 1mg/kg)*","once a day","prolonged therapy usually necessary",{"k": "mgkg", "lo": 0.25, "u": "mg", "dp": 2}),"AND",R("fluconazole","po","B V","6–12mg/kg","neonate under 2 weeks: every 72 hours; neonate 2–4 weeks: every 48 hours; infant/child: once a day","≥8 weeks (according to response)",{"k": "mgkg", "lo": 6, "hi": 12, "u": "mg"})],note:"Note: Run normal saline prior to amphotericin B infusion (pre-hydration), then give KCl and MMT to prevent hypokalaemia and hypomagnesaemia. *If treatment is interrupted for longer than 7 days, recommence at 250 micrograms/kg daily and increase gradually. There is no direct conversion between liposomal amphotericin B and amphotericin B deoxycholate. However, similar fungal clearance occurs with liposomal amphotericin B at 3–4mg/kg/day IV compared with amphotericin B deoxycholate 0.7–1mg/kg/day IV. Therefore, doses listed here may be safely multiplied by 3–4 when substituting with liposomal amphotericin B. Close monitoring during induction: creatinine, potassium, magnesium, haemoglobin."},
 {t:"p",x:"See the adult cryptococcal page for the summary table (adults and children), complications (raised ICP, amphotericin toxicity, IRIS) and prevention."}]},
{id:"hrd-skin",name:"HIV-related skin conditions, dementia and cancer",sec:"HIV-related disease",aud:"adult",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"h",x:"HIV associated dementia"},
 {t:"p",x:"Characterised by progressive impairment in cognitive function that is accompanied by behavioural changes and motor abnormalities. Note: other causes of dementia must be excluded. Antiretroviral therapy (ART) is the best treatment to offer. Provide supportive care for the patient and their family. If psychotic or depressive features are prominent, refer for/add specific therapy to cover these conditions."},
 {t:"h",x:"HIV related skin conditions"},
 {t:"p",x:"Skin manifestations of HIV infection may be the result of opportunistic infections or HIV itself. Start ART as soon as possible as restoration of immunity tends to result in a resolution in most instances. Refer to a skin specialist if not getting better. Persons with HIV/AIDS should be informed of the likelihood of increased photosensitivity as many develop hyperpigmentation of the face and the “V” of the neck. Excessive exposure to the sun should be avoided. See also the chapter on Skin Conditions for guidelines on common skin conditions and the chapter on Sexually Transmitted Infections for molluscum contagiosum and condyloma acuminata."},
 {t:"h",x:"Herpes zoster (shingles)"},
 {t:"p",x:"Caused by a reactivation of varicella zoster virus infection. Antiviral treatment should be started as soon as possible, ideally within 72 hours of onset of the vesicular rash, for the treatment to be most effective. However, after this time, antiviral medications may still be helpful if new blisters are appearing. The three antiviral medicines used are acyclovir, valaciclovir or famciclovir. The pain of shingles can be very severe, and medications to reduce pain are frequently needed. The best options are the nonsteroidal anti-inflammatory medicines (e.g. ibuprofen). Topical lotions, such as calamine lotion, are helpful in reducing the pain and itching of the lesions, thus avoiding traumatic sores and consequent keloid formation. Following an attack of shingles, a person may experience continued pain for more than three months after the onset of the rash; this is referred to as post-herpetic neuralgia. In addition to pain medicines, tricyclic antidepressants, such as amitriptyline, are effective in controlling the pain."},
 {t:"g",ad:1,title:"Treatment of herpes zoster in adults:",rows:[R("acyclovir","po","C E","800mg","5 times a day","7 days"),"OR",R("valaciclovir","po","B E","1g","3 times a day","7 days"),"AND (for pain)",R("paracetamol","po","C N","0.5–1g (max 4g/day)","3–4 times a day","7–10 days"),"OR",R("ibuprofen*","po","C N","200–400mg (max 1200mg/day)","3–4 times a day","7–10 days"),"AND (for neuralgia)",R("amitriptyline","po","B E","25mg","once a night","review"),"AND (for skin care)",R("calamine","topical","C N","topically","often","as required"),"AND (for skin care)",R("povidone iodine","topical","B E","daily, for wound care","","as required")],note:"*Caution using anti-inflammatory medicines in people with renal impairment or gastrointestinal ulcer(s). Patients should be started on cotrimoxazole prophylaxis if CD4 is 350 or less. Refer immediately if there is ophthalmic or pulmonary involvement. Secondary (bacterial) infection may require treatment."},
 {t:"h",x:"Post-herpetic neuralgia"},
 {t:"p",x:"Pain that occurs after the rash is fully resolved."},
 {t:"g",ad:1,title:"Treatment for post-herpetic neuralgia:",rows:[R("amitriptyline","po","B E","25–75mg (max 150mg if required)","once a night","as required"),"OR",R("carbamazepine","po","B V","100–200mg (increased over 10 days to a max of 400mg)","once a night at low doses; 3 times a day at higher doses","as required")]},
 {t:"h",x:"Herpes simplex virus"},
 {t:"p",x:"In immunosuppressed persons, primary and recurrent herpes simplex lesions are usually more severe, more persistent, more symptomatic and more resistant to treatment. The early vesicular lesions (blisters) may be transient or never seen. In immunosuppressed patients, any erosive mucocutaneous lesion should be regarded as herpes simplex until proven otherwise. Patients need to be counselled about the recurrent nature of the lesions, as well as their likely persistence, and the infectiousness of mucocutaneous or genital herpes. Care of local lesions: keep them clean with frequent (2 to 3 times a day) washing with water and keeping them as dry as possible. In very severe cases or immunocompromised patients, acyclovir should be given. Bacterial superinfection may complicate lesions and will require antibiotics. Suppressive therapy may be required for frequent (more than 4 to 6 episodes per year) recurrent HSV infections. After 1 year, the situation may be reviewed to either continue or change to episodic treatment or discontinue and assess the clinical situation."},
 {t:"g",ad:1,title:"Episodes of herpes simplex:",rows:[R("acyclovir","po","C E","400mg","3 times a day","5 days"),"OR",R("valaciclovir","po","B E","500mg","2 times a day","5 days")]},
 {t:"g",ad:1,title:"Suppression of herpes simplex:",rows:[R("acyclovir","po","C E","400mg","2 times a day","daily for 12 months then review"),"OR",R("valaciclovir","po","B E","500mg","2 times a day","daily for 12 months then review")]},
 {t:"h",x:"Seborrhoeic dermatitis"},
 {t:"p",x:"A common, chronic, superficial inflammatory disease with a tendency to affect the scalp (dandruff), the eyebrows, eyelids, nasolabial folds and ears. Other areas affected are the lips, sternal area, axillae, submammary folds and groins. The condition is characterised by scales on an erythematous (reddened) base. Dandruff represents a mild form. People living with HIV infection (even without immunosuppression) have an increased incidence, possibly because one of the aetiological factors is the yeast Pityrosporum ovale, which is found in higher density in such persons."},
 {t:"ul",x:["Topical steroids, such as hydrocortisone 1% combined with a topical antifungal cream, such as miconazole cream 2%, are effective when applied 2 times a day.","For the scalp, shampoos such as 2% ketoconazole shampoo may be helpful, used 2 to 3 times a week. Subsequently, weekly use of such shampoos may reduce recurrence.","Systemic treatment may be required in severe cases, using either itraconazole or terbinafine tablets."]},
 {t:"h",x:"Pruritic papular eruption (PPE)"},
 {t:"p",x:"PPE of HIV is often reported as the most common skin rash seen in persons living with HIV infection. It is a form of prurigo. Between 20 and 46% of patients with HIV have this condition at some point in time. It can be the presenting symptom of HIV in 25–80% of cases, as well as be a dermatological sign of advanced HIV, being three times more common when the CD4 lymphocyte count is less than 200. The rash can be very distressing for patients as it can be disfiguring and stigmatising, and treatment can be difficult and unsatisfactory. It is nearly always a very itchy rash presenting as multiple, discrete scratched pimples or bumps, which are symmetrical and diffusely distributed. The extremities (arms and legs) and trunk are affected more than the face and usually the mucous membranes (mouth, nostrils, eyes, genitals), palms, and web spaces are spared. Treatment is primarily to alleviate the itching, as PPE often proves very resistant to treatment. Approaches shown to be effective in some patients:"},
 {t:"ul",x:["Medium- to high-potency topical steroids, together with emollients (moisturisers).","Oral antihistamines e.g. chlorpheniramine or promethazine.","Calamine lotion."]},
 {t:"h",x:"Medicine reactions"},
 {t:"p",x:"These are frequently caused by cotrimoxazole, nevirapine, efavirenz, TB medicines. Stop the medicines and reassess."},
 {t:"h",x:"HIV and cancer"},
 {t:"p",x:"HIV-infected individuals have an increased incidence of several malignancies, including both AIDS-defining malignancies (Kaposi sarcoma [KS], cervical cancer, and non-Hodgkin lymphoma [NHL] including systemic NHL, CNS lymphoma, primary effusion lymphoma, and multicentric Castleman disease [MCD]), as well as several non-AIDS-defining cancers including lung, breast, prostate, anogenital and colorectal. Factors contributing to pathogenesis may include direct effects of HIV, immunosuppression, coinfection with other oncogenic viruses (e.g. HPV, EBV, HBV or HCV) and other environmental oncogenic stimuli. The rollout and widespread use of ART has prevented severe immunosuppression for prolonged periods in many HIV-infected individuals, which has been associated with a decrease in the incidence of KS."},
 {t:"p",x:"Note that patients with non-Hodgkin lymphoma, Hodgkin lymphoma, cervical cancer, squamous cell conjunctival carcinoma are likely to be HIV positive and will need ART and treatment for the cancer (chemotherapy, surgery, radiotherapy). HIV positive patients should continue their ART while they receive treatment for the cancer. Avoid zidovudine because of the side effect of anaemia. They should be managed by HIV specialists and oncologists."},
 {t:"h",x:"Kaposi’s sarcoma (KS)"},
 {t:"p",x:"Patients with KS are in WHO clinical stage 4 and will require ART. Assess the KS stage (limited or mild, moderate or severe/extensive). Also assess for signs and symptoms of visceral involvement. Most patients present late with a high burden of tumour and hence chemotherapy is required. If possible, refer patients for specialist opinion prior to starting ART (this might avoid IRIS which may occur with extensive KS, especially pulmonary KS) and submit a biopsy for tissue diagnosis before referral. KS patients (in good general health, with limited early KS, ≤5 lesions) may respond to ART alone but most patients will need chemotherapy; and the timing of chemotherapy is important. Immune reconstitution with ART occurs and may worsen the KS dramatically. If uncertain about the timing of ART initiation and chemotherapy use, consider specialist referral. Review with the Oncology Guidelines."}]},
{id:"hrd-ahd",name:"Managing advanced HIV disease",sec:"HIV-related disease",src:"EDLIZ 2025, HIV Related Disease chapter",blocks:[
 {t:"p",x:"Advanced HIV disease (AHD) is defined as WHO clinical stage 3 or 4 or a CD4 cell count equal to or less than 200 cells/mm³ for people living with HIV aged five years or older. All children younger than five years are considered to have advanced HIV disease. This is based on the rationale that most children younger than five years usually present for care with advanced immunosuppression, younger children have an increased risk of disease progression and mortality regardless of clinical and immune condition."},
 {t:"h",x:"Assessing for AHD"},
 {t:"p",x:"CD4 cell count is the best indicator of disease stage and immediate risk of death and thus should be used to identify people with advanced HIV disease. If access to CD4 count is limited or unavailable, WHO staging should be used."},
 {"t": "m", "title": "Diagnostic recommendations for managing patients with AHD", "li": 0, "cols": ["Intervention", "Priority target population", "Age"], "rows": [[["**CD4 testing"], ["PLHIV newly presenting to care (ART naïve)", "Patients returning to care who have interrupted ART for at least 90 days", "Patients on ART who have suspected or confirmed treatment failure"], ["All ages"]], [["**LF-LAM testing"], ["Outpatient and inpatient settings: HIV-positive adults, adolescents, and children with signs and symptoms of TB; with advanced HIV disease; who are seriously ill; or irrespective of signs and symptoms of TB and with a CD4 cell count <200.", "A negative LF-LAM test does not exclude TB; however, a positive LAM test confirms it."], ["All ages"]], [["**Cryptococcal antigen testing"], ["Any PLHIV with CD4 <200 cells/mm³ with clinical stage 3 or 4 illness"], ["PLHIV >10 years"]]]},
 {t:"p",x:"The main interventions known to reduce morbidity and mortality among people living with HIV can be summarised as Screen, Treat, Optimise and Prevent AIDS (STOP AIDS)."},
 {"t": "m", "title": "STOP AIDS", "li": 0, "cols": ["Step", "Action"], "rows": [[["**Screen"], ["TB: screen using the clinical algorithm followed by X-ray when indicated and if available.", "Cryptococcal infection among adolescents: serum, plasma or blood cryptococcal antigen screening followed by lumbar puncture if positive or symptomatic.", "Malnutrition: weight-for-height, height-for-age, and mid-upper arm circumference among children 2–5 years old."]], [["**Treat"], ["TB, severe pneumonia, severe bacterial infections, cryptococcal meningitis and severe acute malnutrition."]], [["**Optimise"], ["Rapid antiretroviral therapy: start within seven days with optimal regimens (except in patients with cryptococcal meningitis, where treatment should be deferred for 4–6 weeks after starting antifungal treatment).", "Antiretroviral therapy counselling (to encourage effective adherence support interventions)."]], [["**Prevent"], ["Bacterial infections and Pneumocystis pneumonia: cotrimoxazole prophylaxis.", "TB: TB preventive treatment.", "Cryptococcal meningitis among adolescents and adults: fluconazole pre-emptive therapy.", "Vaccinations: pneumococcal vaccine, human papillomavirus, measles, BCG, COVID-19."]]]}]},
{id:"tb-prevention",name:"TB: policy, prevention and TB preventive therapy",sec:"Tuberculosis",src:"EDLIZ 2025, Tuberculosis chapter",blocks:[
 {t:"p",x:"Tuberculosis (TB) is a chronic, infectious, debilitating disease, caused by Mycobacterium tuberculosis. It is a public health problem, and all cases must be notified to the Provincial/City Medical Director in terms of the Public Health Act."},
 {t:"h",x:"Control of tuberculosis: TB policy"},
 {t:"p",x:"More information on national policy and the organisation of TB services is available in various TB resource documents, including but not limited to: Tuberculosis and Leprosy Management Guidelines, Clinical Guidelines for the Management of Drug-Resistant Tuberculosis (DR-TB) and the Zimbabwe National TB Strategic Plan and the NSP Addendum. The essential points of the TB policy are:"},
 {t:"ul",x:["Rapid molecular diagnostics (Xpert MTB/Rif Ultra or Truenat MTB-Rif) are the preferred diagnostic test for all patients undergoing TB investigation.","All those with Mycobacterium tuberculosis detected must receive a reflex test on the Xpert MTB/XDR platform to determine whether there is resistance to isoniazid, fluoroquinolones, second line injectables or ethionamide.","Treat all TB cases using the most appropriate regimen.","Contacts of all pulmonary bacteriologically confirmed TB cases must be screened for TB, and those found presumptive of TB investigated accordingly.","All those found to be eligible for TB preventive therapy (TPT) must be enrolled onto a recommended TPT regimen.","TB investigations and medicines are provided free of charge in the public health sector.","TB services are available and integrated at all levels of the health delivery system.","Collaborative TB/HIV activities are to be ensured at all levels."]},
 {t:"p",x:"An important emphasis of the TB programme is the direct observation of treatment (DOT), which is the practice of supporting the patient taking their daily doses. A treatment supporter can either be a health care worker, a trained member of the community or a family member. A treatment supporter must be selected in close consultation with the patient, and they should be someone acceptable to the patient. Notification, registration, record keeping and contact tracing activities, in addition to treatment, are key to the success of the programme."},
 {t:"p",x:"TB first line fixed dose combinations (FL FDCs) are to be available at all levels from C through to A. Single formulations are B level medicines. TB medicines are accorded V level of priority."},
 {t:"h",x:"Primary prevention: BCG vaccination"},
 {t:"ul",x:["BCG vaccination should be given to all babies at birth, or at first contact with the child after birth, according to national guidelines. While BCG does not offer complete immunity to tuberculosis, it offers protection from the severe forms of tuberculosis such as miliary TB and TB meningitis.","BCG vaccine should be given to all babies, except babies with clinical signs of HIV infection and/or infants born to a mother with sputum positive TB.","BCG is given intradermally on the right upper arm, above the insertion of the deltoid muscle.","The batch number of the vaccine and the date must be recorded on the child’s health card.","No booster dose should be given.","Dosage is as recommended by the EPI (see the chapter on Immunisation).","Problems associated with BCG vaccination remain uncommon and are mainly due to faulty technique.","Abscesses or ulcers should be treated with local hygienic care. Abscesses should be aspirated, not incised. Secondary infections can be treated with antibiotics. Non-healing ulcers (ulcers of duration >8 weeks) or regional lymphadenopathy can be treated as follows:"]},
 {t:"g",title:"Treatment for BCG related regional lymphadenopathy:",rows:[R("isoniazid","po","B V","10mg/kg","once a day","2 months",{"k": "mgkg", "lo": 10, "u": "mg"})]},
 {t:"h",x:"Secondary prevention: TB preventive therapy (TPT)"},
 {t:"p",x:"TPT priority groups are PLHIV and household contacts of bacteriologically confirmed TB index cases, including child (<15 years) and adult (>15 years) contacts."},
 {"t": "m", "title": "Preferred LTBI treatment options", "li": 0, "cols": ["Population group", "Preferred treatment", "Alternative"], "rows": [[["**ADULTS"], [""], [""]], [["PLHIV on DTG-based regimen"], ["Three months of rifapentine and isoniazid (3HP), taken weekly"], ["Six months of isoniazid alone (6H), daily"]], [["PLHIV on TAF, PIs and NVP-based regimens"], ["Six months of daily isoniazid alone (6H)"], ["–"]], [["HIV-negative contacts (adults and adolescents ≥15 years)"], ["Three months of rifapentine and isoniazid (3HP), taken weekly"], ["Six months of isoniazid alone (6H), daily"]], [["**CHILDREN"], [""], [""]], [["CLHIV on DTG, PIs and NVP-based regimen"], ["Six months of daily isoniazid alone (6H)"], ["–"]], [["HIV-negative contacts (children under 15 years)"], ["Three months of daily rifampicin and isoniazid (3RH)"], ["Six months of isoniazid alone (6H), daily"]], [["**SPECIAL GROUPS"], [""], [""]], [["MDR-TB contacts"], ["Six months of daily levofloxacin (6LFX)"], ["–"]], [["Pregnant women"], ["Six months of daily isoniazid alone (6H)"], ["–"]]], "note": "Pyridoxine should be prescribed in patients receiving INH-based TPT, especially 6H. Its unavailability should not be a barrier to initiate 3HP or 3RH."},
 {t:"p",x:"The preventive treatment for MDR contacts should be individualised after a careful assessment of the intensity of exposure, the certainty of the source case, reliable information on the drug resistance pattern of the source case and potential adverse events. The preventive treatment should be given only to household contacts at high risk in whom active disease has been ruled out (e.g. children 5 years and below, people receiving immunosuppressive therapy and people living with HIV). Levofloxacin should be selected according to the drug susceptibility profile of the index case. Confirmation of infection with LTBI tests is required."},
 {"t": "m", "title": "Recommended TPT doses by regimen", "li": 0, "cols": ["Regimen", "Dose", "Maximum dose"], "rows": [[["**Pyridoxine"], ["Individuals aged 2–14 years: 12.5mg", "Individuals aged >14 years: 25mg"], ["100mg"]], [["**Rifapentine plus isoniazid [3HP]"], ["Weekly for 3 months (12 doses)", "Isoniazid: 10–15 kg = 300mg; 15.1–23 kg = 500mg; 23.1–30 kg = 600mg; >30 kg = 900mg", "Rifapentine: 10–15 kg = 300mg; 15.1–23 kg = 450mg; 23.1–30 kg = 600mg; >30 kg = 900mg"], ["Isoniazid 900mg", "Rifapentine 900mg"]], [["**Isoniazid alone [6H]"], ["Daily for 6 months", "Adults: 5mg/kg", "Children: 10mg/kg (range 7–15mg/kg)"], ["300mg"]], [["**Isoniazid plus rifampicin [3RH]"], ["Daily for 3 months", "Isoniazid, children: 10mg/kg (range 7–15mg/kg)", "Rifampicin, children: 15mg/kg (range 10–20mg/kg)"], ["Isoniazid 300mg", "Rifampicin 600mg"]], [["**Levofloxacin [6LFX]"], ["5–10 kg: 150mg", "10.1–15 kg: 250mg", "15.1–23 kg: 350mg", "23.1–30 kg: 500mg", "30.1–50 kg: 625mg", ">50 kg: 750mg"], ["750mg"]]], "note": "Rifapentine dosing starts at 10 kg, limiting its use in younger children. Avoid rifapentine/rifampicin in pregnancy, or in women using hormonal contraceptives (all types) (from the HIV-related disease chapter). Weight-band tablet numbers for children on isoniazid 6H and RH 75/50 (3RH) are on the HIV-related disease page “general guidelines”. More guidance on TB preventive therapy may be found in the Zimbabwe National Tuberculosis and Leprosy Management Guidelines (2023), Clinical Guidelines for the Management of Drug-Resistant Tuberculosis (2023) and the Guidelines for Antiretroviral Therapy for the Prevention and Treatment of HIV in Zimbabwe."},
 {t:"h",x:"Approach to newborn and under-five TB contacts"},
 {t:"p",x:"An infant born to a mother with sputum positive TB should not be given BCG at birth:"},
 {t:"ul",x:["If the newborn of a mother with TB is unwell, the child should be referred to a specialist for further evaluation and prompt treatment initiated if TB is confirmed or likely.","The mother should receive effective TB treatment so that she is no longer infectious. Infection prevention and control measures should be in place in the hospital nursery and at home. If the mother is taking TB medicines, she can safely breastfeed the baby who is receiving TPT. All mothers living with HIV should be offered ART to reduce risk of vertical transmission.","Neonates born to women of negative or unknown HIV status should receive BCG.","Neonates born to HIV-infected mothers should not receive BCG until the infant is clinically and immunologically stable on ART.","Give the child the appropriate TPT regimen, preferably 3HR, for two months. If the infant is exposed to HIV and is on nevirapine, 6H is the preferred TPT regimen.","After two months, perform a tuberculin skin test (TST).","If the tuberculin skin test (Mantoux test) is positive give full TB treatment.","If the Mantoux test is negative continue with the TPT regimen until completion (1 month for 3HR and 4 months for 6H).","At completion of TPT, BCG should be given to the child (if not contraindicated; refer to the chapter on Immunisation).","For all contacts of a sputum positive TB case, evaluate for signs of active TB; for children check the BCG vaccination status and vaccinate if not already done. Commence on the appropriate TPT regimen if active TB is excluded.","Contact investigation should be conducted to screen and manage all household and close contacts of the index case (initial TB case); see also the HIV chapter."]},
 {t:"p",x:"Note: neonates are given the shorter course (3HR for two months, then a tuberculin skin test) because these medicines are toxic in neonates and a long duration is not needed. Refer to the Zimbabwe Tuberculosis and Leprosy Management guidelines for additional information."}]},
{id:"tb-diagnosis",name:"TB: diagnosis",sec:"Tuberculosis",src:"EDLIZ 2025, Tuberculosis chapter",blocks:[
 {t:"p",x:"Pulmonary tuberculosis should be suspected in individuals presenting with one or more of the following complaints:"},
 {t:"ul",x:["Cough for 1 week or longer, or a cough of any duration among PLHIV","Night sweats","Fever","Loss of weight","A BMI <17 kg/m² or failure to thrive among children (z score less than −1)"]},
 {t:"h",x:"Chest X-ray"},
 {t:"p",x:"Chest X-ray (with or without artificial intelligence [AI]) is recommended as a priority SCREENING test for persons classified as being at high risk for tuberculosis. The CAD AI score threshold to collect sputum depends on the software and version and should be obtained from the National TB Programme. An abnormal CXR by CAD score or by human reader should prompt the collection of sputum. The following persons are classified as being at high risk for tuberculosis:"},
 {t:"ul",x:["Children under the age of 5 years","People living with HIV","Those who are malnourished","People above 60 years of age","People with diabetes mellitus","People who drink alcohol excessively","Miners and ex-miners","People in congregate settings","Inmates and correctional facility communities","Health care workers"]},
 {t:"p",x:"Note: In the presence of clinical improvement, it is not necessary to monitor the response of pulmonary TB to treatment by chest X-rays."},
 {t:"h",x:"Rapid molecular diagnostic tests (Xpert)"},
 {t:"p",x:"Every effort should be made to bacteriologically confirm the diagnosis of TB, with a rapid molecular test such as Xpert MTB/Rif (Ultra) or Truenat MTB-Rif being the preferred diagnostic tests for patients being evaluated for tuberculosis. A specimen should be submitted for all cases being investigated for pulmonary TB as per the TB diagnostic algorithm, to confirm the diagnosis of tuberculosis (see the National Tuberculosis and Leprosy Control Guidelines)."},
 {t:"h",x:"Urine lateral flow lipoarabinomannan assay (LF-LAM)"},
 {t:"p",x:"LF-LAM must be used to diagnose extrapulmonary TB ONLY IN PLHIV who:"},
 {t:"ul",x:["1. Have advanced HIV disease, defined as any of the following: CLHIV under the age of 5 years; CD4 less than 200 cells/mL; temperature above 37 or RR above 24 cycles/min or HR above 120 bpm; unable to walk unaided.","OR 2. have signs and symptoms of TB."]},
 {t:"p",x:"LF-LAM is NOT a replacement of sputum and must be used on all PLHIV presumed to have TB. A positive LF-LAM signifies extrapulmonary TB. Treatment is similar to pulmonary TB. The source must be teased out where possible for biopsy and resistance testing."},
 {t:"h",x:"Tuberculin testing"},
 {t:"g",title:"Dosing for tuberculin skin testing:",rows:[R("tuberculin, purified derivative (PPD) (intradermal)","","B E","0.1ml (=5TU)","","")],note:"Examine induration at 48–72 hours."},
 {t:"ul",x:["This test is meant to determine exposure to TB, which may aid in diagnosing a child with symptoms whose exposure history is unclear.","A positive tuberculin skin test (person with normal immunity: induration ≥10 mm; person with defective immunity: induration ≥5 mm) may indicate active infection (especially if strongly positive), previous infection or previous BCG.","Absence of a response does not exclude TB because individuals with HIV may not have sufficient immunity for a positive skin test despite active TB.","If a child under 3 years of age has not had BCG, the Mantoux test may be useful."]}]},
{id:"tb-treatment",name:"TB: treatment of drug-sensitive TB",sec:"Tuberculosis",src:"EDLIZ 2025, Tuberculosis chapter",blocks:[
 {t:"p",x:"One treatment regimen is now used in Zimbabwe for the treatment of drug sensitive TB, regardless of the treatment history. The regimen consists of a combination of the four first line medicines HRZE: H = isoniazid, R = rifampicin, Z = pyrazinamide, E = ethambutol. These medicines are available as fixed dose combination (FDC). The intention of these combination tablets is to improve compliance by reducing the number of tablets a patient takes, and to reduce the possibility of medicine resistance developing. The number of FDC tablets is determined by the weight range of each patient at the start of treatment. Treatment is the same for HIV infected people as for non-HIV infected."},
 {t:"h",x:"General notes"},
 {t:"ul",x:["In all pulmonary tuberculosis cases, sputum smear examination is done at the end of two months, five months and at the end of treatment. Refer to the National Tuberculosis and Leprosy Management Guidelines for the management of a positive smear at any stage in the monitoring of treatment.","Children weighing less than 25 kg receive paediatric FDC HRZ plus additional isoniazid and ethambutol.","Children weighing 25 kg and above receive adult formulations and additional isoniazid.","The total duration of treatment is 6 months (exceptions noted below).","Children with tuberculous meningitis or pericarditis, disseminated or spinal disease with neurological complications should be given 10HR (continuation phase), i.e. 10 months of isoniazid and rifampicin under direct observation.","Adults with TB of meninges, bone, joint(s), pericardium, disseminated, or spinal disease should be given 6HR (continuation phase), i.e. 6 months of isoniazid and rifampicin under direct observation.","The country/programme is aware of the 4-month regimen of HPMZ/HPM to treat DS-TB in adults and adolescents but has not adopted it for programmatic use yet."]},
 {"t": "m", "title": "Treatment of rifampicin-sensitive TB", "li": 0, "cols": ["Group", "Regimen", "Intensive phase", "Continuation phase"], "rows": [[["**Adults (DOTS)"], ["2HRZE/4HR"], ["2 months HRZE"], ["4 months HR", "OR 6 months HR (for TB of meninges, bone, joint, pericardium, disseminated TB, spinal disease, the continuation phase is extended)"]], [["**Children (DOTS)"], ["2HRZE/4HR"], ["2 months HRZE"], ["4 months HR", "OR 10 months HR (for patients with TB of the meninges, bone, joint, pericardium, miliary TB or TB spine, the continuation phase is extended)", "For DS TB meningitis ages 3 months to 19 years, an intensive regimen of 6 months of HRZ(Eto) may be used by specialists, with high dose HR. Refer to TB case management guidelines."]], [["**Children 3 months to 16 years with non-severe drug-susceptible TB*"], ["2HRZE/2HR⁺"], ["2 months HRZE"], ["2 months HR"]]], "note": "*Non-severe TB is defined as lymph node TB that is peripheral (e.g. neck swelling) and isolated (no evidence of TB elsewhere); OR uncomplicated PTB on CXR (i.e. lymph node enlargement without airway obstruction) or non-cavitary disease confined to less than one full lobe of the lungs and without miliary pattern; OR uncomplicated TB pleural effusion. A well interpreted CXR is a pre-requisite for this definition to be met. ⁺This regimen is only applicable to ages 3 months to 16 years. Note: these regimen names (for example 2HRZE/4HR) describe how long each combination is given, not the doses: 2HRZE means HRZE for 2 months. The doses, including the higher isoniazid and ethambutol doses used in the 2 month intensive phase for children, are in the national TB guidelines."},
 {t:"h",x:"Fixed dose combinations of anti-TB medicines"},
 {t:"p",x:"The FDCs available in Zimbabwe are: RHZE (rifampicin, isoniazid, pyrazinamide and ethambutol); RHZ (rifampicin, isoniazid and pyrazinamide); RH (rifampicin and isoniazid). The number of FDC tablets is determined by the weight range of each patient at the start of treatment as shown below."},
 {"t": "m", "title": "Paediatric FDC dosing by weight band (number of tablets, once a day)", "li": 0, "cols": ["Weight band", "Intensive phase: RHZ (75/50/150)", "Intensive phase: E (100)", "Continuation phase: RH (75/50)"], "rows": [[["4–7 kg"], ["1"], ["1"], ["1"]], [["8–11 kg"], ["2"], ["2"], ["2"]], [["12–15 kg"], ["3"], ["3"], ["3"]], [["16–24 kg"], ["4"], ["4"], ["4"]], [["25 kg and above"], ["Use adult dosages and formulations"], [""], [""]]]},
 {"t": "m", "title": "Adult FDC dosing by weight band (number of tablets, once a day)", "li": 0, "cols": ["Weight band", "Intensive phase, 2 months: 2(RHZE) daily (isoniazid 75mg + rifampicin 150mg + pyrazinamide 400mg + ethambutol 275mg)", "Continuation phase, 4 months: 4(HR) daily (isoniazid 75mg + rifampicin 150mg)"], "rows": [[["25–39 kg"], ["2"], ["2"]], [["40–54 kg"], ["3"], ["3"]], [["55 to <70 kg"], ["4"], ["4"]], [["≥70 kg"], ["5"], ["5"]]]},
 {t:"g",title:"Supplemental pyridoxine (all patients receiving isoniazid-containing regimens):",rows:[R("pyridoxine","po","C E","25mg (adults) / 12.5mg (paeds)","once a day","for the duration of INH-based therapy")]},
 {t:"h",x:"Adverse medicine reactions"},
 {t:"p",x:"All suspected adverse drug reactions (ADR) must be reported to the Medicines Control Authority of Zimbabwe (MCAZ) using spontaneous Adverse Drug Reaction reporting forms or the MCAZ online reporting platform (e-pv.mcaz.co.zw)."},
 {t:"h",x:"Anti-TB induced hepatitis"},
 {t:"p",x:"In the event of an adverse reaction to anti-TB medicines, stop all TB medicines and assess. If necessary, evaluate the liver function then reintroduce one medicine at a time and build up gradually. Start with isoniazid at 25 mg, the least likely to cause a reaction, and end with the most likely toxic, e.g. pyrazinamide in jaundice/hepatotoxicity. When the required dose has been achieved without any reaction, another medicine should be re-introduced in a similar manner, slowly, increasing the dose daily, as shown below. Refer to the National TB and Leprosy Guidelines for further guidance on management of adverse events."},
 {"t": "m", "title": "How to reintroduce anti-TB medicines after drug-induced hepatitis", "li": 0, "cols": ["Day", "Medicines"], "rows": [[["Day 1"], ["INH 25 mg"]], [["Day 2"], ["INH 50 mg"]], [["Day 3"], ["INH 100 mg"]], [["Day 4"], ["INH 300 mg"]], [["Day 5"], ["INH 300 mg + R 150 mg"]], [["Day 6"], ["INH 300 mg + R 300 mg"]], [["Day 7"], ["INH 300 mg + R 450 mg"]], [["Day 8"], ["INH 300 mg + R 600 mg (depends on weight)"]], [["Day 9"], ["INH 300 mg + R 600 mg + E 400 mg"]], [["Day 10"], ["INH 300 mg + R 600 mg + E 800 mg"]], [["Day 11"], ["INH 300 mg + R 600 mg + E 1.2 g (depends on weight)"]], [["Day 12"], ["INH 300 mg + R 600 mg + E 1.2 g + Z 400 mg"]], [["Day 13"], ["INH 300 mg + R 600 mg + E 1.2 g + Z 800 mg"]], [["Day 14"], ["INH 300 mg + R 600 mg + E 1.2 g + Z 1.2 g"]], [["Day 15"], ["INH 300 mg + R 600 mg + E 1.2 g + Z 1.6 g (depends on weight)"]]], "note": "These are adult doses (the print table does not state this). INH = isoniazid, R = rifampicin, E = ethambutol, Z = pyrazinamide."},
 {t:"h",x:"TB and HIV co-infection"},
 {t:"p",x:"Refer to the current national ARV guidelines as well as the TB manual. Also refer to the ARV chapter in this EDLIZ (see the HIV pages “ART: use of ARVs in patients with TB”)."}]},
{id:"tb-dr",name:"Drug-resistant TB (DR-TB)",sec:"Tuberculosis",src:"EDLIZ 2025, Tuberculosis chapter",blocks:[
 {t:"p",x:"Drug resistant TB (DR-TB) is the presence of MTB bacilli resistant to one or more anti-tuberculosis medicines. Resistance patterns are defined as follows:"},
 {"t": "m", "title": "DR-TB resistance patterns", "li": 0, "cols": ["Pattern", "Definition"], "rows": [[["**Mono-resistance"], ["Resistance to one first-line drug only (H, R, Z, E or S)"]], [["**Poly-resistance"], ["Resistance to more than one first-line drug, excluding combination of H and R"]], [["**Rifampicin resistance (RR)"], ["Resistance to rifampicin with or without resistance to other anti-TB drugs, including any resistance to rifampicin (i.e. including mono- and poly-resistance)"]], [["**Multidrug resistance (MDR-TB)"], ["Resistance to at least both H and R"]], [["**Pre-extensively drug-resistant tuberculosis (Pre-XDR)"], ["Resistance to fluoroquinolones in addition to H and R"]], [["**Extensively drug-resistant tuberculosis (XDR)"], ["Resistance to H, R, a fluoroquinolone plus any other second-line anti-TB medicine found in Group A (bedaquiline, linezolid)"]]]},
 {t:"p",x:"In Zimbabwe, most patients are enrolled into the DR-TB treatment programme following an Xpert MTB/Rif (Ultra) or Truenat MTB/Rif test confirming resistance to rifampicin (MTB detected/Rif resistance detected). Such patients receive the recommended DR-TB treatment regimen, 6BPaLM, which comprises 6 months treatment with bedaquiline, pretomanid, linezolid and moxifloxacin. (For alternative regimens for RR-TB, regimens for children, extrapulmonary DR-TB and other forms of DR-TB, refer to the Clinical Management of Drug-Resistant Tuberculosis Guidelines, 2023.)"},
 {t:"p",x:"While patients may have documented risk factors that predispose them to DR-TB, patients may also present with a primary episode of DR-TB with no apparent risk factors. Risk factors for developing DR-TB (or worsening the pattern of resistance) include, but are not limited to:"},
 {t:"ul",x:["Patients who remain (or again become) smear positive during or after completing a TB treatment regimen.","Improper treatment of TB/DR-TB, which includes treatment interruptions and incorrect doses for the patient’s weight.","Contact with a DR-TB patient.","HIV infection.","Residence in high burden DR-TB regions."]},
 {t:"p",x:"The management of DR-TB or XDR-TB cases is rapidly changing with emerging evidence on more patient friendly and effective regimens. The drugs and drug grouping used in the treatment of DR-TB are shown in the table below. For the latest guidance and practice recommendations on the management of DR-TB, please refer to the Clinical Management of Drug-Resistant Tuberculosis Guidelines."},
 {t:"h",x:"DR-TB medicines used in Zimbabwe"},
 {t:"p",x:"Second-line medicines are B level medicines with V level of priority. Management of DR-TB (excluding Hr-TB) is to be done from a secondary level health facility where there is a multidisciplinary site DR-TB concilium. Medicines found here should be adequate for the treatment of the corresponding number of DR-TB recipients of care."},
 {"t": "m", "title": "DR-TB medicines used in Zimbabwe", "li": 0, "cols": ["Drug grouping and rationale", "Medications"], "rows": [[["**Group A", "Drugs associated with improved outcomes and lower mortality in individual patient data/meta-analysis"], ["Bedaquiline", "Levofloxacin or moxifloxacin", "Linezolid"]], [["**Group B", "Drugs associated with improved outcomes in IPD/meta-analysis"], ["Clofazimine", "Cycloserine"]], [["**Group C", "Remaining agents for regimen construction listed in order of priority for use"], ["Ethambutol", "Delamanid", "Pyrazinamide", "Carbapenems plus clavulanic acid", "Amikacin", "Ethionamide/prothionamide", "PAS"]]], "note": "EDLIZ is mainly a primary care document, so specialist level care is kept brief: DR-TB is a specialist level disease and the 6BPaLM doses are not given here."}]},
{id:"ob-contra-pills",name:"Oral contraceptives and their interactions",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"p",x:"Medicines should be avoided, if possible, throughout pregnancy, and especially during the first trimester. However, medicines may be required for a number of conditions commonly encountered during pregnancy; medicines which are appropriate and safe are covered in the sections that follow. At the end of the chapter is a list of those medicines which should be avoided or used with caution during pregnancy or lactation. The Family Planning Guidelines of Zimbabwe provide comprehensive guidance. Refer to them wherever possible. Instructions for use, contraindications etc, are also found in the manufacturers' package inserts."},
 {t:"h",x:"Hormonal contraception"},
 {t:"p",x:"Important: Ensure a free and informed choice by providing counselling on the advantages and disadvantages of contraceptive methods. Oral, injectable and implants do not protect against HIV. For added protection there is need to use a barrier contraceptive such as a male or female condom."},
 {t:"h",x:"Checklist for those not trained in family planning"},
 {t:"p",x:"Before prescribing oral contraceptives ask the following questions. If answers to all these questions are ‘no’, the woman may be given any oral contraceptives. If any of the answers are ‘yes’, a doctor must see her first."},
 {t:"ul",x:["History of severe leg pain or swelling of calf?", "History of sugar in urine?", "History of yellow eyes or skin?", "Severe chest pain?", "Unusual shortness of breath after walking or light work?", "Severe headaches (not relieved by pain tablets)?", "Bleeding between periods or after sexual intercourse?", "Missed a menstrual period?", "Missed a menstrual period, and then started bleeding?", "Very heavy menstrual periods?", "Increased frequency of menstrual periods?", "History of mental disturbances?", "Goitre or history of goitre?", "40 years of age and over?", "Painful varicose veins?", "Had any surgical operation within last 2 weeks?", "Previous treatment for high blood pressure?", "History of epilepsy?"]},
 {t:"h",x:"Oral contraceptives"},
 {t:"p",x:"IMPORTANT: Instruct the woman to always inform the doctor or nurse that she is taking oral contraceptives when she attends a clinic or hospital. Encourage clients to have a check-up every two years or when she develops a problem."},
 {t:"p",x:"Ensure that the supplies given to the woman allow her to always have an extra pack of pills. Also, provide a supply of condoms with the first pack of pills for additional protection if the client is not menstruating. Encourage use of condoms as well to protect against STIs especially HIV."},
 {t:"h",x:"Combined oral contraceptives (COCs)"},
 {t:"p",x:"These contain synthetic oestrogen and progestogen and if taken daily they inhibit ovulation. Those with oestrogen content 30-35 micrograms (as ethinyl oestradiol) are ‘low dose’ while those containing 50 micrograms of oestrogen are referred to as ‘high dose’."},
 {t:"p",x:"The lower oestrogen dose pills have fewer side effects than higher dose pills (notably, reduced risk of thrombo-embolism) while maintaining a high rate of effectiveness."},
 {t:"p",x:"Menstruation on COCs will be regular and light."},
 {t:"p",x:"Can be used to treat other conditions, such as: period pain, heavy periods, acne, endometriosis, premenstrual syndrome."},
 {t:"p",x:"CAUTION: Side effects include mood swings, breast tenderness, and headaches."},
 {t:"ul",x:["If patient starts pill after an abortion, or on the first day of a period, it will work straight away.", "If patient starts the pill on any other day, then abstain from sex for 7 days or use extra precautions (e.g. condoms).", "Not suitable for women over 35 who smoke.", "Small risk of blood clots.", "Not suitable for women with high blood pressure."]},
 {t:"g",ad:1,title:"Pill-based contraceptives (COCs):",rows:[R("combined oral contraceptive","(COC) pill","C V","1 tablet","once daily","")]},
 {t:"p",x:"Each COC pill contains either 50mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “high dose” COC) or 30-35mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “low dose” COC)"},
 {t:"h",x:"Conditions warranting withdrawal of combined oral contraceptives"},
 {t:"ul",x:["pregnancy or suspected pregnancy", "severe headaches especially associated with visual disturbances", "numbness or paresis of extremities", "unexplained vaginal bleeding", "suspected or known carcinoma of the breast", "known liver tumour", "unexplained chest pain or shortness of breath", "severe leg pains", "development of any of the absolute contra-indications mentioned in the manufacturer’s information sheet"]},
 {t:"h",x:"Progestogen only pills (POPs)"},
 {t:"p",x:"These contain synthetic progestogen e.g. norethisterone or levonorgestrel. Progestogens protect against pregnancy by thickening the cervical mucus."},
 {t:"ul",x:["suitable for women who do not want to or cannot take oestrogen for health reasons", "can be used by women who are breastfeeding", "can be used by women who smoke"]},
 {t:"p",x:"CAUTION: Progestogen only pills have a significant failure rate in non-lactating women."},
 {t:"ul",x:["They should be taken at the same time each day.", "Menstrual irregularities are a more common side effect.", "If patient starts pill after an abortion, or on the first day of a period, it will work straight away.", "If patient starts the pill on any other day, then abstain from sex for 2 days or use extra precautions (e.g. condoms)."]},
 {t:"g",ad:1,title:"Pill-based contraceptives (POPs/Secure):",rows:[X(R("levonorgestrel","","C V","1 tablet","once a day",""),"pop-daily")]},
 {t:"p",x:"Each Secure (POP) pill contains 750mcg levonorgestrel"},
 {t:"h",x:"Medicines interactions with oral contraceptives"},
 {t:"h",x:"Medicines reducing the effect of oral contraceptives"},
 {t:"p",x:"Caution is needed when prescribing any of the following medicines to any woman taking oral contraceptives; they reduce the effectiveness of the oral contraceptive and pregnancy is more likely:"},
 {t:"ul",x:["Anti-convulsant: carbamazepine, ethosuximide, phenobarbitone, phenytoin, primidone.", "Antibacterials: rifampicin, rifabutin, rifapentine", "Anti-retroviral: efavirenz"]},
 {t:"p",x:"If the medicine is only going to be used for a short time the woman should be advised to take extra contraceptive precautions (for example, condoms) for the duration of the therapy, and seven days after treatment. If the medicine is to be used on a long-term basis the woman should be advised to use another suitable method of contraception."},
 {t:"h",x:"Medicines which are made less effective by oral contraceptives"},
 {t:"p",x:"Doses of medicines may need to be increased, with careful monitoring:"},
 {t:"ul",x:["Anticoagulants", "Anti-convulsant (phenytoin)", "Antidepressants (imipramine)", "Anti-hypertensive agents (methyldopa)", "Corticosteroids", "Hypnotics, sedatives or other CNS depressants (diazepam, phenothiazines)", "Anti-asthmatic agents"]}]},
{id:"ob-contra-long",name:"Injectable and implant contraceptives, emergency contraception, IUCD",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Long term hormonal contraceptives"},
 {t:"g",ad:1,title:"Injectable contraceptive:",rows:[R("medroxyprogesterone acetate","im","C V","150mg","once every 3 months","3 months"),"OR",R("norethisterone enanthate","im","B N","200mg","once every 2 months","2 months")]},
 {t:"p",x:"CAUTION: If the woman is hypertensive, has a history of heart disease, or has signs of damage to the arteries, vision, kidneys, and/or nervous system caused by diabetes, do not administer medroxyprogesterone [Depo-provera ®]."},
 {t:"p",x:"Side effects of medroxyprogesterone are like those of Progestogen Only Pills i.e. headaches, irregular uterine bleeding, nausea and vomiting, weight changes and depression. Transient infertility and irregular cycles may occur after discontinuation."},
 {t:"p",x:"Note: Norethisterone enanthate can be given up to 2 weeks (14 days) early or 2 weeks (14 days) late."},
 {t:"h",x:"Implant contraceptives"},
 {t:"ul",x:["suitable for women who desire a long term family planning solution, for example, those who have probably completed their family but are not yet ready for sterilisation", "also suitable for some women who cannot take oestrogen-containing contraceptives", "HIV positive women of childbearing age who are on a dolutegravir-based regimen should be encouraged to use them"]},
 {t:"g",ad:1,title:"Implant contraceptive:",rows:[R("levonorgestrel","implant (Jadelle)","B N","2 rods","once only","once in 5yrs"),R("etonogestrel","(Implanon)","B N","1 rod","once only","once in 3yrs")]},
 {t:"p",x:"CONTRAINDICATIONS: hypertension; thromboembolism; active liver disease; undiagnosed genital bleeding, severe headaches, malignancy of breast (known or suspected); malignancy of cervix, uterus or ovaries (known or suspected), cerebrovascular or coronary artery disease, pregnancy or suspected pregnancy."},
 {t:"h",x:"Emergency contraception"},
 {t:"g",ad:1,title:"Hormonal method – Give within 72 hours of unprotected intercourse:",rows:[R("combined oral contraceptive","(COC) pill","C V","2 tablets","repeat after 12 hours",""),"OR",R("combined oral contraceptive","pill","C V","4 tablets","repeat after 12 hours",""),"OR",R("levonorgestrel","750mcg","C V","1 tablet","repeat after 12 hours",""),"OR",R("levonorgestrel","1500mcg","C V","2 tablets","once","")]},
 {t:"p",x:"Use this regimen if COC pill contains 50mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “high dose” COC)"},
 {t:"p",x:"Use this regimen if COC pill contains 30-35mcg ethinyloestradiol + 150-250mcg levonorgestrel (aka “low dose” COC)"},
 {t:"p",x:"Note: For all emergency contraceptives, advise to return if menstruation does not occur within 3 weeks. Give appropriate contraceptive advice."},
 {t:"h",x:"Emergency contraception: intrauterine device method"},
 {t:"g",ad:1,title:"Intrauterine contraceptive device (IUCD) method – insert within 5 days of unprotected intercourse:",rows:[R("Copper T IUCD","","B N","1 device","once only","once in 10yrs")]},
 {t:"p",x:"CAUTION: may experience heavy menstrual periods and increased menstrual cramps (dysmenorrhea)."}]},
{id:"ob-gu-infections",name:"Genito-urinary infections in pregnancy",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Urinary tract infection during pregnancy"},
 {t:"p",x:"If possible, send urine specimens for microscopy, culture and sensitivity. If urine culture is positive, change antibiotics according to sensitivity results. Urine strips can also be used to detect UTI especially at the primary health care level."},
 {t:"g",ad:1,title:"First line:",rows:[R("amoxicillin","po","C V","500mg","3 times a day","*7 days"),"OR",R("ciprofloxacin","po","B V","500mg","2 times a day","*7 days")]},
 {t:"p",x:"*Note: The duration of treatment for UTI in pregnancy is longer than other general UTI."},
 {t:"p",x:"CAUTION: avoid ciprofloxacin in first trimester or preferably avoid completely during pregnancy if a safer alternative is available."},
 {t:"g",ad:1,title:"Second line:",rows:[R("norfloxacin","","B N","400mg","3 times a day","*7 days"),"OR",R("nalidixic acid","po","B V","500mg","4 times a day","*7 days"),"OR",R("amoxicillin-clavulanic acid","po","B N","375mg","3 times a day","*7 days")]},
 {t:"p",x:"*Note: The duration of treatment for UTI in pregnancy is longer than other general UTI."},
 {t:"p",x:"Third line: as per culture and sensitivity."},
 {t:"h",x:"Positive serology for syphilis during pregnancy"},
 {t:"p",x:"Rapid point of care screening must be done at the first antenatal contact for all pregnant mothers."},
 {t:"g",ad:1,title:"Both partners to be counselled and treated with:",rows:[R("benzathine penicillin","im","C V","2.4MU (=1.44g)","once a week","3 doses")]},
 {t:"p",x:"See chapter on Sexually Transmitted Infections for further information particularly for women who are allergic to penicillin."},
 {t:"h",x:"Vaginal discharge during pregnancy"},
 {t:"p",x:"The discharge can be due to candidiasis, bacterial vaginosis, trichomoniasis or physiological. A syndromic diagnosis should be made before treatment. There is need to consider the possibility of sexually transmitted infections including gonorrhoea and chlamydia (see Sexually Transmitted Infections chapter)."},
 {t:"g",ad:1,title:"Vaginal discharge during pregnancy:",rows:[R("miconazole","pv","C V","200mg","every night","3 days"),"OR",R("clotrimazole","pessary","C V","500mg","every night","3 days"),"AND",R("metronidazole","po","C V","400mg","3 times a day","7 days"),"OR",R("secnidazole","po","B N","2g","once only","")]},
 {t:"p",x:"Clotrimazole cream can also be used."},
 {t:"p",x:"CAUTION: avoid metronidazole in 1st trimester."}]},
{id:"ob-sepsis-pid",name:"Post-miscarriage sepsis and pelvic inflammatory disease",sec:"Obstetrics and gynaecology",aud:"adult",src:"EDLIZ 2025, Obstetric and Gynaecological Conditions chapter",blocks:[
 {t:"h",x:"Post-miscarriage sepsis"},
